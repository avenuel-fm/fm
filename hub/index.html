<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통합 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<title>통합 대시보드 · 에비뉴엘 시설팀</title>
<style>
/* DESIGN-TOKENS:START */
/* 디자인 값은 이 파일에만 적습니다. 고친 뒤 python apps/design/sync.py 를 돌리면 모든 앱에 들어갑니다. */
:root{
  /* 기본 색 6가지 */
  --navy:#1E3A5F;     /* 주 색상: 머리줄, 주요 버튼, 강조 숫자, 그래프 */
  --white:#FFFFFF;    /* 바탕 */
  --text-sub:#5F6B7A; /* 보조 글자 */
  --line:#D8DDE5;     /* 구역을 나누는 선, 입력칸 테두리 */
  --tint:#F1F4F8;     /* 고른 줄, 표 머리 */
  --error:#B42318;    /* 오류 문구 전용 */

  /* 글자 크기 */
  --size-s:13px; --size-m:15px; --size-l:18px; --size-xl:24px; --size-xxl:32px;
  --size-input-touch:16px; /* 휴대폰 입력칸 전용: 16px보다 작으면 아이폰이 화면을 저절로 확대함 */

  /* 간격 (4의 배수) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;

  /* 모양 */
  --radius:2px;          /* 모든 모서리 */
  --control-h:40px;      /* 버튼, 입력칸 높이 */
  --control-h-touch:44px;/* 휴대폰의 버튼, 입력칸 높이 */

  /* 팝업 뒤를 어둡게 하는 막 (남색 45%) */
  --overlay:rgba(30,58,95,.45);
  --font:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
@media (pointer:coarse){
  :root{--control-h:var(--control-h-touch)}
  input:not([type=checkbox]):not([type=radio]):not(.lgin),textarea:not(.lgin),select:not(.lgin){font-size:var(--size-input-touch)!important}
}

/* 인쇄·PDF·라벨 양식은 종이 기준이라 원래 색을 그대로 씁니다 (화면 디자인 규칙에서 제외) */
#print,.tbp,.cspdf,.label,.ehl,.ehlt,.ehg,.hvs,.lgs,.page,.ag-paper,.ag-page{
  color:#18202B;
  --ink:#18202B; --ink2:#2A3340; --sub:#3F4855; --muted:#5B6573; --faint:#7A8494;
  --line:#CBD2DB; --line2:#DCE1E7; --line3:#EDF0F3; --ground:#F4F6F8; --card:#FFFFFF;
  --blue:#1F5FA8; --blue-d:#174A84; --blue-bg:#E8F0FA;
  --green:#1F7A4D; --green-d:#155C39; --green-bg:#EAF5EF;
  --orange:#B4410F; --orange-bg:#FDF0E8; --red:#C0261A; --red-bg:#FBE9E7;
}
/* DESIGN-TOKENS:END */
  html,body{margin:0;height:100%;background:var(--tint);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--navy)}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:var(--tint)}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-6);text-align:center;font-size:var(--size-m);line-height:1.6}
  .spin{width:28px;height:28px;border:3px solid #1F5FA8;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--control-h);padding:0 var(--sp-4);border-radius:var(--radius);background:var(--navy);color:var(--white);text-decoration:none;font-weight:500}
  .slow{display:none}
  small{color:var(--text-sub)}
</style>
<script src="../apps.js"></script>
</head>
<body>
<div class="msg" id="msg"><div class="spin" aria-hidden="true"></div><span>통합 대시보드 여는 중…</span>
  <div class="slow" id="slow"><small>오래 걸리면 아래를 눌러 주세요.</small><br><br><a class="btn" id="direct" href="#" target="_blank" rel="noopener">새 창에서 열기</a></div>
</div>
<script>
(function () {
  var KEY = 'hub';
  var app = (window.FM_APPS || {})[KEY] || {};
  var msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/(macros|a\/macros\/[\w.-]+)\/s\/[\w-]+\/exec$/.test(app.exec || '')) {
    msg.innerHTML = '<b>아직 앱 주소가 등록되지 않았습니다.</b><small>apps.js 파일의 ' + KEY + ' 항목에 웹앱 /exec 주소를 넣어 주세요.</small>';
    return;
  }
  // 받은 주소 뒤의 값(?fe=…, ?t=… 등)을 그대로 앱에 넘김
  var src = app.exec + (location.search || '');
  document.getElementById('direct').href = src;
  var f = document.createElement('iframe');
  f.src = src;
  f.title = app.name || '';
  f.setAttribute('allow', 'camera; clipboard-read; clipboard-write; fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.addEventListener('load', function () { msg.style.display = 'none'; });
  document.body.appendChild(f);
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 12000);
})();
</script>
</body>
</html>
