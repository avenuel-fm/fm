<style>
/* 공통 틀 v0.1 — 도면협의 Styles.html 기준 이름 (통합 설계정의서 12장) */
/* DESIGN-TOKENS:START */
/* 디자인 값은 이 파일에만 적습니다. 고친 뒤 python apps/design/sync.py 를 돌리면 모든 앱에 들어갑니다. */
:root{
  /* 기본 색 6가지 */
  --navy:#1E3A5F;     /* 주 색상: 머리줄, 주요 버튼, 강조 숫자, 그래프 */
  --white:#FFFFFF;    /* 바탕 */
  --text-sub:#5F6B7A; /* 보조 글자 */
  --line:#D8DDE5;     /* 구역을 나누는 선, 입력칸 테두리 */
  --tint:#F1F4F8;     /* 고른 줄, 표 머리 */
  --error:#B42318;    /* 오류 문구 전용 */

  /* 글자 크기 */
  --size-s:13px; --size-m:15px; --size-l:18px; --size-xl:24px; --size-xxl:32px;
  --size-input-touch:16px; /* 휴대폰 입력칸 전용: 16px보다 작으면 아이폰이 화면을 저절로 확대함 */

  /* 간격 (4의 배수) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;

  /* 모양 */
  --radius:2px;          /* 모든 모서리 */
  --control-h:40px;      /* 버튼, 입력칸 높이 */
  --control-h-touch:44px;/* 휴대폰의 버튼, 입력칸 높이 */

  /* 팝업 뒤를 어둡게 하는 막 (남색 45%) */
  --overlay:rgba(30,58,95,.45);
  --font:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
@media (pointer:coarse){
  :root{--control-h:var(--control-h-touch)}
  input:not([type=checkbox]):not([type=radio]):not(.lgin),textarea:not(.lgin),select:not(.lgin){font-size:var(--size-input-touch)!important}
}

/* 인쇄·PDF·라벨 양식은 종이 기준이라 원래 색을 그대로 씁니다 (화면 디자인 규칙에서 제외) */
#print,.tbp,.cspdf,.label,.ehl,.ehlt,.ehg,.hvs,.lgs,.page,.ag-paper,.ag-page{
  color:#18202B;
  --ink:#18202B; --ink2:#2A3340; --sub:#3F4855; --muted:#5B6573; --faint:#7A8494;
  --line:#CBD2DB; --line2:#DCE1E7; --line3:#EDF0F3; --ground:#F4F6F8; --card:#FFFFFF;
  --blue:#1F5FA8; --blue-d:#174A84; --blue-bg:#E8F0FA;
  --green:#1F7A4D; --green-d:#155C39; --green-bg:#EAF5EF;
  --orange:#B4410F; --orange-bg:#FDF0E8; --red:#C0261A; --red-bg:#FBE9E7;
}
/* DESIGN-TOKENS:END */
:root{ /* 예전 이름 → 기본 색 6가지 */
  --ink:var(--navy); --ink2:var(--navy); --sub:var(--text-sub); --muted:var(--text-sub); --faint:var(--text-sub);
  --line2:var(--line); --line3:var(--line); --ground:var(--white); --card:var(--white);
  --blue:var(--navy); --blue-d:var(--navy); --blue-bg:var(--tint);
  --green:var(--navy); --green-d:var(--navy); --green-bg:var(--tint);
  --orange:var(--navy); --orange-bg:var(--tint); --red:var(--error); --red-bg:var(--tint);
}
*{box-sizing:border-box}
/* WS-25 화면 다듬기: 단어 중간 줄바꿈 막기, 제목·강조 600 (인쇄·라벨·PDF 양식은 700 그대로) */
body{word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,b,strong{font-weight:600}
.tbp b,.tbp strong,.tbp h1,.cspdf b,.cspdf strong,.label b,.ehlt b{font-weight:700}
.tbp,.cspdf,.label,.ehlt,.ehg{word-break:normal;overflow-wrap:normal}
.ui-ico{display:inline-block;flex:none;vertical-align:-3px}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);min-height:var(--control-h);padding:0 var(--sp-4);border-radius:var(--radius);border:1px solid var(--line);background:var(--card);font-size:var(--size-m);font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){.btn{transition:scale .15s ease-out}.btn:not(:disabled):active{scale:.96}}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--white);font-weight:500}
.btn.warn{border-color:var(--line);color:var(--red)}
.btn.sm{min-height:var(--control-h);padding:0 var(--sp-3);font-size:var(--size-s)}
.btn.big{min-height:var(--control-h);font-size:var(--size-m)}
.inp{width:100%;min-height:var(--control-h);padding:0 var(--sp-3);border:1px solid var(--line);border-radius:var(--radius);font-size:var(--size-m);background:var(--white)}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius)}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);height:26px;padding:0 var(--sp-2);border-radius:var(--radius);font-size:var(--size-s);font-weight:500;white-space:nowrap}
.c-ok{background:var(--green-bg);color:var(--green)}
.c-bad{background:var(--orange-bg);color:var(--orange)}
.c-wait{background:var(--tint);color:var(--muted)}
.c-miss{background:var(--red-bg);color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);font-size:var(--size-m);z-index:100;max-width:calc(100% - 32px);box-shadow:none}
.dialog-back{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dialog{width:100%;max-width:520px;background:var(--white);border-radius:var(--radius) var(--radius) 0 0;padding:var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain}
@media (min-width:700px){.dialog-back{align-items:center}.dialog{border-radius:var(--radius)}}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}

/* 상태는 색이 아니라 모양과 글자로 구분: 문제 = 채움, 정상 = 남색 테두리, 대기 = 회색 테두리 */
.chip{border:1px solid transparent}
.c-bad,.c-miss,.chip.orange{background:var(--navy);color:var(--white);border-color:var(--navy)}
.c-ok,.chip.green{background:var(--white);color:var(--navy);border-color:var(--navy)}
.c-wait{background:var(--white);color:var(--text-sub);border-color:var(--line)}
.chip.blue{background:var(--tint);color:var(--navy);border-color:var(--line)}
.btn.warn{background:var(--white);color:var(--navy);border-color:var(--navy)}
</style>
<style>
/* 어두운 화면 (결정 98): 화면만 색을 뒤집고 사진·서명·QR은 되돌림. 인쇄·저장 이미지는 그대로 흰 바탕 */
@media screen{
html[data-theme=dark]{filter:invert(1) hue-rotate(180deg) contrast(.78)}   /* 검정 대신 진한 회색 (사용자 11-11) */
html[data-theme=dark] :is(img,video,canvas,.keep-color):not(.keep-color *){filter:invert(1) hue-rotate(180deg)}

</style>
<script>
/* 기기에 고른 값 → 없으면 휴대폰 설정. 화면 그리기 전에 정해서 번쩍임 없음 */
(function () { var t = null; try { t = localStorage.getItem('fm_theme'); } catch (e) {} if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();
function themeDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function toggleTheme() { var t = themeDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('fm_theme', t); } catch (e) {} document.querySelectorAll('.theme-btn').forEach(function (b) { b.textContent = themeLabel(); }); }
function themeLabel() { return themeDark() ? '밝게' : '어둡게'; }
</script>

}

        '<label class="tbf"><span>재해형태</span><input class="inp" maxlength="30" value="' + h(r.kind) + '" oninput="rkIn(' + i + ',\'kind\',this)"></label>' +

function rkDirty() { S.rk.dirty = true; const e = $('rkSt'); if (e) e.textContent = '고친 내용 있음'; }
function rkIn(i, c, el) { S.rk.rows[i][c] = el.value; rkDirty(); }
function rkSet(i, c, n) { S.rk.rows[i][c] = n; rkDirty(); render(); }
function rkFix(i, j, c, el) { const f = S.rk.rows[i].fixes; while (f.length <= j) f.push({ t: '', on: false }); f[j][c] = c === 'on' ? el.checked : el.value; rkDirty(); }
function rkOpen(i) { S.rk.open = S.rk.open === i ? -1 : i; render(); }
function rkMove(i, d) { const L = S.rk.rows, j = i + d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; if (S.rk.open === i) S.rk.open = j; else if (S.rk.open === j) S.rk.open = i; rkDirty(); render(); }
function rkDel(i) { if (!confirm('「' + (S.rk.rows[i].risk || (i + 1) + '번') + '」 줄을 지울까요? (저장해야 반영)')) return; S.rk.rows.splice(i, 1); S.rk.open = -1; rkDirty(); render(); }
function rkAdd() { S.rk.rows.push({ words: '', risk: '', kind: '', p: 1, s: 1, fixes: [] }); S.rk.open = S.rk.rows.length - 1; rkDirty(); render(); window.scrollTo(0, document.body.scrollHeight); }
async function rkSave() {
  const k = S.rk; k.busy = true; render();

  } finally { k.busy = false; if (S.rk === k) render(); }
}

/* 미리 받기 (결정 78): 메인이 뜬 뒤 자주 여는 화면 내용을 뒤에서 받아 두고, 열 때 바로 보여 준 뒤 새로 받음 */
const PRE = {};
function prefetch() {
  if (!S.token) return;
  run('tbmGet', S.token).then(r => { if (r && r.ok) PRE.tbm = { at: Date.now(), r }; }).catch(() => {});
  run('nextWorkGet', S.token, '').then(r => { if (r && r.ok) PRE.nw = { at: Date.now(), r }; }).catch(() => {});
}
function takePre(k) { const p = PRE[k]; delete PRE[k]; return p && Date.now() - p.at < 600000 ? p.r : null; }   // 10분 넘은 것은 버림
async function openTbm() { S.tbm = null; const p = takePre('tbm'); go('tbm'); if (p) tbmUse(p); await loadTbm(true); }

/* ── TBM 작성 · PDF (WS_서류작업 4-1~5장, 결정 58·66·70) ── */
const TBM_CHECKS = ['사다리', '비계', '우마', '테이블리프트', '크레인', '스카이', '달비계', '용접기'];
const TBM_CHECK_WORDS = { '사다리': ['사다리'], '비계': ['비계'], '우마': ['우마', '말비계'], '테이블리프트': ['테이블리프트', '고소작업대', '렌탈'], '크레인': ['크레인'], '스카이': ['스카이'], '달비계': ['달비계'], '용접기': ['용접'] };
function tbmText(w) { return (w.work || '') + ' ' + (w.note || ''); }
function tbmHas(t, k) { if (k === '비계') t = t.replace(/[달말]비계/g, ''); return TBM_CHECK_WORDS[k].some(x => t.indexOf(x) !== -1); }
function tbmAutoChecks(works) { const t = works.map(tbmText).join(' '), o = {}; TBM_CHECKS.forEach(k => { if (tbmHas(t, k)) o[k] = true; }); return o; }
// 작업내용(+명일 비고)에서 목록을 위에서부터 보고 처음 맞는 위험요인, 없으면 「(기본)」 (4-2)
function tbmRiskFor(t) { const L = S.tbm.risks; return L.find(r => r.words.some(x => x !== '(기본)' && t.indexOf(x) !== -1)) || L.find(r => r.words.indexOf('(기본)') !== -1) || null; }
function tbmApply(w, r) { Object.assign(w, r ? { risk: r.risk, kind: r.kind, p: r.p, s: r.s, fixes: r.fixes.filter(f => f.on).map(f => f.t) } : { risk: '', kind: '', p: '', s: '', fixes: [] }); }
function tbmLv(p, s) { const v = p * s; return v ? v + ' (' + (v >= 6 ? '상' : v >= 3 ? '중' : '하') + ')' : ''; }
// 인원 = 그 줄 부서(=파트)의 오늘 서명 인원, 소장·부소장 빼고. 직접 넣으면 그 숫자
function tbmAutoN(w) { return S.tbm.signs.filter(x => x.part === w.dept && x.role !== '소장' && x.role !== '부소장').length; }
function tbmN(w) { return w.n !== '' && w.n != null ? Number(w.n) : tbmAutoN(w); }
async function loadTbm(quiet, day) {
  if (!quiet && S.tbm && S.tbm.dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 새로 불러올까요?')) return;
  const r = await call('tbmGet', day || (S.tbm ? S.tbm.day : ''));
  const t = S.tbm;
  // 뒤에서 새로 받는 중에 고치거나 저장 중이면, 고친 것은 두고 서명만 새로
  if (quiet && t && t.day === r.day && (t.dirty || t.busy || t.pdfBusy)) { Object.assign(t, { signs: r.signs, manager: r.manager }); if (S.view === 'tbm') render(); return; }
  tbmUse(r);
}
/** TBM 날짜 바꾸기 — 지난 날짜도 열어서 고치고 저장·PDF 가능 (11-13, 사용자) */
function tbmCal() {
  const r = S.tbm;
  pickDate({ cur: r.day, home: r.today || r.day, max: r.today || r.day, homeLbl: '오늘 TBM으로', fn: ds => {
    if (ds === S.tbm.day || (S.tbm.dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 다른 날짜를 열까요?'))) return;
    S.tbm = null; render(); loadTbm(true, ds);
  } });
}
function tbmUse(r) {
  const keep = S.tbm;
  S.tbm = Object.assign(r, { dirty: false, busy: false, pdfBusy: false, edit: keep ? keep.edit : -1, up: {}, showSigns: keep ? keep.showSigns : false, pdfStale: !!(r.pdf && r.at > r.pdf.at) });
  r.works.forEach(w => { w.fixes = w.fixes || []; if (w.risk === undefined) tbmApply(w, tbmRiskFor(tbmText(w))); });
  if (!r.checks) r.checks = tbmAutoChecks(r.works);
  if (S.docs) S.docs.signs = r.signs.length;
  if (S.view === 'tbm') render();

/* 그림 파일(PNG) — 양식 v2 칸 순서 그대로, 색·글자·모서리는 공통 디자인 값(결정 150). 그림 칸 1000px를 2배(가로 2000px)로 그림 */

  function rr(x0, y0, w, hh, r) { g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x0 + w, y0, x0 + w, y0 + hh, r); g.arcTo(x0 + w, y0 + hh, x0, y0 + hh, r); g.arcTo(x0, y0 + hh, x0, y0, r); g.arcTo(x0, y0, x0 + w, y0, r); g.closePath(); }

    if (box) { g.fillStyle = TINT; rr(x, 76, w, 32, R); g.fill(); g.strokeStyle = LINE; g.lineWidth = 1; g.stroke(); }
    g.fillStyle = NAVY; g.fillText(t, x + (box ? 12 : 0), 92);
    x += w + 8;
  };

  return cv;
}

/* ── 출근현황 (WS_출근현황 15.3.19, 결정 88) ── */
const AT_CODES = ['', '9-7', '휴', '연', '법', '야', '비', '병가', 'A반', 'P반', 'A검진', 'P검진'];

const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
function atCls(v) { return { '': 'on', '9-7': '97', '휴': 'hu', '연': 'yeon', '법': 'beop', '야': 'ya', '비': 'bi', '병가': 'sick', 'A반': 'ban', 'P반': 'ban', '전반': 'ban', '후반': 'ban', 'A검진': 'gj', 'P검진': 'gj' }[v] || 'etc'; }
function atLbl(v) { return v === '' ? '출' : v; }
function atRole(r) { return r === '교대반장' ? '교대' : r; }   // 교대반장이라는 직급은 없음 (사용자 11-07)
function atIsDay(v) { return v === '' || v === '9-7' || /^[AP](반|검진)$|^[전후]반$/.test(v); }   // 서버 atIsDay_와 같음

function atWd(d) { return WEEK[new Date(d + 'T12:00:00+09:00').getDay()]; }
function atKo(d) { return Number(d.slice(0, 4)) + '년 ' + Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + atWd(d) + ')'; }
function atTitle(sec) { return sec.indexOf('관') === 0 ? '관리파트' : /^공사장/.test(sec) ? sec.replace(/^공사장(?=\S)/, '공사장 ') : /^[가-힣]{4}$/.test(sec) ? sec.slice(0, 2) + '·' + sec.slice(2) : sec; }
/* 엑셀 줄 → 조직도 구역: 소장 = 사업소장, 나머지는 엑셀 구역 순서대로 (5장) */
function atGroups(people) {
  const out = [{ t: '사업소장', p: [] }];

  out.forEach(g => g.p.sort((a, b) => !a.name - !b.name));   // 공석은 구역 맨 끝 (sort는 같은 값끼리 순서 유지)

  const a = S.at || {};

      '<div class="nwmeta">같은 달을 다시 올리면 그 달을 새 것으로 바꿉니다. 그날 고친 것과 기본 휴일은 그대로 둡니다. (기본 휴일은 미리보기에 안 보임)</div></div>';
  } else body += '<div class="nwmeta">매월 초 만드는 근무 스케줄 엑셀 파일을 고르세요. 첫 번째 시트를 읽습니다.</div></div>';

}
async function atUpSave() {
  const u = S.atup; if (!u || !u.rows || u.busy) return;
  if (!/^\d{4}-\d{2}$/.test(u.ym || '')) return toast('저장할 달을 골라 주세요');
  u.busy = true; render();
  try {
    const r = await call('attPut', u.ym, u.rows, u.file);
    if (!r.ok) { u.busy = false; render(); return toast(r.error); }
    toast(ymLabel(u.ym) + ' 근무 스케줄 ' + r.count + '줄 저장'); S.atup = null; S.at = null; go('att'); loadAtt(S.atToday && S.atToday.slice(0, 7) === u.ym ? '' : u.ym + '-01');
  } catch (e) { u.busy = false; render(); }
}

/* 작성기(fm/thermal)가 부르는 통로 (결정 168, WS_열화상점검 3장). 자료는 PIN 로그인 표로 16_thermal.sql 함수만 */
const thExt = n => { const m = /\.([A-Za-z0-9]{1,5})$/.exec(String(n || '')); return m ? m[1].toLowerCase() : 'bin'; };
const thOk = r => { if (!r || !r.ok) throw new Error((r && r.error) || '저장하지 못했습니다'); return r; };
window.WS_THERMAL = {
  me: async () => ({ name: S.user ? S.user.name : '', role: S.user ? S.user.role : '' }),
  boot: async () => { const r = thOk(await call('thermalBoot')); return { me: r.me, model: r.model, template: r.template, template_url: r.template ? r.template.url : '', reports: r.reports }; },
  saveModel: async m => thOk(await call('thermalSet', 'model', m)),
  saveTemplate: async t => thOk(await call('thermalSet', 'template', t)),   // t = upload() 결과 + name
  upload: (blob, name) => WS_API.upload('thermal', blob, thExt(name)),   // 원본 그대로 (줄이지 않음)
  saveReport: async r => thOk(await call('thermalReport', r)),
  toDrive: async (path, name) => {   // 서버에 올린 PDF를 구글 드라이브 폴더로 복사 (구글 웹앱 ?api=thermaldrive, 결정 168)
    const C = window.WS_CONFIG || {};
    if (!C.WS_GAS_URL) throw new Error('구글 웹앱 주소가 설정에 없습니다');
    const r = await (await fetch(C.WS_GAS_URL + '?api=thermaldrive&path=' + encodeURIComponent(path) + '&name=' + encodeURIComponent(name || ''), { credentials: 'omit' })).json();
    if (!r.ok) throw new Error(r.error || '드라이브로 옮기지 못했습니다');
    return { ok: true, url: r.url };
  },
  full: on => mapFull(on)
};

/* ── CAD (WS_CAD.md): 변환된 도면(DXF) 뷰어 fm/cad 를 화면 안 창으로. 자료는 18_cad.sql 함수만 · 파일은 ws-files/cad + 구글 드라이브 사본 ── */
function renderCad() {
  return '<div class="mapview">' + topbar('업무지원 ›', 'CAD') + '<iframe class="mapframe" src="../cad/index.html" title="CAD 도면" allow="fullscreen"></iframe>' +
    '<button class="btn mapback" onclick="back()">' + ICON.back + '뒤로</button></div>';
}
const cadOk = r => { if (!r || !r.ok) throw new Error((r && r.error) || '처리하지 못했습니다'); return r; };
window.WS_CAD = {
  me: async () => ({ name: S.user ? S.user.name : '', role: S.user ? S.user.role : '' }),
  list: async () => { const r = cadOk(await call('cadList')); S.cadItems = r.items; S.cadCats = r.cats || []; S.cadCanDel = !!r.can_del_cat; return r.items; },
  cats: async () => ({ cats: S.cadCats || [], canDel: !!S.cadCanDel }),
  catAdd: async name => cadOk(await call('cadCatAdd', name)),
  catDel: async id => cadOk(await call('cadCatDel', Number(id))),
  setCat: async (id, cat) => cadOk(await call('cadSetCat', Number(id), cat ? Number(cat) : null)),
  open: async id => {   // 받은 파일은 이 기기 캐시에 보관 (주소가 올릴 때마다 새로 생겨 같은 주소 = 같은 파일)
    const it = (S.cadItems || []).find(x => x.id === String(id));
    if (!it) throw new Error('도면 목록에 없습니다. 목록을 다시 열어 주세요');
    let c = null; try { c = await caches.open('ws-cad'); } catch (e) {}
    let res = c ? await c.match(it.url) : null;
    if (!res) { res = await fetch(it.url); if (!res.ok) throw new Error('도면 파일을 받지 못했습니다'); if (c) { try { await c.put(it.url, res.clone()); } catch (e) {} } }
    return { name: it.name, dxfBlob: await res.blob() };
  },
  upload: async o => {   // 파일 → 서버(ws-files/cad) → 구글 드라이브 사본(실패해도 올림은 유지) → 목록 기록
    const f = o.file;
    if (!f || !/\.dxf$/i.test(f.name)) throw new Error('.dxf 파일만 올립니다');
    if (f.size > 50 * 1048576) throw new Error('파일이 너무 큽니다 (50MB 넘음)');
    const up = await WS_API.upload('cad', f, 'dxf');
    let drive = '', C = window.WS_CONFIG || {};
    try {
      if (C.WS_GAS_URL) { const j = await (await fetch(C.WS_GAS_URL + '?api=caddrive&path=' + encodeURIComponent(up.path) + '&name=' + encodeURIComponent(o.name || f.name), { credentials: 'omit' })).json(); if (j.ok) drive = j.url; }
    } catch (e) {}
    const r = cadOk(await call('cadSave', { name: o.name, floor: o.floor || '', memo: o.memo || '', path: up.path, url: up.url, size: f.size, drive_url: drive, cat_id: o.cat_id || '' }));
    return { ok: true, id: r.id, drive: !!drive };
  },
  full: on => mapFull(on)
};

/* ── 개선 A: 입력 기간 안내 ── */
function periodBanner(st, counts, u) {   // u = 세는 단위 (소화기 「대」, 소화전·공기호흡기 「곳」)
  u = u || '대';
  if (!st) return '';
  const w = st.window, d = st.day, m = Number(st.ym.slice(5, 7));
  if (!st.isCurrent) return st.ym < st.curYm ? '<div class="banner b-gray">' + ymLabel(st.ym) + ' · 입력 기간 ' + m + '/' + w.start + '~' + m + '/' + w.end + ' · 마감됨</div>' : '';
  if (d < w.start) return '<div class="banner b-gray">이번 달 입력은 ' + m + '월 ' + w.start + '일부터 받습니다.</div>';
  if (d <= w.end) {
    const left = w.end - d;
    if (counts.wait > 0 && left <= 1) return '<div class="banner b-warn"><b>마감 임박</b> · ' + m + '월 ' + w.end + '일까지 · 점검 전 <b>' + counts.wait + u + '</b></div>';
    return '<div class="banner b-info">이번 달 입력 기간 ' + m + '월 ' + w.start + '일 ~ ' + w.end + '일 · ' + (left === 0 ? '오늘 마감' : left + '일 남음') + ' · 점검 전 ' + counts.wait + u + '</div>';
  }
  if (counts.miss > 0) return '<div class="banner b-red"><b>기한 지남</b> · 미입력 ' + counts.miss + u + ' · 지금 입력해도 받고 「기한 후」로 표시합니다</div>';
  return '<div class="banner b-gray">이번 달 입력 기간이 끝났습니다.</div>';
}

/* ── 소화기 점검 메뉴 ── */

    '<div class="bar" style="height:8px"><span style="width:' + pct + '%;background:var(--green)"></span></div></div>' +

/* ── ③ 층별 소화전/공기호흡기 점검 현황 (결정 224 · 230, supabase/23_fire_equip.sql) ──
   앱에서는 조회만. 점검 입력은 붙어 있는 QR을 휴대폰으로 찍어 여는 eq.html 에서만 함 */
const EQ_KIND = { hyd: '소화전', air: '공기호흡기' };
async function openHyd(ym) { go('hyd'); await loadHyd(ym || ''); }
async function loadHyd(ym) { S.hq = null; render(); S.hq = await call('eqStatus', ym); S.hym = S.hq.ym; render(); }
function renderHyd() {
  const st = S.hq, T = topbar('소화기/소화전/공기호흡기 점검 ›', '층별 소화전/공기호흡기 점검 현황');
  if (!st) return T + '<div class="wrap"><div class="banner b-gray">불러오는 중…</div></div>';
  const c = st.counts, idx = st.months.indexOf(st.ym);
  const prev = idx > 0 ? st.months[idx - 1] : '';
  const next = idx >= 0 && idx < st.months.length - 1 ? st.months[idx + 1] : '';
  const nk = (it, k) => it.filter(i => i.kind === k).length;
  const floors = FLOORS.map(fl => {
    const it = st.items.filter(i => i.floor === fl);
    if (!it.length) return '';
    const fc = counts(it);
    const p = n => Math.round(n / fc.total * 100) + '%';
    return '<button class="floor" onclick="openHydFloor(\'' + fl + '\')"><span class="elbow"></span><b style="width:34px;font-size:var(--size-m)">' + fl + '</b>' +
      '<span class="fname" style="gap:var(--sp-1)"><span class="bar"><span style="width:' + p(fc.ok) + ';background:var(--green)"></span><span style="width:' + p(fc.bad) + ';background:var(--orange)"></span><span style="width:' + p(fc.miss) + ';background:var(--navy)"></span></span><small>소화전 ' + nk(it, 'hyd') + ' · 공기호흡기 ' + nk(it, 'air') + '</small></span>' +
      (fc.miss ? '<span class="chip c-miss">미입력 ' + fc.miss + '</span>' : '') + (fc.bad ? '<span class="chip c-bad">이상 ' + fc.bad + '</span>' : '') +
      '<b style="font-size:var(--size-s);color:var(--green)">' + (fc.ok + fc.bad) + '/' + fc.total + '</b>' + ICON.chev + '</button>';
  }).join('');
  const m = Number(st.ym.slice(5, 7));
  return T + '<div class="wrap list">' +
    '<div class="mnav"><button class="btn" aria-label="이전 달" ' + (prev ? 'onclick="loadHyd(\'' + prev + '\')"' : 'disabled') + '>‹</button><div><b style="font-size:var(--size-l)">' + ymLabel(st.ym) + '</b><small style="color:var(--muted)">입력 기간 ' + m + '/' + st.window.start + ' ~ ' + m + '/' + st.window.end + '</small></div><button class="btn" aria-label="다음 달" ' + (next ? 'onclick="loadHyd(\'' + next + '\')"' : 'disabled') + '>›</button></div>' +
    periodBanner(st, c, '곳') +
    '<div class="card legend"><span><span class="dot" style="background:var(--green)"></span>점검완료 <b>' + c.ok + '</b></span><span><span class="dot" style="background:var(--orange)"></span>이상 있음 <b>' + c.bad + '</b></span><span><span class="dot" style="background:var(--line)"></span>점검 전 <b>' + c.wait + '</b></span><span><span class="dot" style="background:var(--navy)"></span>미입력 <b>' + c.miss + '</b></span></div>' +
    '<div class="card tree"><div class="tree-root">' + ymLabel(st.ym) + ' · 전체 ' + c.total + '곳 (소화전 ' + nk(st.items, 'hyd') + ' · 공기호흡기 ' + nk(st.items, 'air') + ')</div>' +
    (floors || '<div style="padding:var(--sp-3) 0;color:var(--muted);font-size:var(--size-m)">이 달에 등록된 소화전·공기호흡기가 없습니다. ① QR 관리에서 등록해 주세요.</div>') + '</div>' +
    '<small style="text-align:center;color:var(--muted)">이 화면은 조회만 됩니다. 점검 입력은 소화전·공기호흡기에 붙어 있는 QR을 휴대폰으로 찍어서 합니다.</small>' +
    '<button class="btn" onclick="loadHyd(\'' + st.ym + '\')">새로고침</button></div>';
}
function openHydFloor(fl) { S.hfloor = fl; go('hydfl'); }
function renderHydFloor() {
  const st = S.hq, it = st.items.filter(i => i.floor === S.hfloor), m = Number(st.ym.slice(5, 7));
  const chips = FLOORS.map(f => '<button class="fl' + (f === S.hfloor ? ' on' : '') + '" aria-pressed="' + (f === S.hfloor) + '" onclick="S.hfloor=\'' + f + '\';render()">' + f + '</button>').join('');
  const sect = k => {
    const list = it.filter(i => i.kind === k);
    if (!list.length) return '';
    const done = list.filter(i => i.state === 'ok' || i.state === 'bad').length;
    return '<div class="store"><div class="store-h"><b>' + EQ_KIND[k] + '</b><small style="color:var(--muted)">' + done + ' / ' + list.length + '</small></div>' +
      list.map(i => {
        const has = i.state === 'ok' || i.state === 'bad';
        const sub = has ? h(i.by) + ' · ' + h(String(i.at).slice(5, 16)) + ' 입력' + (i.late ? ' · 기한 후' : '') : (i.state === 'miss' ? m + '월 ' + st.window.end + '일까지 입력 없음' : m + '월 ' + st.window.end + '일까지 입력 받는 중');

const LABEL_PRESETS = [[50, 50], [40, 40], [30, 34], [50, 30]];
// 라벨 프린터: BIXOLON SLP-TX400 (203dpi = 8점/mm). QR 한 칸이 프린터 점(dot) 정수 배가 되게 그려 흐림 없이 찍히게 함
function labelDpi() { return (S.qr && S.qr.label && Number(S.qr.label.dpi)) || (S.eh && Number(S.eh.dpi)) || 203; }
function qrMatrix(token, text, level) {   // text·level: 전열필증은 ?eh= 주소, 작은 칸이라 오류 보정 L (칸 수가 적어 점이 굵음)
  text = text || qrUrl(token);
  S.qrm = S.qrm || {};
  if (S.qrm[text]) return S.qrm[text];
  const tmp = document.createElement('div');
  const q = new QRCode(tmp, { text: text, width: 64, height: 64, correctLevel: QRCode.CorrectLevel[level || 'M'] });
  const m = q._oQRCode, n = m.getModuleCount(), rows = [];
  for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(m.isDark(r, c)); rows.push(row); }
  return (S.qrm[text] = rows);
}
// 원하는 크기(mm) 안에서 가장 큰 「점 정수 배」 QR 그림 → {src, mm}
function qrImage(token, maxMm, text, level) {
  const rows = qrMatrix(token, text, level), n = rows.length, quiet = 2, total = n + quiet * 2, dpi = labelDpi();
  const dots = Math.floor(maxMm / 25.4 * dpi);
  const per = Math.max(1, Math.floor(dots / total));
  const scale = 4, cv = document.createElement('canvas');   // 화면 미리보기도 또렷하게 4배로 그림
  cv.width = cv.height = per * total * scale;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
  const u = per * scale;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c]) g.fillRect((c + quiet) * u, (r + quiet) * u, u, u);
  return { src: cv.toDataURL('image/png'), mm: +(per * total / dpi * 25.4).toFixed(3) };
}
function labelHtml(i, L) {
  // 위: 소화기 이름 한 줄(작은 글자) / 아래: QR — 50×50 정사각형 라벨 기준
  const pad = 1.5, gap = 0.8, textMm = 2.8;
  const maxMm = Math.max(10, Math.min(L.w - pad * 2, L.h - pad * 2 - gap - textMm));
  const q = qrImage(i.token, maxMm);
  const name = i.label || (i.store + ' 소화기' + i.no);   // 소화전·공기호흡기는 「3F 동측 계단 앞 소화전」 통째로
  // 글자 수에 맞춰 크기 자동 (최대 7pt, 최소 4.5pt) — 1pt ≈ 0.353mm, 한글 1자 ≈ 1em
  const units = Array.from(name).reduce((n, c) => n + (/[\x00-\x7F]/.test(c) ? 0.55 : 1), 0);
  const pt = Math.max(4.5, Math.min(7, (L.w - pad * 2) / Math.max(units, 1) / 0.353));
  return '<div class="label" style="width:' + L.w + 'mm;height:' + L.h + 'mm"><b style="font-size:' + pt.toFixed(1) + 'pt">' + h(name) + '</b><img src="' + q.src + '" style="width:' + q.mm + 'mm;height:' + q.mm + 'mm" alt=""></div>';
}
// 출력 → 먼저 미리보기 (크기 바꾸기) → 인쇄
function printLabels() {
  const ids = Object.keys(S.sel).filter(k => S.sel[k]);

function renderPreview() {

    '<div style="font-size:var(--size-s);color:var(--sub);margin:var(--sp-3) 0 var(--sp-1)">라벨 크기 (가로 × 세로 mm)</div>' +

/** 인쇄한 라벨은 「미인쇄」 딱지를 뗌 (서버에도 기록, 시험 인쇄 1장은 제외, 실패해도 인쇄는 그대로) */

async function openStatus(ym) { go('status'); await loadStatus(ym || ''); }

let stBusy = false;
async function quietStatus() {

  return '<div class="seg cltabs" role="tablist" aria-label="입력 종류">' + CL_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (t[0] === on) + '" class="' + (t[0] === on ? 'on' : '') + '" onclick="clTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>';
}
function clCur() { return S.view === 'use' ? S.use && S.use.kind : S.view; }
function clLeaveOk() { return S.view === 'ahu' ? ahuLeaveOk() : S.view === 'clim' ? climLeaveOk() : S.view === 'use' ? useLeaveOk() : true; }
function clTab(k) { if (k === clCur() || !clLeaveOk()) return; if (k === 'ahu') openAhu(); else if (k === 'clim') openClim(); else openUse(k); }
function clName(txt, tone, sub) { return '<span class="flname">' + h(txt) + (sub ? '<small>' + h(sub) + '</small>' : '') + '</span>'; }   // 층·묶음 색은 뺌 (사용자 11-21) — tone 은 안 씀
function clNav(items, on, fn) {   // items = [[이름, 색, 입력 수 글]]
  return '<div class="flnav">' + items.map((f, i) => '<button type="button" class="' + (i === on ? 'on' : '') + '" aria-pressed="' + (i === on) + '" onclick="' + fn + '(' + i + ')"><b>' + h(f[0]) + '</b><small>' + f[2] + '</small></button>').join('') + '</div>';
}
function clPager(i, items, fn, word) {
  return '<div class="nextfl"><button class="btn" onclick="' + fn + '(' + (i - 1) + ')"' + (i ? '' : ' disabled') + '>' + ICON.back + '이전 ' + word + '</button>' +
    '<button class="btn" onclick="' + fn + '(' + (i + 1) + ')"' + (i < items.length - 1 ? '' : ' disabled') + '>' + (i < items.length - 1 ? '다음 · ' + h(items[i + 1][0]) : '마지막 ' + word) + ICON.next + '</button></div>';
}
function clRepBtn(kind) { return '<button class="btn sm" onclick="openRep(\'' + kind + '\')">' + ICON.chart + '리포트</button>'; }
function clDi(t, hm) { return Math.round((0.81 * t + 0.01 * hm * (0.99 * t - 14.3) + 46.3) * 10) / 10; }
function clLv(d) { return CL_LV.find(x => d < x[0]); }
function clDiTag(t, hm) {   // 단계는 모양으로 (주의 = 테두리, 불쾌 = 남색 바탕). 옛 초록·주황·빨강은 안 씀
  if (t === '' || hm === '' || isNaN(t) || isNaN(hm)) return '<span class="ditag none">불쾌지수 —</span>';
  const d = clDi(Number(t), Number(hm)), l = clLv(d)[1];
  return '<span class="ditag' + (l === '주의' ? ' c' : l === '불쾌' ? ' d' : '') + '">불쾌지수 <b>' + d + '</b> · ' + l + '</span>';
}
function clAdvice(t, hm) {
  const a = [];
  if (t > CL_RG.t[1]) a.push(CL_ADV.tH); else if (t < CL_RG.t[0]) a.push(CL_ADV.tL);
  if (hm > CL_RG.h[1]) a.push(CL_ADV.hH); else if (hm < CL_RG.h[0]) a.push(CL_ADV.hL);
  if (!a.length) { const l = clLv(clDi(t, hm)); if (l[1] !== '쾌적') a.push(l[2]); }
  return a;
}
function clNum(x) { return String(x == null ? '' : x).replace(/[℃%\s]/g, '').replace(/,/g, '.'); }
function clBad(v, lo, hi) { return v !== '' && !(/^-?\d+(\.\d+)?$/.test(v) && Number(v) >= lo && Number(v) <= hi); }
function clMd(d) { return Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + '일월화수목금토'[new Date(d + 'T12:00:00+09:00').getDay()] + ')'; }
function clKst() { const k = new Date(Date.now() + 9 * 3600e3); return k.toISOString().slice(11, 16); }

/* ── 실외 날씨 (옛 앱과 같은 Open-Meteo, 10분 기억). 빈 칸만 채움, 고치면 그대로 (Q2) ── */
let CL_WX = null;
async function clWeather() {
  if (CL_WX && Date.now() - CL_WX.at < 600e3) return CL_WX;
  try {
    const j = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5131&longitude=127.1043&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul', { cache: 'no-store' })).json();
    const c = j && j.current;
    if (c && typeof c.temperature_2m === 'number') CL_WX = { at: Date.now(), t: c.temperature_2m.toFixed(1), h: String(Math.round(c.relative_humidity_2m)) };
  } catch (e) { /* 인터넷이 안 되면 실외는 빈 칸 (직접 넣거나 비워도 저장됨) */ }
  return CL_WX;
}

/* ── 탭 ② 온습도: 층 한 쪽씩, 구역마다 온도·습도. 저장한 때가 측정 시각, 쌓기만 (옛 앱과 같음) ── */
async function openClim() {
  S.clim = { srv: null, v: {}, out: { t: '', h: '', auto: false }, fi: S.climFi || 0, busy: false, err: '' };
  go('clim');
  const r = await call('climateGet'); if (!r.ok) { toast(r.error); return; }
  S.clim.srv = r; if (S.view === 'clim') render();
  const w = await clWeather(), g = S.clim;
  if (w && g && g.out.t === '' && g.out.h === '') { g.out = { t: w.t, h: w.h, auto: true }; if (S.view === 'clim') render(); }
}
function climFloors() {
  const fl = [];
  (S.clim.srv.zones || []).forEach(([f, z]) => { let x = fl.find(a => a.f === f); if (!x) fl.push(x = { f, zs: [] }); x.zs.push(z); });
  return fl;
}
function climLast(f, z) { const a = S.clim.srv.recs.filter(r => r.floor === f && r.zone === z); return a[a.length - 1]; }
function climBase(k) { const p = k.split('|'), l = climLast(p[0], p[1]); return l ? { t: String(l.t), h: String(l.h) } : { t: '', h: '' }; }   // 오늘 마지막 저장값 (결정 226)
function climNew(k) { const v = S.clim.v[k], b = climBase(k); return !!v && (v.t !== '' || v.h !== '') && (v.t !== b.t || v.h !== b.h); }   // 고쳐서 새로 저장할 구역
function climDirty() { return Object.keys(S.clim.v).some(climNew); }
function climLeaveOk() { return !(S.clim && S.clim.srv && climDirty()) || confirm('저장하지 않은 내용이 있습니다. 저장하지 않고 나갈까요?'); }
function climGo(i) { const fl = climFloors(); S.clim.fi = S.climFi = Math.max(0, Math.min(fl.length - 1, i)); render(); window.scrollTo(0, 0); }
function climVal(k) { return S.clim.v[k] || climBase(k); }
function climIn(el) {
  const g = S.clim, k = el.dataset.z, f = el.dataset.f, val = clNum(el.value); g.err = '';
  if (k) { (g.v[k] = g.v[k] || climBase(k))[f] = val; el.classList.remove('saved'); }
  else { g.out[f] = val; g.out.auto = false; }
  el.classList.toggle('bad', f === 't' ? clBad(val, k ? -10 : -30, 50) : clBad(val, 0, 100));
  el.classList.toggle('empty', !val);
  if (k) { const v = g.v[k], e = $('di-' + k.replace('|', '-')); if (e) e.innerHTML = clDiTag(v.t, v.h); const a = $('climAdv'); if (a) a.outerHTML = climAdvBox(); }
  const st = $('climState'); if (st) st.innerHTML = climState();
}
function climBox(attrs, val, unit, cls) { return '<label class="hvin"><input class="inp' + (val === '' ? ' empty' : '') + (cls || '') + '" inputmode="decimal" maxlength="6" value="' + h(val) + '" ' + attrs + ' oninput="climIn(this)" onchange="this.value=clNum(this.value)"><span>' + unit + '</span></label>'; }
function climAdvBox() {
  const g = S.clim, f = climFloors()[g.fi], out = [];
  f.zs.forEach(z => { const v = climVal(f.f + '|' + z); if (v.t !== '' && v.h !== '' && !clBad(v.t, -10, 50) && !clBad(v.h, 0, 100)) { const a = clAdvice(Number(v.t), Number(v.h)); if (a.length) out.push(z + ': ' + a.join(' · ')); } });
  return '<div id="climAdv"' + (out.length ? ' class="adv"' : '') + '>' + out.map(h).join('<br>') + '</div>';
}
function climState() {
  const g = S.clim;
  if (g.err) return '<span class="nwstate dirty"><i class="dot"></i>저장 안 함<small class="hverr"> · ' + h(g.err) + '</small></span>';
  return climDirty() ? '<span class="nwstate dirty"><i class="dot"></i>저장 안 함</span>' : '<span class="nwstate" style="color:var(--muted)">' + (g.srv.recs.length ? '오늘 ' + g.srv.recs.length + '건 저장됨' : '오늘 기록 없음') + '</span>';
}
function renderClim() {
  const g = S.clim;
  if (!g || !g.srv) return clTop() + '<div class="wrap list">' + clTabs('clim') + '<div class="banner b-gray">불러오는 중…</div></div>';
  const fl = climFloors(), pc = lgPc(), done = f => f.zs.filter(z => climLast(f.f, z)).length + '/' + f.zs.length;
  const zoneRow = (f, z) => {
    const k = f.f + '|' + z, v = climVal(k), sv = !g.v[k] && climLast(f.f, z) ? ' saved' : '';   // 저장값 그대로면 회색 (결정 226)
    return '<div class="zr"><b>' + z + '</b>' + climBox('data-z="' + k + '" data-f="t" aria-label="' + CL_FL[f.f][0] + ' ' + z + ' 실내온도"', v.t, '℃', (clBad(v.t, -10, 50) ? ' bad' : '') + sv) +
      climBox('data-z="' + k + '" data-f="h" aria-label="' + CL_FL[f.f][0] + ' ' + z + ' 실내습도"', v.h, '%', (clBad(v.h, 0, 100) ? ' bad' : '') + sv) +
      '<div class="sub"><span></span><span id="di-' + k.replace('|', '-') + '">' + clDiTag(v.t, v.h) + '</span></div></div>';
  };
  const head = '<div class="card" style="padding:var(--sp-4)"><div class="hvhd"><b>매장 온도 · 습도</b>' + clRepBtn('climate') + '</div>' +
    '<div class="hvmeta">측정 시각은 저장한 때 (지금 ' + clKst() + ') · 하루 여러 번 넣어도 모두 남음</div>' +
    '<div class="hvw">' + [['t', '실외온도', '℃'], ['h', '실외습도', '%']].map(x => '<label>' + x[1] + climBox('data-f="' + x[0] + '" aria-label="' + x[1] + '"', g.out[x[0]], x[2], (x[0] === 't' ? clBad(g.out.t, -30, 50) : clBad(g.out.h, 0, 100)) ? ' bad' : '') + '</label>').join('') + '</div>' +
    '<div class="hvmeta">실외는 날씨에서 자동 (10분마다, 고칠 수 있음)' + (g.out.auto ? '' : '') + '</div>' +
    (pc ? '' : clNav(fl.map(f => [CL_FL[f.f][0], CL_FL[f.f][1], done(f)]), g.fi, 'climGo')) + '</div>';
  const bar = '<div class="nwbar"><span id="climState">' + climState() + '</span><div class="dslot"><button class="btn pri" id="climSave" onclick="climSave()"' + (g.busy ? ' disabled' : '') + '>' + (g.busy ? '<span class="spin"></span> 저장 중…' : '저장') + '</button></div></div>';
  if (pc) return clTop() + '<div class="lgwrap">' + clTabs('clim') + head +
    '<table class="cltbl"><thead><tr><th style="width:80px">층</th><th>1구역 · 온도 / 습도</th><th>2구역 · 온도 / 습도</th><th>3구역 · 온도 / 습도</th></tr></thead><tbody>' +
    fl.map(f => '<tr><td class="ctr">' + clName(CL_FL[f.f][0], CL_FL[f.f][1]) + '</td>' + ['1구역', '2구역', '3구역'].map(z => f.zs.indexOf(z) === -1 ? '<td class="ctr na">—</td>' : '<td>' + zoneRow(f, z) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>' + clLegend() + bar + '</div>';
  const f = fl[g.fi];
  return clTop() + '<div class="wrap list">' + clTabs('clim') + head +
    '<div class="flhd">' + clName(CL_FL[f.f][0], CL_FL[f.f][1]) + '<small>층 ' + (g.fi + 1) + '/' + fl.length + '</small></div>' +
    '<div class="hvlist"><div class="secl"><span>실내 (지금)</span><span>온도 ℃ · 습도 %</span></div>' + f.zs.map(z => zoneRow(f, z)).join('') + climAdvBox() + '</div>' +
    clPager(g.fi, fl.map(x => [CL_FL[x.f][0]]), 'climGo', '층') + clLegend() + bar + '</div>';
}
function clLegend() { return '<p class="clnote">불쾌지수 = 0.81T + 0.01H(0.99T−14.3) + 46.3 · 쾌적 74 미만 · 주의 78 미만 · 불쾌 78 이상 · 쾌적 범위 23~26℃, 40~60%</p>'; }
async function climSave() {
  const g = S.clim; if (g.busy) return;
  const rows = [], fl = climFloors();
  let bad = '';
  fl.forEach(f => f.zs.forEach(z => {
    const v = climVal(f.f + '|' + z); if (!climNew(f.f + '|' + z)) return;   // 고친 구역만 (저장값 그대로는 다시 안 보냄)
    const nm = CL_FL[f.f][0] + ' ' + z;
    if (!bad && (v.t === '' || v.h === '')) bad = nm + ': 온도와 습도를 둘 다 넣어 주세요';
    if (!bad && clBad(v.t, -10, 50)) bad = nm + ' 온도는 -10 ~ 50 숫자로 넣어 주세요';
    if (!bad && clBad(v.h, 0, 100)) bad = nm + ' 습도는 0 ~ 100 숫자로 넣어 주세요';
    if (!bad) rows.push({ floor: f.f, zone: z, t: v.t, h: v.h });
  }));
  if (!bad && clBad(g.out.t, -30, 50)) bad = '실외온도는 -30 ~ 50 숫자로 넣어 주세요';
  if (!bad && clBad(g.out.h, 0, 100)) bad = '실외습도는 0 ~ 100 숫자로 넣어 주세요';
  if (!bad && !rows.length) bad = '온도·습도를 넣은 구역이 없습니다';
  if (bad) { g.err = bad; render(); toast(bad); return; }
  g.busy = true; render();
  try {
    const r = await call('climateAdd', rows, { t: g.out.t, h: g.out.h });
    g.busy = false;
    if (!r.ok) { g.err = r.error; render(); toast(r.error); return; }
    g.srv = r; g.v = {}; g.err = ''; render(); toast(r.queued ? OFFMSG : rows.length + '곳 저장했습니다');
  } catch (e) { g.busy = false; g.err = '서버에 닿지 않았습니다. 다시 눌러 주세요'; render(); }
}

/* ── 탭 ③④ 공조기·에어커튼 가동시간: 시각 = 오전/오후·시·10분. 미가동 = 0시간, 빈 칸 = 통계 제외 (옛 앱 규칙) ── */
function useParts(m) { if (m == null || m === '') return ['', '', '']; if (m >= 1440) return ['am', '12', '0']; const h24 = Math.floor(m / 60); return [h24 < 12 ? 'am' : 'pm', String(h24 % 12 || 12), String(m % 60)]; }
function useMin(ap, hh, mm) { if (!ap || !hh || mm === '') return null; if (hh === '24') return 1440 + Number(mm); return (Number(hh) % 12 + (ap === 'pm' ? 12 : 0)) * 60 + Number(mm); }
function useDur(m) { return Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') + '분' : ''); }
function useHm(m) { const p = useParts(m); return (p[0] === 'am' ? '오전 ' : '오후 ') + p[1] + ':' + String(p[2]).padStart(2, '0'); }
async function openUse(kind, day) {
  S.use = { kind, srv: null, v: {}, ch: {}, pg: 0, busy: false, err: '' };
  go('use');
  await loadUse(day || '');
}
async function loadUse(day) {
  const r = await call('usageGet', S.use.kind, day); if (!r.ok) { toast(r.error); return; }
  useSet(r);
}
function useSet(r) {
  const g = S.use; g.srv = r; g.day = r.day; g.v = {}; g.ch = {}; g.err = '';
  r.units.forEach(u => { const x = r.recs[u.u]; g.v[u.u] = x ? { s: x.s, e: x.e, off: !!x.off, saved: true } : { s: u.s, e: r.wkend ? u.ew : u.e, off: false, saved: false }; });
  if (S.view === 'use') render();
}
function useGroups() { const out = []; S.use.srv.units.forEach(u => { let x = out.find(a => a.g === u.grp); if (!x) out.push(x = { g: u.grp, tone: u.tone, us: [] }); x.us.push(u); }); return out; }
function useDirty() { return Object.keys(S.use.ch).length > 0; }
function useLeaveOk() { return !(S.use && S.use.srv && useDirty()) || confirm('저장하지 않은 내용이 있습니다. 저장하지 않고 나갈까요?'); }
// 휴대폰 층(묶음) 버튼 = 그 칸으로 이동 (한 화면에 차례로, 결정 200)
function useJump(i) { S.use.pg = i; const e = $('ug-' + i); if (e) e.scrollIntoView({ behavior: 'smooth' }); document.querySelectorAll('.flnav button').forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-pressed', j === i); }); }
function useCal() {
  const g = S.use, t = g.srv.workDay;
  pickDate({ cur: g.day, home: t, max: t, homeLbl: '오늘로 (' + Number(t.slice(5, 7)) + '월 ' + Number(t.slice(8, 10)) + '일)', fn: ds => { if (ds !== g.day && useLeaveOk()) loadUse(ds); } });
}
// 카드 하나의 값 → { s, e, off, err } (err 가 있으면 저장 안 함)
function useParse(v) {
  if (v.off) return { s: null, e: null, off: true };
  if (v.s == null && v.e == null) return { s: null, e: null, off: false, empty: true };
  if (v.s == null || v.e == null) return { err: '시작과 종료의 시·분을 모두 고르세요' };
  let e = v.e; if (e <= v.s) { if (e === 0) e = 1440; else return { err: '종료가 시작보다 빠릅니다' }; }
  return { s: v.s, e, off: false };
}
function useSel(u, f, val, nm, part) {
  const p = val == null && part ? ['', part[0], part[1]] : f === 'e' && val >= 1440 ? ['pm', '24', String(val - 1440)] : useParts(val), ap = p[0] || (f === 's' ? 'am' : 'pm');
  const o = (k, opts) => '<select data-u="' + h(u.u) + '" data-f="' + f + k + '" aria-label="' + h(nm) + (k === 'h' ? ' 시' : ' 분') + '" onchange="useIn(this)">' + opts.map(x => '<option value="' + x[0] + '"' + (String(x[0]) === String(p[k === 'h' ? 1 : 2]) ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select>';
  const hrs = [['', '시']].concat(Array.from({ length: 12 }, (_, i) => [String(i + 1), (i + 1) + '시']), f === 'e' ? [['24', '12시(자정)']] : []), mins = [['', '분']].concat([0, 10, 20, 30, 40, 50].map(m => [String(m), String(m).padStart(2, '0') + '분']));
  return '<span class="ap" data-f="' + f + 'a" data-ap="' + ap + '">' + (ap === 'am' ? '오전' : '오후') + '</span>' + o('h', hrs) + o('m', mins);   // 시작 오전 · 종료 오후 고정 (결정 204)
}
function useCard(u) {
  const g = S.use, v = g.v[u.u], p = useParse(v), nm = (u.sub ? u.sub + ' ' : '') + u.name;
  // 공조기는 가동시간 글자 없음(리포트에서 봄) · 「기본 시각」 글자 없음 (결정 206)
  const foot = p.err ? '<span class="hverr">' + p.err + '</span>' : g.kind === 'hvac' ? '' : p.off ? '미가동 · <b>0시간</b>' : p.empty ? '입력 없음' : '가동 <b>' + useDur(p.e - p.s) + '</b>';
  const st = g.ch[u.u] ? '<span class="nwstate dirty"><i class="dot"></i>저장 안 함</span>' : v.saved ? '<span class="nwstate">' + ICON.ok + '저장됨</span>' : '';

/* ── 앱 안 PDF 보기: [PDF 열기]가 휴대폰의 드라이브·PDF 앱으로 넘어가면 구글 계정을 물음 → 앱 안에서 pdf.js 로 그림 (Supabase 판만) ──
   Supabase 저장소 PDF는 바로 받고, 드라이브로 옮긴 PDF는 구글 웹앱 ?api=pdf 가 대신 받아 줌(「링크가 있는 사람 보기」 파일만). 구글 판은 예전처럼 새 창 */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const PV_Z = [1, 1.5, 2, 3];
/* 서류 화면 아래 줄 공통 (결정 176) — 왼쪽 상태 글자, 오른쪽 아래 [인쇄] + [저장 ⇄ PDF 보기]. 남색은 「저장」 하나.
   저장하면 PDF도 같이 만들고, 끝나면 그 자리가 [PDF 보기]. 고치면 다시 [저장]. o = { sid, state, print, id, save, label, busy, pdfBusy, pdf: { url, pv } | null } */
function docSlot(o) {
  return o.pdf ? pdfBtn('', 'PDF 보기', o.pdf.url, o.pdf.pv) :
    '<button class="btn pri"' + (o.id ? ' id="' + o.id + '"' : '') + ' onclick="' + o.save + '"' + (o.busy ? ' disabled' : '') + '>' + (o.busy ? '<span class="spin"></span> ' + (o.pdfBusy ? 'PDF 만드는 중…' : '저장 중…') : o.label || '저장') + '</button>';
}
function docBar(o) { return '<span id="' + o.sid + '">' + o.state + '</span>' + (o.print ? '<button class="btn" onclick="' + o.print + '">' + ICON.print + '인쇄 (B4)</button>' : '') + '<div class="dslot" id="' + o.sid + 'Slot">' + docSlot(o) + '</div>'; }
function docSlotSet(o) { const e = $(o.sid + 'Slot'); if (e) e.innerHTML = docSlot(o); }
function pdfBtn(cls, label, url, o) {   // o = { name, sub, meta } — 돌아갈 화면은 지금 화면, cls = null 이면 글자 링크
  return '<a' + (cls == null ? '' : ' class="btn ' + cls + '"') + ' href="' + h(url) + '" target="_blank" rel="noopener" data-pv="' + h(JSON.stringify(o)) + '" onclick="return pdfOpen(this)">' + label + '</a>';
}
function pdfOpen(a) {
  if (!window.WS_API) return true;   // 구글 판: 새 창
  const o = JSON.parse(a.dataset.pv || '{}');
  S.pdf = { url: a.getAttribute('href'), name: o.name || 'PDF', sub: o.sub || '', meta: o.meta || '', from: S.view === 'pdf' && S.pdf ? S.pdf.from : S.view, z: 1, st: 'load', n: 0 };
  S.pdfDoc = null;
  go('pdf');
  pdfLoad();
  return false;
}
function pdfLib() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { if (!window.pdfjsLib) return no(new Error('PDF 도구를 불러오지 못했습니다')); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => no(new Error('PDF 도구를 불러오지 못했습니다'));
    document.head.appendChild(sc);
  });
}
async function pdfBytes(url) {
  const d = /^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)/.exec(url);
  if (d) {   // 드라이브로 옮긴 PDF: 브라우저가 직접 못 받음(CORS) → 구글 웹앱이 대신
    const j = await (await fetch(WS_CONFIG.WS_GAS_URL + '?api=pdf&id=' + encodeURIComponent(d[1]))).json();
    if (!j.ok) throw new Error(j.error || 'PDF를 받지 못했습니다');
    const s = atob(j.b64), b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error('PDF를 받지 못했습니다 (' + r.status + ')');
  return new Uint8Array(await r.arrayBuffer());
}
async function pdfLoad() {
  const me = S.pdf;
  me.st = 'load'; me.err = ''; if (S.view === 'pdf') render();
  try {
    const [lib, bytes] = await Promise.all([pdfLib(), pdfBytes(me.url)]);
    me.bytes = bytes;
    const doc = await lib.getDocument({ data: bytes.slice() }).promise;   // pdf.js 가 넘긴 배열을 비우므로 복사본을 줌 (내려받기용 원본 보존)
    if (S.pdf !== me) return;
    S.pdfDoc = doc; me.n = doc.numPages; me.st = 'ok';
  } catch (e) {
    if (S.pdf !== me) return;
    me.st = 'err'; me.err = String(e.message || e);
  }
  if (S.view === 'pdf') render();
}
function pvZoomLabel(z) { return z === 1 ? (window.innerWidth < 700 ? '쪽 맞춤' : '100%') : Math.round(z * 100) + '%'; }
function renderPdf() {
  const p = S.pdf;
  const tool = '<div class="pv-tool"><span class="fname"><b>' + h(p.name) + '</b><small>' + h([p.n ? p.n + '쪽' : '', p.meta].filter(Boolean).join(' · ') || 'PDF') + '</small></span>' +
    '<div class="pv-zoom" role="group" aria-label="크기"><button onclick="pvZoom(-1)" aria-label="작게"' + (p.z <= PV_Z[0] || p.st !== 'ok' ? ' disabled' : '') + '>−</button>' +
    '<span id="pvZ">' + pvZoomLabel(p.z) + '</span><button onclick="pvZoom(1)" aria-label="크게"' + (p.z >= PV_Z[PV_Z.length - 1] || p.st !== 'ok' ? ' disabled' : '') + '>+</button></div></div>';
  const body = p.st === 'err'
    ? '<div class="pv-state" role="alert"><b>PDF를 불러오지 못했습니다</b><span>' + h(p.err && !/fetch|network/i.test(p.err) ? p.err : '인터넷 연결을 확인하고 다시 시도해 주세요.') + '</span>' +
      '<button class="btn pri" onclick="pdfLoad()">다시 시도</button><a class="btn" href="' + h(p.url) + '" target="_blank" rel="noopener">새 창에서 열기</a>' +
      '<small style="color:var(--muted)">새 창에서 열면 휴대폰이 구글 계정을 물을 수 있습니다.</small></div>'
    : p.st === 'load' ? '<div class="pv-state"><div class="pv-spin" aria-hidden="true"></div><span>PDF 불러오는 중…</span></div>'
    : '<div class="pv-pages' + (p.z > 1 ? ' big' : '') + '" id="pvPages">' + Array.from({ length: p.n }, (_, i) => '<canvas class="pv-page" id="pvC' + (i + 1) + '" aria-label="' + (i + 1) + '쪽"></canvas><div class="pv-no">' + (i + 1) + ' / ' + p.n + '</div>').join('') + '</div>';
  return topbar(p.sub, 'PDF 보기') + tool + body +
    '<div class="backbar pv-bar"><button class="btn back-in" onclick="back()">' + ICON.back + '뒤로</button>' +
    '<button class="btn" onclick="pvDown()"' + (p.bytes ? '' : ' disabled') + '>' + ICON.file + '내려받기</button><button class="btn pri" onclick="pvShare()">공유</button></div>';
}
async function pvDraw() {
  const p = S.pdf, doc = S.pdfDoc, box = $('pvPages');
  if (!doc || !box) return;
  const fit = Math.min(960, box.clientWidth - 20), dpr = Math.min(window.devicePixelRatio || 1, 3), z = p.z;
  for (let i = 1; i <= p.n; i++) {
    const pg = await doc.getPage(i);
    if (S.pdf !== p || p.z !== z || S.view !== 'pdf') return;   // 그리는 중에 크기를 바꾸거나 나감
    const cv = $('pvC' + i); if (!cv) return;
    const w = fit * z, sc = w / pg.getViewport({ scale: 1 }).width;
    const k = Math.min(dpr, 4096 / w);   // 캔버스가 너무 크면 휴대폰이 못 그림
    const vp = pg.getViewport({ scale: sc * k });
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(vp.height / k) + 'px';
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
}
function pvZoom(d) {
  const p = S.pdf, i = PV_Z.indexOf(p.z) + d;
  if (i < 0 || i >= PV_Z.length) return;
  p.z = PV_Z[i]; render();
}
function pvDown() {
  const p = S.pdf; if (!p || !p.bytes) return;
  const u = URL.createObjectURL(new Blob([p.bytes], { type: 'application/pdf' })), a = document.createElement('a');
  a.href = u; a.download = p.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function pvShare() {
  const p = S.pdf; if (!p) return;
  if (navigator.share) { try { await navigator.share({ title: p.name, url: p.url }); } catch (e) {} return; }   // 취소해도 조용히
  try { await navigator.clipboard.writeText(p.url); toast('PDF 링크를 복사했습니다. 받는 사람은 로그인 없이 볼 수 있습니다.'); } catch (e) { prompt('PDF 링크 (복사해서 보내세요)', p.url); }
}

/* ── 공사장 점검 (WS_공사장점검, 결정 100): 현장 목록 → 현장 점검(자동 저장) → 날짜별·현장별 PDF ── */
const CS_ST = [['양호', 'ok'], ['미흡', 'bad'], ['해당없음', 'na']];
const CS_MAX_PHOTOS = 4;   // 새로 넣는 한도: 휴대폰 2열×2줄 · PC 4열 한 줄 (사용자 11-24, 결정 238). 서버는 예전 기록(6장)도 받도록 6장 그대로
// 사진 넣기 (사용자 11-24, TBM 사진칸과 같게): [카메라] 바로 찍기 · [파일] 갤러리에서 여러 장 고르기, 최대 6장
function csPhBar(x, i) {
  const n = x.photos.length, full = n >= CS_MAX_PHOTOS;
  const pick = cam => '<label class="btn sm' + (full ? ' off' : '') + '">' + (cam ? ICON.cam + ' 카메라' : ICON.folder + ' 파일') + '<input type="file" accept="image/*"' + (cam ? ' capture="environment"' : ' multiple') + (full ? ' disabled' : '') + ' hidden onchange="csPhAdd(' + i + ',this)"></label>';
  return '<div class="tbpb csphb">' + pick(true) + pick(false) + '</div><small class="csphn">사진 ' + (n > CS_MAX_PHOTOS ? n + '장' : n + ' / ' + CS_MAX_PHOTOS + '장') + '</small>';
}
function csDay(d) { return Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + '일월화수목금토'[new Date(d + 'T00:00:00').getDay()] + ')'; }
function csNow(dateToo) { const d = new Date(), p = n => String(n).padStart(2, '0'); return (dateToo ? d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' : '') + p(d.getHours()) + ':' + p(d.getMinutes()); }
function csCnt(k) { const c = { '양호': 0, '미흡': 0, '해당없음': 0 }; k.items.forEach(x => { if (c[x.st] !== undefined) c[x.st]++; }); return c; }
const CS_RD = ['오후점검', '퇴실점검', '추가 점검'];   // 하루 2번 (사용자 11-13, 결정 112). 3회차는 하루 3번 하던 11-11~12 기록만
const csRds = has3 => has3 ? [1, 2, 3] : [1, 2];
function csRdChip(c, n) {
  const L = CS_RD[n - 1];
  if (!c) return '<span class="wait">' + L + ' 전</span>';
  return c.bad ? '<span class="bad">' + L + ' 미흡 ' + c.bad + '</span>' : '<span class="ok">' + L + ' 양호</span>';
}
// 점검 줄들을 날짜·현장별로 묶음 (회차 1·2·3 → r)
function csGroups(list) {
  const out = [], by = {};
  list.forEach(c => { const key = c.date + '|' + c.site; let g = by[key]; if (!g) out.push(g = by[key] = { date: c.date, site: c.site, name: c.name, work: c.work, co: c.co, r: {}, list: [] }); g.r[c.round] = c; g.list.push(c); });
  return out;
}
// 현장·하루 PDF 1개: 세 회차 줄에 같은 PDF. 그 뒤 고치거나 새 회차를 하면 옛 판
function csDayPdf(list) {
  const p = (list || []).find(c => c.pdf);
  return p ? { url: p.pdf.url, stale: list.some(c => !c.pdf || c.stale) } : null;
}
// 검색: 현장명·업체·공사 내용·날짜 (2026-11-11, 11-11, 11/11, 11.11, 11월 11일, 11월). 띄어쓰기 무시
function csHit(q, g) {
  if (!q) return true;
  const d = g.date, m = Number(d.slice(5, 7)), dd = Number(d.slice(8, 10));
  return [g.name, g.co, g.work, d, m + '-' + dd, m + '/' + dd, m + '.' + dd, m + '월' + dd + '일', m + '월'].join('|').replace(/\s/g, '').toLowerCase().indexOf(q) !== -1;
}

// 검색하면 이 칸만 다시 그림 (글자 칸은 그대로 — 한글 입력 끊기지 않게)

  const r = S.cs, q = String(S.csQ || '').replace(/\s/g, '').toLowerCase();

/* 사진 넣기: 현장·작업 사진 1600px·70%, 서류(방염·각서)는 글자가 읽히게 2400px·85%. 서류가 흐리거나 어두우면 다시 찍으라고 알림 */
function whQuality(uri) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      const w = 320, hh = Math.max(1, Math.round(w * im.naturalHeight / im.naturalWidth)), c = document.createElement('canvas'); c.width = w; c.height = hh;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0, w, hh); const p = g.getImageData(0, 0, w, hh).data, L = [];
      for (let i = 0; i < p.length; i += 4) L.push(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]);
      if (L.reduce((a, b) => a + b, 0) / L.length < 45) return ok('어둡습니다');
      let d = 0, n = 0; for (let y = 0; y < hh; y++) for (let x = 1; x < w; x++) { d += Math.abs(L[y * w + x] - L[y * w + x - 1]); n++; }
      ok(d / n < 1.2 ? '흐립니다' : '');   // shortcut: 대충 거르는 기준 — 현장에서 써 보고 숫자 조정
    };
    im.onerror = () => ok(''); im.src = uri;
  });
}
async function whAdd(k, fld, el, at) {
  const fs = Array.from(el.files || []); el.value = ''; if (!fs.length) return;
  const o = S.wh[k], L = o.f[fld], max = k === 'd' ? 2 : 0, doc = fld === 'fire' || fld === 'pledge'; let dup = 0, cut = 0, bad = '';
  for (const f of fs) {
    if (max && at < 0 && L.length >= max) { cut++; continue; }
    const key = f.name + '|' + f.size + '|' + f.lastModified;
    if (o.keys.indexOf(key) !== -1) { dup++; continue; }
    try {
      const data = await (doc ? shrinkJpeg(f, 2400, 0.85) : shrinkJpeg(f, 1600, 0.7));
      if (at >= 0 && at < L.length) L[at] = { data, src: data }; else L.push({ data, src: data }); o.keys.push(key); if (o.keys.length > 80) o.keys.shift();
      if (doc && !bad) bad = await whQuality(data);
    } catch (e) { toast(e.message); }
  }
  if (cut) toast('사진은 ' + max + '장까지 넣을 수 있습니다');
  else if (dup) toast(dup + '장은 이미 넣은 사진이라 건너뜁니다');
  if (bad) toast('서류 사진이 ' + bad + '. 다시 찍어 주세요');
  whDirty(); render();
}

    const r = await call(WH_API[k][1], d); o.busy = false;
    if (!r.ok) { render(); return toast(r.error || '저장하지 못했습니다'); }
    if (o.list) { const i = o.list.findIndex(x => x.id === r.item.id); if (i >= 0) o.list[i] = r.item; else o.list.unshift(r.item); o.list.sort((a, b) => a.day < b.day ? 1 : a.day > b.day ? -1 : 0); }
    o.f = JSON.parse(JSON.stringify(r.item)); if (k === 'd' && !o.f.mats.length) o.f.mats.push({ n: '', q: '', u: '' });
    o.dirty = false; render(); toast(k === 'd' ? '저장했습니다 · 종합업무일지 금일작업에도 들어갑니다' : '저장했습니다');
  } catch (e) { o.busy = false; render(); }
}
async function whDel() {
  const k = S.wh.tab, o = S.wh[k]; if (!o.f.id || !confirm('이 작업을 지울까요?' + (k === 'd' ? ' (종합업무일지 금일작업에서도 빠집니다)' : ''))) return;
  try {
    const r = await call(WH_API[k][2], o.f.id); if (!r.ok) return toast(r.error);
    if (o.list) o.list = o.list.filter(x => x.id !== o.f.id);
    o.f = whNew(k); o.dirty = false; render(); toast('지웠습니다');
  } catch (e) { /* call() 이 알림 */ }
}

/* 인쇄 · PDF 쪽 만들기. 주간 = 1쪽. 야간 = ① 내용+현장 사진 쪽 · 각서 쪽 (양면으로 붙임, 항상 2쪽) → ② 방염서류 사진 한 장 = 한 쪽 (단면, 맨 뒤) */
const WH_CSS = '.whp{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#000;background:#fff}.whp *{box-sizing:border-box}' +
  '.whp .pg{width:794px;height:1122px;padding:40px 44px;overflow:hidden;background:#fff;page-break-after:always;break-after:page;position:relative}.whp .pg:last-child{page-break-after:auto;break-after:auto}' +
  '.whp h1{font-size:22px;margin:0 0 4px}.whp .sub{font-size:11px;color:#444;margin-bottom:12px}.whp table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:10px}' +
  '.whp td,.whp th{border:1px solid #888;font-size:12px;padding:5px 7px;text-align:left;vertical-align:top;line-height:1.45;word-break:break-all}.whp th{background:#e8edf3;width:72px;font-weight:600}' +
  '.whp .bx{border:1px solid #888;padding:7px 9px;font-size:12px;line-height:1.5;min-height:48px;margin-bottom:10px;white-space:pre-wrap;word-break:break-all}.whp .bx b{display:block;font-size:11px;color:#444;margin-bottom:2px}' +
  '.whp .ph{display:flex;gap:0;border:1px solid #888}.whp .col{flex:1;min-width:0;padding:6px}.whp .col+.col{border-left:1px solid #888}.whp .col h4{margin:0 0 5px;font-size:12px}' +
  '.whp .gr{display:grid;gap:5px}.whp .cell{background:#f1f3f6;display:flex;align-items:center;justify-content:center;overflow:hidden}.whp .cell img{display:block}' +
  '.whp .none{font-size:12px;color:#666;padding:10px 0}.whp .full{position:absolute;left:44px;right:44px;top:70px;bottom:44px;display:flex;align-items:center;justify-content:center}.whp .full img{display:block}' +
  '.whp .ft{position:absolute;left:44px;right:44px;bottom:16px;font-size:10px;color:#666;display:flex;justify-content:space-between}.whp .pdfonly{color:#999}@media print{.whp .pdfonly{display:none}}';
function whGrid(l, W, H) {   // 장수에 맞춰 칸 수·크기를 정함 (많으면 줄여서 한 쪽에 모음). 칸이 모자라면 빈 칸은 안 그림
  if (!l.length) return '';
  const n = l.length, cols = n === 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : n <= 16 ? 4 : 5, rows = Math.ceil(n / cols), gap = 5;
  const ch = Math.floor((H - gap * (rows - 1)) / rows), cw = Math.floor((W - gap * (cols - 1)) / cols), s = Math.min(ch, Math.round(cw * 0.75));
  return '<div class="gr" style="grid-template-columns:repeat(' + cols + ',1fr)">' + l.map(p => '<div class="cell" style="height:' + s + 'px"><img src="' + h(p.src) + '" alt=""></div>').join('') + '</div>';
}
function whDay(d) { return d.slice(0, 4) + '년 ' + Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일'; }
function whFt(t) { return '<div class="ft"><span>에비뉴엘 잠실점 시설팀 · 출력 ' + rwToday() + '</span><span>' + h(t) + '</span></div>'; }
function whPages(k) {
  const f = S.wh[k].f;
  if (k === 'd') {
    const mats = f.mats.filter(m => m.n.trim()), part = f.parts.map(p => (WH_PARTS.find(y => y[0] === p) || [0, p])[1]).join(' · ');
    return '<div class="pg"><h1>주간 작업내역</h1><div class="sub">에비뉴엘 잠실점 시설팀</div>' +
      '<table><tr><th>일자</th><td>' + h(whDay(f.day)) + '</td><th>파트</th><td>' + h(part) + '</td></tr><tr><th>작업자</th><td>' + h(f.workers) + '</td><th>작업위치</th><td>' + h(f.floor) + '</td></tr></table>' +
      '<div class="bx"><b>작업내용</b>' + h(f.content) + '</div>' +
      ((f.before.length || f.after.length) ? '<div class="ph"><div class="col"><h4>작업 전</h4>' + whGrid(f.before, 340, 560) + '</div><div class="col"><h4>작업 후</h4>' + whGrid(f.after, 340, 560) + '</div></div>' : '') +
      (mats.length ? '<table style="margin-top:10px"><tr><th>사용자재</th><th style="width:auto">이름</th><th style="width:90px">수량</th><th style="width:90px">단위</th></tr>' + mats.map(m => '<tr><td></td><td>' + h(m.n) + '</td><td>' + h(m.q) + '</td><td>' + h(m.u) + '</td></tr>').join('') + '</table>' : '') +
      (f.note.trim() ? '<div class="bx"><b>비고</b>' + h(f.note) + '</div>' : '') + whFt('주간 작업내역') + '</div>';
  }
  const head = '<h1>야간 작업내역</h1><div class="sub">에비뉴엘 잠실점 시설팀</div>';
  const p1 = '<div class="pg">' + head + '<table><tr><th>일자</th><td>' + h(whDay(f.day)) + '</td><th>업체명</th><td>' + h(f.co) + '</td></tr><tr><th>작업위치</th><td colspan="3">' + h(f.floor) + '</td></tr></table>' +
    '<div class="bx"><b>작업내용</b>' + h(f.content) + '</div>' + (f.note.trim() ? '<div class="bx"><b>기타사항</b>' + h(f.note) + '</div>' : '') +
    '<div class="bx" style="padding:6px"><b>현장 사진 (' + f.photos.length + '장)</b>' + (f.photos.length ? whGrid(f.photos, 690, 640) : '<div class="none">미첨부</div>') + '</div>' + whFt('야간 작업내역 ①') + '</div>';
  const p2 = '<div class="pg"><h1>각서</h1><div class="sub">' + h(f.co) + ' · ' + h(whDay(f.day)) + '</div>' + (f.pledge.length ? whGrid(f.pledge, 706, 940) : '<div class="none">각서 미첨부</div>') + whFt('야간 작업내역 ② 각서') + '</div>';
  const fire = f.fire.length ? f.fire.map((p, i) => '<div class="pg"><div class="sub">방염서류 ' + (i + 1) + '/' + f.fire.length + ' · ' + h(f.co) + ' · ' + h(whDay(f.day)) + ' <span class="pdfonly">· 이 쪽부터 단면 인쇄</span></div><div class="full"><img src="' + h(p.src) + '" alt=""></div></div>').join('')
    : '<div class="pg"><h1>방염서류</h1><div class="sub">' + h(f.co) + ' · ' + h(whDay(f.day)) + '</div><div class="none">방염서류 미첨부</div></div>';
  return p1 + p2 + fire;
}
/* 사진은 자르지 않고 칸에 맞춰 줄임 — PDF 도구가 object-fit 을 못 읽어 크기를 직접 정함 */
async function whFit(box) {
  try { if (document.fonts) await document.fonts.ready; } catch (e) {}
  const im = [...box.querySelectorAll('img')]; await Promise.all(im.map(i => i.decode ? i.decode().catch(() => {}) : null));
  box.querySelectorAll('.cell img,.full img').forEach(i => {
    const c = i.parentNode, sc = Math.min(c.clientWidth / i.naturalWidth, c.clientHeight / i.naturalHeight) || 1;
    i.style.width = Math.floor(i.naturalWidth * sc) + 'px'; i.style.height = Math.floor(i.naturalHeight * sc) + 'px';
  });
}
function whCheck() { const k = S.wh.tab, f = S.wh[k].f; if (!f.content.trim()) { toast('작업내용을 입력해 주세요'); return false; } return true; }
async function whPrint() {
  if (!whCheck()) return;
  const k = S.wh.tab; $('print').innerHTML = '<style>@page{size:A4;margin:0}' + WH_CSS + '</style><div class="whp">' + whPages(k) + '</div>';
  await whFit($('print')); setTimeout(() => window.print(), 100);
}
async function whPdf() {
  if (!whCheck()) return;
  const k = S.wh.tab, o = S.wh[k]; if (o.pdfBusy) return;
  o.pdfBusy = true; render();
  const wrap = document.createElement('div'); wrap.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1';
  wrap.innerHTML = '<style>' + WH_CSS + '</style><div class="whp" style="width:794px">' + whPages(k) + '</div>'; document.body.appendChild(wrap);
  try {
    await loadH2p(); await whFit(wrap);
    const keepY = window.scrollY; window.scrollTo(0, 0);
    let blob; try {
      blob = await html2pdf().set({ margin: 0, filename: o.f.day + '_' + WH_TITLE[k] + '.pdf', image: { type: 'jpeg', quality: 0.9 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: 794 },
        jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] }, pagebreak: { mode: ['css'] } }).from(wrap.querySelector('.whp')).outputPdf('blob');
    } finally { window.scrollTo(0, keepY); }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.dataset.pv = JSON.stringify({ name: WH_TITLE[k], sub: o.f.day });
    o.pdfBusy = false; pdfOpen(a);
  } catch (e) { o.pdfBusy = false; render(); toast('PDF를 만들지 못했습니다: ' + (e && e.message ? e.message : e)); }
  wrap.remove();
}
/* ── 그리기 ── */
function render() {
  let html;
  if (S.view === 'loading') html = renderLoading();
  else if (S.view === 'retry') html = renderRetry();
  else if (S.view === 'device') html = renderDevice();
  else if (S.view === 'sign' && S.sign) html = renderSign();
  else if (!S.token || S.view === 'login') html = renderLogin();
  else if (S.view === 'pdf' && S.pdf) html = renderPdf();
  else if (S.view === 'docs') html = renderDocs();
  else if (S.view === 'tbm') html = renderTbm();
  else if (S.view === 'nw') html = renderNw();
  else if (S.view === 'log') html = renderLog();
  else if (S.view === 'ahu') html = renderAhu();
  else if (S.view === 'clim') html = renderClim();
  else if (S.view === 'use') html = renderUse();
  else if (S.view === 'rep' && S.rep) html = renderRep();
  else if (S.view === 'kw' && isBoss()) html = renderKw();
  else if (S.view === 'uhr') html = renderUhr();   // 전 직원 (결정 218)
  else if (S.view === 'map') html = renderMap();
  else if (S.view === 'spec') html = S.sp ? renderSpec() : renderMain();
  else if (S.view === 'att') html = renderAtt();
  else if (S.view === 'attup') html = renderAttUp();
  else if (S.view === 'inspect') html = renderInspect();
  else if (S.view === 'thermal') html = renderThermal();
  else if (S.view === 'cad') html = renderCad();
  else if (S.view === 'fire') html = renderFire();
  else if (S.view === 'qr') html = renderQr();
  else if (S.view === 'hyd') html = renderHyd();
  else if (S.view === 'hydfl') html = S.hq ? renderHydFloor() : renderHyd();
  else if (S.view === 'eh') html = renderEh();
  else if (S.view === 'cs') html = renderCs();
  else if (S.view === 'csck') html = renderCsCk();
  else if (S.view === 'rw') html = renderRw();
  else if (S.view === 'wh') html = renderWh();
  else if (S.view === 'status') html = renderStatus();
  else if (S.view === 'floor') html = S.st ? renderFloor() : renderStatus();
  else if (S.view === 'set' && isBoss()) html = renderSet();
  else if (S.view === 'risk' && isBoss()) html = renderRisk();
  else html = renderMain();
  if (S.view !== 'map') document.body.classList.remove('mapfull');
  if (PARENT[S.view] && S.token && S.user && S.view !== 'map') {   // 아래 뒤로 버튼 (위 < 는 뺌, 결정 102). 저장 줄이 있으면 그 줄 맨 왼쪽에 (WS-25)
    const h2 = withBack(html);
    html = h2 !== html ? h2 : html + '<div class="wrap backbar"><button class="btn big" onclick="back()">' + ICON.back + '뒤로</button></div>';
  }
  $('app').innerHTML = html;
  if (S.view === 'spec' && S.sp && S.sp.boot) spDraw();
  if (S.view === 'qr') { drawQrs(); qrMarkPartial(); }
  if (S.view === 'sign') mountSign();
  if (S.view === 'pdf') pvDraw();
}

(async function start() {
  render();   // 「불러오는 중」 — 저장된 표를 확인하는 동안 PIN 화면을 보이지 않음 (결정 48)
  if (window.WS_API) {   // 바로가기 앱: 기기 등록(시설팀 공용 계정 Supabase 로그인)이 먼저 (Supabase 이관 3-1)
    try { S.device = await WS_API.device(); } catch (e) { S.device = null; }
    if (!S.device) { S.view = 'device'; render(); return; }
  }
  if (!tokenAlive(S.token)) {
    store('ws_token', null); S.token = '';
    const t = await SHELL.get();
    if (tokenAlive(t)) { S.token = t; store('ws_token', t); }
  } else SHELL.set(S.token);
  if (!S.token) { S.view = 'login'; render(); return; }
  // 이 기기에 기억한 지난번 메인 화면을 먼저 보여 주고, 서버 확인은 뒤에서 (로딩 개선, 결정 76). 표의 주인이 같을 때만
  let m = null; try { m = JSON.parse(store('ws_main') || 'null'); } catch (e) {}
  if (m && m.user && m.sid === String(S.token).split('.')[0]) { S.user = m.user; S.fire = m.fire; S.docs = m.docs; S.menuOff = m.menuOff || []; S.cached = true; S.view = 'main'; render(); }
  await boot(true);
})();
</script>
