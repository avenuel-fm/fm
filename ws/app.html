<style>
/* 공통 틀 v0.1 — 도면협의 Styles.html 기준 이름 (통합 설계정의서 12장) */
:root{
  --ground:#F4F6F8; --card:#FFFFFF; --line2:#DCE1E7; --line3:#EDF0F3; --line:#CBD2DB;
  --ink:#18202B; --sub:#3F4855; --muted:#5B6573;
  --blue:#1F5FA8; --blue-d:#174A84; --blue-bg:#E8F0FA;
  --green:#1F7A4D; --green-bg:#EAF5EF; --orange:#B4410F; --orange-bg:#FDF0E8; --red:#C0261A; --red-bg:#FBE9E7;
}
*{box-sizing:border-box}
/* WS-25 화면 다듬기: 단어 중간 줄바꿈 막기, 제목·강조 600 (인쇄·라벨·PDF 양식은 700 그대로) */
body{word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,b,strong{font-weight:600}
.tbp b,.tbp strong,.tbp h1,.cspdf b,.cspdf strong,.label b,.ehlt b{font-weight:700}
.tbp,.cspdf,.label,.ehlt,.ehg{word-break:normal;overflow-wrap:normal}
.ui-ico{display:inline-block;flex:none;vertical-align:-3px}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){.btn{transition:scale .15s ease-out}.btn:not(:disabled):active{scale:.96}}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.warn{border-color:#E8B4AE;color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.big{min-height:52px;font-size:16px}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff}
.card{background:var(--card);border:1px solid var(--line2);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--green-bg);color:var(--green)}
.c-bad{background:var(--orange-bg);color:var(--orange)}
.c-wait{background:var(--line3);color:var(--muted)}
.c-miss{background:var(--red-bg);color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(24,32,43,.25)}
.dialog-back{position:fixed;inset:0;background:rgba(24,32,43,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dialog{width:100%;max-width:520px;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain}
@media (min-width:700px){.dialog-back{align-items:center}.dialog{border-radius:16px}}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
<style>
/* 어두운 화면 (결정 98): 화면만 색을 뒤집고 사진·서명·QR은 되돌림. 인쇄·저장 이미지는 그대로 흰 바탕 */
@media screen{
html[data-theme=dark]{filter:invert(1) hue-rotate(180deg) contrast(.78)}   /* 검정 대신 진한 회색 (사용자 11-11) */
html[data-theme=dark] :is(img,video,canvas,.keep-color):not(.keep-color *){filter:invert(1) hue-rotate(180deg)}
html[data-theme=dark] :is(.dialog-back,.overlay,.pinpop,.gprev.modal){background:rgba(255,255,255,.5)}
}
</style>
<script>
/* 기기에 고른 값 → 없으면 휴대폰 설정. 화면 그리기 전에 정해서 번쩍임 없음 */
(function () { var t = null; try { t = localStorage.getItem('fm_theme'); } catch (e) {} if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();
function themeDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function toggleTheme() { var t = themeDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('fm_theme', t); } catch (e) {} document.querySelectorAll('.theme-btn').forEach(function (b) { b.textContent = themeLabel(); }); }
function themeLabel() { return themeDark() ? '밝게' : '어둡게'; }
</script>

let SPAD = null;
function mountSign() {

function makeSignPad(box, ghostText, onChange) {
  const g = box.querySelector('canvas.g'), ink = box.querySelector('canvas.i');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let len = 0, drawing = false, last = null;
  function size() { [g, ink].forEach(c => { c.width = Math.round(box.clientWidth * dpr); c.height = Math.round(box.clientHeight * dpr); }); ghost(); }
  function ghost() {   // 이름을 연회색 굵은 글자로 깔아 둠 (결정 46)
    const c = g.getContext('2d'); c.clearRect(0, 0, g.width, g.height);
    let fs = 64 * dpr; c.font = '800 ' + fs + 'px "Noto Sans KR", sans-serif';
    while (c.measureText(ghostText).width > g.width * 0.8 && fs > 18) { fs -= 2; c.font = '800 ' + fs + 'px "Noto Sans KR", sans-serif'; }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#C5CCD6'; c.fillText(ghostText, g.width / 2, g.height / 2);
  }
  function pos(e) { const r = ink.getBoundingClientRect(); return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr }; }
  function dot(p) { const c = ink.getContext('2d'); c.fillStyle = '#18202B'; c.beginPath(); c.arc(p.x, p.y, 1.8 * dpr, 0, Math.PI * 2); c.fill(); }
  function mark() { box.classList.toggle('inked', len > 0); onChange(len > 0); }
  ink.addEventListener('pointerdown', e => { e.preventDefault(); ink.setPointerCapture(e.pointerId); drawing = true; last = pos(e); dot(last); len += 1; mark(); });
  ink.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e), c = ink.getContext('2d');
    c.lineWidth = 3.6 * dpr; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#18202B';
    c.beginPath(); c.moveTo(last.x, last.y); c.lineTo(p.x, p.y); c.stroke();
    len += Math.hypot(p.x - last.x, p.y - last.y); last = p; mark();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => ink.addEventListener(t, () => { drawing = false; }));
  window.addEventListener('resize', () => { if (len === 0 && box.isConnected) size(); });
  size();
  return {
    empty: () => len === 0,
    has: () => len > 120 * dpr,   // 너무 짧게 그은 서명은 받지 않음 (개선 A)
    clear: () => { ink.getContext('2d').clearRect(0, 0, ink.width, ink.height); len = 0; ghost(); mark(); },
    // 가로 600px 흑백 PNG — 흰 바탕·검은 글씨만 남겨 파일을 작게 (결정 60)
    png: () => {
      const W = 600, H = Math.round(600 * ink.height / ink.width);
      const out = document.createElement('canvas'); out.width = W; out.height = H;
      const c = out.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.drawImage(ink, 0, 0, W, H);
      const im = c.getImageData(0, 0, W, H), d = im.data;
      for (let i = 0; i < d.length; i += 4) { const v = (d[i] + d[i + 1] + d[i + 2]) / 3 < 170 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
      c.putImageData(im, 0, 0);
      return out.toDataURL('image/png');
    }
  };
}
async function doSign() {
  const g = S.sign;
  if (!g || g.busy || !SPAD) return;
  if (!SPAD.has()) { $('sMsg').textContent = '서명이 너무 짧습니다. 이름을 따라 크게 써 주세요.'; return; }
  const png = SPAD.png();
  g.busy = true; $('sGo').disabled = true; $('sGo').innerHTML = '<span class="spin"></span>';
  try {
    const r = g.mode === 'pin' ? await run('login', g.pin, deviceId(), png) : await run('signToday', S.token, png);
    g.busy = false;
    if (!r.ok) { $('sMsg').textContent = r.error || '저장하지 못했습니다'; $('sGo').disabled = false; $('sGo').textContent = '서명하고 로그인'; if (r.needSign === undefined && g.mode === 'pin' && /PIN|잠|5번/.test(r.error || '')) { S.sign = null; S.view = 'login'; render(); $('pinMsg').textContent = r.error; } return; }
    if (g.mode === 'pin') loggedIn(r); else S.sign = null;
    S.view = 'loading'; render();
    await boot(true);
  } catch (e) {
    g.busy = false; $('sGo').disabled = false; $('sGo').textContent = '서명하고 로그인';
    if (String(e && e.message).indexOf('LOGIN') !== -1) { logout(true); return; }
    $('sMsg').textContent = '연결 오류: ' + (e.message || e) + ' — 다시 눌러 주세요';
  }
}
/* 로그인 확인. 늦게 끝난 확인(앞선 boot)은 무시하고, 이미 다른 화면이면 메인으로 보내지 않음 (결정 48) */
let bootSeq = 0;
async function boot(fromStart) {
  const my = ++bootSeq;
  let r;
  try { r = await run('bootstrap', S.token); }
  catch (e) {
    if (my !== bootSeq) return;
    if (String(e && e.message).indexOf('LOGIN') !== -1) { logout(fromStart !== true); return; }
    if (fromStart && S.view === 'main' && S.cached) { toast('서버에 연결하지 못했습니다. 지난번 화면입니다.'); return; }
    if (fromStart) { S.view = 'retry'; render(); return; }   // 연결 오류는 로그아웃하지 않음
    toast('서버 오류: ' + (e && e.message ? e.message : e)); throw e;
  }
  if (my !== bootSeq) return;
  const wasCached = S.cached && S.view === 'main';
  S.user = r.user; S.fire = r.fire; S.docs = r.docs || null; S.cached = false; S.fireAt = Date.now();
  S.ver = r.app && r.app.version; store('ws_ver', S.ver || null);
  if (r.toastSec) store('ws_toast_sec', String(r.toastSec));
  if (wasCached && !r.needSign) toast('최신 내용으로 불러왔습니다');
  if (!r.needSign) setTimeout(prefetch, 0);   // 메인이 뜬 뒤 TBM·명일 작업을 뒤에서 미리 받음
  if (!r.needSign) store('ws_main', JSON.stringify({ sid: r.user.staff_id, user: r.user, fire: r.fire, docs: r.docs }));   // 다음 접속 때 먼저 보여 줄 메인 화면
  if (r.needSign) { S.sign = { mode: 'token', name: r.user.name, part: r.user.part, busy: false, msg: '' }; S.view = 'sign'; render(); return; }   // 표는 있는데 오늘 서명이 없음
  if (['login', 'loading', 'retry', 'sign'].indexOf(S.view) !== -1) go('main');
  else if (S.view === 'main') render();   // 먼저 보여 준 지난번 화면을 새 숫자로
}

const TBM_CHECKS = ['사다리', '비계', '우마', '테이블리프트', '크레인', '스카이', '달비계', '용접기'];

// 작업내용(+명일 비고)에서 목록을 위에서부터 보고 처음 맞는 위험요인, 없으면 「(기본)」 (4-2)

function tbmApply(w, r) { Object.assign(w, r ? { risk: r.risk, kind: r.kind, p: r.p, s: r.s, fixes: r.fixes.filter(f => f.on).map(f => f.t) } : { risk: '', kind: '', p: '', s: '', fixes: [] }); }

function shrinkJpeg(file, max, q) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), im = new Image();

    im.src = u;

const AT_CODES = ['', '9-7', '휴', '연', '법', '야', '비', '병가', 'A반', 'P반', 'A검진', 'P검진'];

function atIsDay(v) { return v === '' || v === '9-7' || /^[AP](반|검진)$|^[전후]반$/.test(v); }   // 서버 atIsDay_와 같음

function atTitle(sec) { return sec.indexOf('관') === 0 ? '관리파트' : /^공사장/.test(sec) ? sec.replace(/^공사장(?=\S)/, '공사장 ') : /^[가-힣]{4}$/.test(sec) ? sec.slice(0, 2) + '·' + sec.slice(2) : sec; }
/* 엑셀 줄 → 조직도 구역: 소장 = 사업소장, 나머지는 엑셀 구역 순서대로 (5장) */
function atGroups(people) {
  const out = [{ t: '사업소장', p: [] }];
  people.forEach((x, i) => {
    if (x.role === '소장') return out[0].p.push(Object.assign({ i }, x));

    g.p.map(x => x.name ? '<div class="atp"><span class="atav" aria-hidden="true">' + h(x.name.slice(0, 1)) + '</span>' +
      (ed ? '<button class="atnm" onclick="atHolOpen(' + x.i + ')" aria-label="' + h(x.name) + ' 기본 휴일"><small>' + h(atRole(x.role)) + '</small><b>' + h(x.name) + '</b></button>' : '<span class="atnm"><small>' + h(atRole(x.role)) + '</small><b>' + h(x.name) + '</b></span>') +

function atSums(people) {
  const parts = [];

/* 엑셀 올리기 (4장): 화면에서 엑셀 읽기 도구(SheetJS)로 읽어 칸 글자만 서버로 */
let XLS = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return XLS || (XLS = new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = () => { XLS = null; no(new Error('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(sc);
  }));
}
/** 표(줄×칸 글자) → { ym, rows, tot, unknown } — 날짜 줄(1, 2, 3…)을 찾아 그 왼쪽 2·3·4칸 = 이름·직책·구역. hid[줄] = 엑셀에서 숨긴 줄 */
function atParse(aoa, hid) {
  const c = v => String(v == null ? '' : v).trim();
  let ym = '', hr = -1, c0 = -1;
  aoa.slice(0, 6).forEach(row => (row || []).forEach(v => { const m = /(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(c(v)); if (m && !ym) ym = m[1] + '-' + m[2].padStart(2, '0'); }));
  for (let r = 0; r < Math.min(aoa.length, 20) && hr < 0; r++) { const row = aoa[r] || []; for (let k = 0; k < row.length - 1; k++) if (c(row[k]) === '1' && c(row[k + 1]) === '2') { hr = r; c0 = k; break; } }
  if (hr < 0 || c0 < 2) return { error: '날짜 줄(1, 2, 3 …)을 찾지 못했습니다. 근무 스케줄 엑셀이 맞는지 확인해 주세요.' };
  let n = 0; while (n < 31 && c(aoa[hr][c0 + n]) === String(n + 1)) n++;
  const rows = [], unknown = {}; let sec = '', tot = null;
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r] || [], a = c0 >= 4 ? c(row[c0 - 4]) : '', role = c(row[c0 - 3]), name = c(row[c0 - 2]);
    const days = Array.from({ length: n }, (_, i) => c(row[c0 + i]));
    if (/총원/.test(a + role)) { tot = days.map(v => v === '' ? null : Number(v)); continue; }   // 빈 칸(엑셀이 안 센 날)은 맞춰 보지 않음
    if (/합계/.test(a + role)) continue;
    if (a) sec = a.replace(/\s+/g, '');
    if (!role && !name) continue;   // 요일 줄·아래 안내 글 (공사장 안전관리는 구역·직책 칸이 합쳐져 직책이 비어 있음)
    if (!name && hid && hid[r]) continue;   // 숨긴 빈 줄은 공석 아님 (숨긴 줄이라도 이름 있으면 읽음, 사용자 11-13)
    if (name) days.forEach(v => { if (AT_KNOWN.indexOf(v) === -1) unknown[v] = (unknown[v] || []).concat(name); });
    rows.push({ sec, role, name, days });
  }
  if (!rows.length) return { error: '직원 줄을 찾지 못했습니다.' };
  const ju = Array.from({ length: n }, (_, i) => rows.filter(x => x.name && !/^공사장/.test(x.sec) && atIsDay(x.days[i])).length);   // 엑셀 「주간근무총원」은 공사장 안전관리를 빼고 셈
  const bad = tot ? ju.map((v, i) => tot[i] == null || v === tot[i] ? 0 : i + 1).filter(Boolean) : null;
  return { ym, rows, n, bad, unknown };
}
function atB64(buf) { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

    const r0 = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']).s.r : 0, hid = (ws['!rows'] || []).slice(r0).map(x => !!(x && x.hidden));
    const p = atParse(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true }), hid);
    S.atup = Object.assign({ name: f.name, day: 1, file: buf.byteLength < 3e6 ? 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + atB64(buf) : '' }, p);
  } catch (e) { S.atup = { name: f.name, error: '엑셀을 읽지 못했습니다: ' + (e && e.message ? e.message : e) }; }
  render();
}
function renderAttUp() {
  const u = S.atup || {};

function periodBanner(st, counts) {
  if (!st) return '';
  const w = st.window, d = st.day, m = Number(st.ym.slice(5, 7));
  if (!st.isCurrent) return st.ym < st.curYm ? '<div class="banner b-gray">' + ymLabel(st.ym) + ' · 입력 기간 ' + m + '/' + w.start + '~' + m + '/' + w.end + ' · 마감됨</div>' : '';
  if (d < w.start) return '<div class="banner b-gray">이번 달 입력은 ' + m + '월 ' + w.start + '일부터 받습니다.</div>';
  if (d <= w.end) {
    const left = w.end - d;
    if (counts.wait > 0 && left <= 1) return '<div class="banner b-warn"><b>마감 임박</b> · ' + m + '월 ' + w.end + '일까지 · 점검 전 <b>' + counts.wait + '대</b></div>';

}

const LABEL_PRESETS = [[50, 50], [40, 40], [30, 34], [50, 30]];
// 라벨 프린터: BIXOLON SLP-TX400 (203dpi = 8점/mm). QR 한 칸이 프린터 점(dot) 정수 배가 되게 그려 흐림 없이 찍히게 함
function labelDpi() { return (S.qr && S.qr.label && Number(S.qr.label.dpi)) || (S.eh && Number(S.eh.dpi)) || 203; }
function qrMatrix(token, text, level) {   // text·level: 전열필증은 ?eh= 주소, 작은 칸이라 오류 보정 L (칸 수가 적어 점이 굵음)
  text = text || qrUrl(token);
  S.qrm = S.qrm || {};
  if (S.qrm[text]) return S.qrm[text];
  const tmp = document.createElement('div');
  const q = new QRCode(tmp, { text: text, width: 64, height: 64, correctLevel: QRCode.CorrectLevel[level || 'M'] });
  const m = q._oQRCode, n = m.getModuleCount(), rows = [];
  for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(m.isDark(r, c)); rows.push(row); }
  return (S.qrm[text] = rows);
}
// 원하는 크기(mm) 안에서 가장 큰 「점 정수 배」 QR 그림 → {src, mm}
function qrImage(token, maxMm, text, level) {
  const rows = qrMatrix(token, text, level), n = rows.length, quiet = 2, total = n + quiet * 2, dpi = labelDpi();
  const dots = Math.floor(maxMm / 25.4 * dpi);
  const per = Math.max(1, Math.floor(dots / total));
  const scale = 4, cv = document.createElement('canvas');   // 화면 미리보기도 또렷하게 4배로 그림
  cv.width = cv.height = per * total * scale;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
  const u = per * scale;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c]) g.fillRect((c + quiet) * u, (r + quiet) * u, u, u);
  return { src: cv.toDataURL('image/png'), mm: +(per * total / dpi * 25.4).toFixed(3) };
}
function labelHtml(i, L) {
  // 위: 소화기 이름 한 줄(작은 글자) / 아래: QR — 50×50 정사각형 라벨 기준
  const pad = 1.5, gap = 0.8, textMm = 2.8;
  const maxMm = Math.max(10, Math.min(L.w - pad * 2, L.h - pad * 2 - gap - textMm));
  const q = qrImage(i.token, maxMm);
  const name = i.store + ' 소화기' + i.no;
  // 글자 수에 맞춰 크기 자동 (최대 7pt, 최소 4.5pt) — 1pt ≈ 0.353mm, 한글 1자 ≈ 1em
  const units = Array.from(name).reduce((n, c) => n + (/[\x00-\x7F]/.test(c) ? 0.55 : 1), 0);
  const pt = Math.max(4.5, Math.min(7, (L.w - pad * 2) / Math.max(units, 1) / 0.353));
  return '<div class="label" style="width:' + L.w + 'mm;height:' + L.h + 'mm"><b style="font-size:' + pt.toFixed(1) + 'pt">' + h(name) + '</b><img src="' + q.src + '" style="width:' + q.mm + 'mm;height:' + q.mm + 'mm" alt=""></div>';
}
// 출력 → 먼저 미리보기 (크기 바꾸기) → 인쇄
function printLabels() {
  const ids = Object.keys(S.sel).filter(k => S.sel[k]);
  S.pv = { items: S.qr.items.filter(i => ids.indexOf(i.id) !== -1), L: { w: S.qr.label.w, h: S.qr.label.h } };
  renderPreview();
}
function renderPreview() {
  const P = S.pv, L = P.L, show = P.items.slice(0, 6);
  dialog('<div style="display:flex;align-items:center;margin-bottom:10px"><div class="fname"><b style="font-size:17px">라벨 미리보기</b><small>' + P.items.length + '장 · ' + L.w + '×' + L.h + 'mm (실제 크기) · ' + labelDpi() + 'dpi</small></div><button class="back" onclick="closeDialog()" aria-label="닫기">✕</button></div>' +
    '<div class="pvbox">' + show.map(i => labelHtml(i, L)).join('') + (P.items.length > show.length ? '<span class="pvmore">외 ' + (P.items.length - show.length) + '장</span>' : '') + '</div>' +
    '<div style="font-size:13px;color:var(--sub);margin:12px 0 6px">라벨 크기 (가로 × 세로 mm)</div>' +
    '<div class="pvpre">' + LABEL_PRESETS.map(p => '<button class="btn sm' + (p[0] === L.w && p[1] === L.h ? ' pri' : '') + '" onclick="pvSize(' + p[0] + ',' + p[1] + ')">' + p[0] + '×' + p[1] + (p[0] === 50 && p[1] === 50 ? ' (지금 라벨)' : '') + '</button>').join('') + '</div>' +
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="pvW" class="inp" type="number" min="15" max="100" step="0.5" value="' + L.w + '" aria-label="가로 mm" style="width:90px"><span>×</span><input id="pvH" class="inp" type="number" min="15" max="100" step="0.5" value="' + L.h + '" aria-label="세로 mm" style="width:90px"><button class="btn sm" onclick="pvSize($(\'pvW\').value,$(\'pvH\').value)">적용</button></div>' +
    '<details class="pvhelp"><summary>BIXOLON SLP-TX400 인쇄 설정</summary><ol>' +
      '<li>인쇄 창 <b>대상</b>: BIXOLON SLP-TX400</li>' +
      '<li><b>용지 크기</b>: ' + L.w + '×' + L.h + 'mm (없으면 아래 「드라이버에 용지 만들기」 한 번)</li>' +
      '<li><b>여백</b>: 없음 · <b>배율</b>: 기본(100%) · <b>머리글/바닥글</b>: 끔 · <b>배경 그래픽</b>: 켬</li>' +
      '<li>드라이버에 용지 만들기: Windows 설정 → 프린터 → SLP-TX400 → 인쇄 기본 설정 → 용지 <b>새로 만들기</b> → 가로 ' + L.w + ' · 세로 ' + L.h + 'mm, 여백 0 → 용지 종류 <b>갭(Gap, 라벨 사이 틈)</b></li>' +
      '<li>처음 한 번, 또는 라벨지를 바꾼 뒤 프린터 <b>FEED</b> 버튼으로 라벨 위치를 맞춥니다(캘리브레이션)</li></ol></details>' +
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="closeDialog()">닫기</button><button class="btn" style="flex:1" onclick="doPrint(true)">1장 시험 인쇄</button><button id="pvGo" class="btn pri" style="flex:2" onclick="doPrint()">' + ICON.print + ' 인쇄 (' + P.items.length + '장)</button></div>');
}
function pvSize(w, hh) {
  w = Number(w); hh = Number(hh);
  if (!(w >= 15 && w <= 100 && hh >= 15 && hh <= 100)) { toast('라벨 크기는 15~100mm 사이로 넣어 주세요.'); return; }
  S.pv.L = { w: w, h: hh }; renderPreview();
}
function doPrint(one) {
  const P = S.pv, L = P.L, list = one ? P.items.slice(0, 1) : P.items;
  const box = $('print');
  box.innerHTML = '<style>@page{size:' + L.w + 'mm ' + L.h + 'mm;margin:0}</style>' + list.map(i => labelHtml(i, L)).join('');
  if (L.w !== S.qr.label.w || L.h !== S.qr.label.h) {
    S.qr.label = Object.assign({}, S.qr.label, { w: L.w, h: L.h });
    run('labelSave', S.token, L.w, L.h).then(r => { if (r && !r.ok) toast(r.error); }, () => toast('라벨 크기를 저장하지 못했습니다. 인쇄는 그대로 됩니다.'));   // run = 구글·Supabase 둘 다
  }
  closeDialog();
  setTimeout(() => window.print(), 300);
}

/* ── ② 점검 현황 ── */
async function openStatus(ym) { go('status'); await loadStatus(ym || ''); }
async function loadStatus(ym) { S.st = null; render(); S.st = await call('feStatus', ym); S.ym = S.st.ym; render(); }
/* 현황 화면을 열어 두면 1분마다 조용히 다시 읽음 — 휴대폰에서 보낸 점검이 곧 녹색으로 (결정 54) */
let stBusy = false;
async function quietStatus() {
  if (stBusy || !S.st || ['status', 'floor'].indexOf(S.view) === -1 || document.hidden) return;
  stBusy = true;
  try {
    const r = await run('feStatus', S.token, S.st.ym);
    if (r && r.ok && S.st && r.ym === S.st.ym && ['status', 'floor'].indexOf(S.view) !== -1 && !document.querySelector('.dialog-back')) { S.st = r; render(); }
  } catch (e) { /* 다음 번에 다시 */ } finally { stBusy = false; }
}
setInterval(quietStatus, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) quietStatus(); });
function counts(items) { const c = { ok: 0, bad: 0, wait: 0, miss: 0, total: items.length }; items.forEach(i => c[i.state]++); return c; }
function renderStatus() {
  const st = S.st;
  if (!st) return topbar('소화기 점검 ›', '월별 점검 현황') + '<div class="wrap"><div class="banner b-gray">불러오는 중…</div></div>';
  const c = st.counts;
  const idx = st.months.indexOf(st.ym);
  const prev = idx > 0 ? st.months[idx - 1] : '';
  const next = idx >= 0 && idx < st.months.length - 1 ? st.months[idx + 1] : '';
  const floors = FLOORS.map(fl => {
    const it = st.items.filter(i => i.floor === fl);
    if (!it.length) return '';
    const fc = counts(it);
    const p = n => Math.round(n / fc.total * 100) + '%';
    const storesN = new Set(it.map(i => i.store)).size;
    return '<button class="floor" onclick="openFloor(\'' + fl + '\')"><span class="elbow"></span><b style="width:34px;font-size:15px">' + fl + '</b>' +
      '<span class="fname" style="gap:4px"><span class="bar"><span style="width:' + p(fc.ok) + ';background:var(--green)"></span><span style="width:' + p(fc.bad) + ';background:var(--orange)"></span><span style="width:' + p(fc.miss) + ';background:var(--red)"></span></span><small>매장 ' + storesN + ' · 소화기 ' + fc.total + '대</small></span>' +
      (fc.miss ? '<span class="chip c-miss">미입력 ' + fc.miss + '</span>' : '') + (fc.bad ? '<span class="chip c-bad">이상 ' + fc.bad + '</span>' : '') +
      '<b style="font-size:13px;color:var(--green)">' + (fc.ok + fc.bad) + '/' + fc.total + '</b>' + ICON.chev + '</button>';
  }).join('');
  return topbar('소화기 점검 ›', '월별 점검 현황') + '<div class="wrap list">' +
    '<div class="mnav"><button class="btn" aria-label="이전 달" ' + (prev ? 'onclick="loadStatus(\'' + prev + '\')"' : 'disabled') + '>‹</button><div><b style="font-size:17px">' + ymLabel(st.ym) + '</b><small style="color:var(--muted)">입력 기간 ' + Number(st.ym.slice(5, 7)) + '/' + st.window.start + ' ~ ' + Number(st.ym.slice(5, 7)) + '/' + st.window.end + '</small></div><button class="btn" aria-label="다음 달" ' + (next ? 'onclick="loadStatus(\'' + next + '\')"' : 'disabled') + '>›</button></div>' +
    periodBanner(st, c) +
    '<div class="card legend"><span><span class="dot" style="background:var(--green)"></span>점검완료 <b>' + c.ok + '</b></span><span><span class="dot" style="background:var(--orange)"></span>이상 있음 <b>' + c.bad + '</b></span><span><span class="dot" style="background:#9AA4B2"></span>점검 전 <b>' + c.wait + '</b></span><span><span class="dot" style="background:var(--red)"></span>미입력 <b>' + c.miss + '</b></span></div>' +
    '<div class="card tree"><div class="tree-root">' + ymLabel(st.ym) + ' · 전체 ' + c.total + '대</div>' + (floors || '<div style="padding:12px 0;color:var(--muted);font-size:14px">이 달에 등록된 소화기가 없습니다.</div>') + '</div>' +
    '<button class="btn" onclick="loadStatus(\'' + st.ym + '\')">새로고침</button></div>';
}
function openFloor(fl) { S.floor = fl; go('floor'); }
function renderFloor() {
  const st = S.st;
  const it = st.items.filter(i => i.floor === S.floor);
  const stores = [...new Set(it.map(i => i.store))];
  const chips = FLOORS.map(f => '<button class="fl' + (f === S.floor ? ' on' : '') + '" aria-pressed="' + (f === S.floor) + '" onclick="S.floor=\'' + f + '\';render()">' + f + '</button>').join('');
  const m = Number(st.ym.slice(5, 7));
  const body = stores.length ? stores.map(s => {
    const list = it.filter(i => i.store === s);
    const done = list.filter(i => i.state === 'ok' || i.state === 'bad').length;
    return '<div class="store"><div class="store-h"><b>' + h(s) + '</b><small style="color:var(--muted)">' + done + ' / ' + list.length + '</small></div>' +
      list.map(i => {
        const has = i.state === 'ok' || i.state === 'bad';
        const sub = has ? i.at + ' 입력' + (i.late ? ' · 기한 후' : '') : (i.state === 'miss' ? m + '월 ' + st.window.end + '일까지 입력 없음' : m + '월 ' + st.window.end + '일까지 입력 받는 중');
        return '<button class="feb" ' + (has ? 'onclick="detail(\'' + i.checkId + '\')"' : 'disabled') + '><span class="fname"><b>' + h(i.name) + '</b><small>' + h(sub) + '</small></span>' +
          (i.late ? '<span class="chip c-wait">기한 후</span>' : '') + '<span class="chip ' + STATE[i.state][1] + '">' + STATE[i.state][0] + '</span></button>';
      }).join('') + '</div>';
  }).join('') : '<div class="banner b-gray">' + S.floor + '에 등록된 소화기가 없습니다.</div>';
  return topbar('월별 점검 현황 › ' + ymLabel(st.ym) + ' ›', S.floor + ' · 소화기 ' + it.length + '대') + '<div class="wrap list">' +
    '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">' + chips + '</div>' + body +
    '<small style="text-align:center;color:var(--muted)">점검완료 · 이상 있음을 누르면 매장에서 입력한 내용을 봅니다</small></div>';
}
async function detail(id) {
  dialog('<div style="display:flex;justify-content:center;padding:40px"><span class="spin" style="color:var(--blue);width:28px;height:28px"></span></div>');
  try {
    const r = await call('feDetail', id);
    if (!r.ok) { closeDialog(); toast(r.error); return; }
    const bad = r.state === '이상있음';
    dialog('<div style="display:flex;align-items:center;margin-bottom:10px"><div class="fname"><b style="font-size:17px">' + h(r.name) + '</b><small>' + h(r.floor) + ' · ' + h(r.at) + ' 입력' + (r.late ? ' · 기한 후' : '') + '</small></div><button class="back" onclick="closeDialog()" aria-label="닫기">✕</button></div>' +
      '<div class="ph43">' + (r.photo ? '<img src="' + r.photo + '" alt="압력계 사진">' : '<small>사진 없음</small>') + '</div>' +
      '<div style="margin:10px 0"><span class="chip ' + (bad ? 'c-bad' : 'c-ok') + '">' + (bad ? '이상 있음' : '이상 없음') + '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><small style="color:var(--muted)">' + (bad ? '이상 내용' : '외관·압력 이상무') + ' (손글씨)</small><div class="sig">' + (r.signA ? '<img src="' + r.signA + '" alt="문구 손글씨">' : '') + '</div>' +
      '<small style="color:var(--muted)">이름 (손글씨)</small><div class="sig">' + (r.signB ? '<img src="' + r.signB + '" alt="이름 손글씨">' : '') + '</div></div>');
  } catch (e) { closeDialog(); }
}

async function loadEh(floor) { S.ehBusy = true; render(); try { ehSet(await call('ehList', floor)); } finally { S.ehBusy = false; render(); } }
function ehSet(r) {
  if (!r || !r.ok) { if (r && r.error) toast(r.error); return; }
  if (S.eh && S.eh.floor !== r.floor) S.ehSel = {};
  S.eh = r; S.ehFloor = r.floor;

function ehStore(id) { return S.eh.stores.find(s => s.id === id); }

/* ── 앱 안 PDF 보기: [PDF 열기]가 휴대폰의 드라이브·PDF 앱으로 넘어가면 구글 계정을 물음 → 앱 안에서 pdf.js 로 그림 (Supabase 판만) ──

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const PV_Z = [1, 1.5, 2, 3];
function pdfBtn(cls, label, url, o) {   // o = { name, sub, meta } — 돌아갈 화면은 지금 화면, cls = null 이면 글자 링크
  return '<a' + (cls == null ? '' : ' class="btn ' + cls + '"') + ' href="' + h(url) + '" target="_blank" rel="noopener" data-pv="' + h(JSON.stringify(o)) + '" onclick="return pdfOpen(this)">' + label + '</a>';
}
function pdfOpen(a) {
  if (!window.WS_API) return true;   // 구글 판: 새 창
  const o = JSON.parse(a.dataset.pv || '{}');
  S.pdf = { url: a.getAttribute('href'), name: o.name || 'PDF', sub: o.sub || '', meta: o.meta || '', from: S.view === 'pdf' && S.pdf ? S.pdf.from : S.view, z: 1, st: 'load', n: 0 };
  S.pdfDoc = null;
  go('pdf');
  pdfLoad();
  return false;
}
function pdfLib() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { if (!window.pdfjsLib) return no(new Error('PDF 도구를 불러오지 못했습니다')); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => no(new Error('PDF 도구를 불러오지 못했습니다'));
    document.head.appendChild(sc);
  });

async function pdfBytes(url) {
  const d = /^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)/.exec(url);
  if (d) {   // 드라이브로 옮긴 PDF: 브라우저가 직접 못 받음(CORS) → 구글 웹앱이 대신
    const j = await (await fetch(WS_CONFIG.WS_GAS_URL + '?api=pdf&id=' + encodeURIComponent(d[1]))).json();
    if (!j.ok) throw new Error(j.error || 'PDF를 받지 못했습니다');
    const s = atob(j.b64), b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error('PDF를 받지 못했습니다 (' + r.status + ')');
  return new Uint8Array(await r.arrayBuffer());

async function pdfLoad() {
  const me = S.pdf;
  me.st = 'load'; me.err = ''; if (S.view === 'pdf') render();
  try {
    const [lib, bytes] = await Promise.all([pdfLib(), pdfBytes(me.url)]);
    me.bytes = bytes;
    const doc = await lib.getDocument({ data: bytes.slice() }).promise;   // pdf.js 가 넘긴 배열을 비우므로 복사본을 줌 (내려받기용 원본 보존)
    if (S.pdf !== me) return;
    S.pdfDoc = doc; me.n = doc.numPages; me.st = 'ok';
  } catch (e) {
    if (S.pdf !== me) return;
    me.st = 'err'; me.err = String(e.message || e);
  }
  if (S.view === 'pdf') render();
}
function pvZoomLabel(z) { return z === 1 ? (window.innerWidth < 700 ? '쪽 맞춤' : '100%') : Math.round(z * 100) + '%'; }
function renderPdf() {
  const p = S.pdf;
  const tool = '<div class="pv-tool"><span class="fname"><b>' + h(p.name) + '</b><small>' + h([p.n ? p.n + '쪽' : '', p.meta].filter(Boolean).join(' · ') || 'PDF') + '</small></span>' +
    '<div class="pv-zoom" role="group" aria-label="크기"><button onclick="pvZoom(-1)" aria-label="작게"' + (p.z <= PV_Z[0] || p.st !== 'ok' ? ' disabled' : '') + '>−</button>' +
    '<span id="pvZ">' + pvZoomLabel(p.z) + '</span><button onclick="pvZoom(1)" aria-label="크게"' + (p.z >= PV_Z[PV_Z.length - 1] || p.st !== 'ok' ? ' disabled' : '') + '>+</button></div></div>';
  const body = p.st === 'err'
    ? '<div class="pv-state" role="alert"><b>PDF를 불러오지 못했습니다</b><span>' + h(p.err && !/fetch|network/i.test(p.err) ? p.err : '인터넷 연결을 확인하고 다시 시도해 주세요.') + '</span>' +
      '<button class="btn pri" onclick="pdfLoad()">다시 시도</button><a class="btn" href="' + h(p.url) + '" target="_blank" rel="noopener">새 창에서 열기</a>' +
      '<small style="color:var(--muted)">새 창에서 열면 휴대폰이 구글 계정을 물을 수 있습니다.</small></div>'
    : p.st === 'load' ? '<div class="pv-state"><div class="pv-spin" aria-hidden="true"></div><span>PDF 불러오는 중…</span></div>'
    : '<div class="pv-pages' + (p.z > 1 ? ' big' : '') + '" id="pvPages">' + Array.from({ length: p.n }, (_, i) => '<canvas class="pv-page" id="pvC' + (i + 1) + '" aria-label="' + (i + 1) + '쪽"></canvas><div class="pv-no">' + (i + 1) + ' / ' + p.n + '</div>').join('') + '</div>';
  return topbar(p.sub, 'PDF 보기') + tool + body +
    '<div class="backbar pv-bar"><button class="btn back-in" onclick="back()">' + ICON.back + '뒤로</button>' +
    '<button class="btn" onclick="pvDown()"' + (p.bytes ? '' : ' disabled') + '>' + ICON.file + '내려받기</button><button class="btn pri" onclick="pvShare()">공유</button></div>';
}
async function pvDraw() {
  const p = S.pdf, doc = S.pdfDoc, box = $('pvPages');
  if (!doc || !box) return;
  const fit = Math.min(960, box.clientWidth - 20), dpr = Math.min(window.devicePixelRatio || 1, 3), z = p.z;
  for (let i = 1; i <= p.n; i++) {
    const pg = await doc.getPage(i);
    if (S.pdf !== p || p.z !== z || S.view !== 'pdf') return;   // 그리는 중에 크기를 바꾸거나 나감
    const cv = $('pvC' + i); if (!cv) return;
    const w = fit * z, sc = w / pg.getViewport({ scale: 1 }).width;
    const k = Math.min(dpr, 4096 / w);   // 캔버스가 너무 크면 휴대폰이 못 그림
    const vp = pg.getViewport({ scale: sc * k });
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(vp.height / k) + 'px';
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
}
function pvZoom(d) {
  const p = S.pdf, i = PV_Z.indexOf(p.z) + d;
  if (i < 0 || i >= PV_Z.length) return;
  p.z = PV_Z[i]; render();
}
function pvDown() {
  const p = S.pdf; if (!p || !p.bytes) return;
  const u = URL.createObjectURL(new Blob([p.bytes], { type: 'application/pdf' })), a = document.createElement('a');
  a.href = u; a.download = p.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function pvShare() {
  const p = S.pdf; if (!p) return;
  if (navigator.share) { try { await navigator.share({ title: p.name, url: p.url }); } catch (e) {} return; }   // 취소해도 조용히
  try { await navigator.clipboard.writeText(p.url); toast('PDF 링크를 복사했습니다. 받는 사람은 로그인 없이 볼 수 있습니다.'); } catch (e) { prompt('PDF 링크 (복사해서 보내세요)', p.url); }
}

/* 필증 라벨 50×50mm (4장) — 오른쪽 아래 QR은 프린터 점에 맞춤 */
function ehFit(text, mm, max) { const u = Array.from(String(text)).reduce((n, c) => n + (/[\x00-\x7F]/.test(c) ? 0.56 : 1), 0); return Math.max(4.5, Math.min(max, (mm - 1.6) / Math.max(u, 1) / 0.353)).toFixed(1); }
function ehUrl(token) { return ((S.eh && S.eh.execUrl) || EXEC_URL) + '?eh=' + token; }
function ehLabel(i) {

/* ── 공사장 점검 (WS_공사장점검, 결정 100): 현장 목록 → 현장 점검(자동 저장) → 날짜별·현장별 PDF ── */
const CS_ST = [['양호', 'ok'], ['미흡', 'bad'], ['해당없음', 'na']];
const CS_MAX_PHOTOS = 6;   // 한 줄 3장 × 2줄 (사용자 11-11)
// 빈 사진 칸: 첫 줄은 3칸을 채워 보여 주고, 3장을 넘기면 다음 줄에 「＋ 사진 추가」 1칸 (최대 6장)
function csAddSlots(x, i) {
  const n = x.photos.length;
  if (n >= CS_MAX_PHOTOS) return '';
  const k = n < 3 ? 3 - n : 1;
  return Array.from({ length: k }, () => '<label class="ph43"><b>＋</b>' + (n < 3 ? '사진' : '사진 추가') + '<input type="file" accept="image/*" hidden onchange="csPhAdd(' + i + ',this)"></label>').join('');
}
function csDay(d) { return Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + '일월화수목금토'[new Date(d + 'T00:00:00').getDay()] + ')'; }
function csNow(dateToo) { const d = new Date(), p = n => String(n).padStart(2, '0'); return (dateToo ? d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' : '') + p(d.getHours()) + ':' + p(d.getMinutes()); }
function csCnt(k) { const c = { '양호': 0, '미흡': 0, '해당없음': 0 }; k.items.forEach(x => { if (c[x.st] !== undefined) c[x.st]++; }); return c; }
const CS_RD = ['오후점검', '퇴실점검', '추가 점검'];   // 하루 2번 (사용자 11-13, 결정 112). 3회차는 하루 3번 하던 11-11~12 기록만
const csRds = has3 => has3 ? [1, 2, 3] : [1, 2];
function csRdChip(c, n) {

  if (!c) return '<span class="wait">' + L + ' 전</span>';
  return c.bad ? '<span class="bad">' + L + ' 미흡 ' + c.bad + '</span>' : '<span class="ok">' + L + ' 양호</span>';
}
// 점검 줄들을 날짜·현장별로 묶음 (회차 1·2·3 → r)
function csGroups(list) {
  const out = [], by = {};
  list.forEach(c => { const key = c.date + '|' + c.site; let g = by[key]; if (!g) out.push(g = by[key] = { date: c.date, site: c.site, name: c.name, work: c.work, co: c.co, r: {}, list: [] }); g.r[c.round] = c; g.list.push(c); });
  return out;
}
// 현장·하루 PDF 1개: 세 회차 줄에 같은 PDF. 그 뒤 고치거나 새 회차를 하면 옛 판
function csDayPdf(list) {

// 검색: 현장명·업체·공사 내용·날짜 (2026-11-11, 11-11, 11/11, 11.11, 11월 11일, 11월). 띄어쓰기 무시
function csHit(q, g) {
  if (!q) return true;
  const d = g.date, m = Number(d.slice(5, 7)), dd = Number(d.slice(8, 10));
  return [g.name, g.co, g.work, d, m + '-' + dd, m + '/' + dd, m + '.' + dd, m + '월' + dd + '일', m + '월'].join('|').replace(/\s/g, '').toLowerCase().indexOf(q) !== -1;
}

  $('ciSb').disabled = true;
  try {
    const r = await call('csItemsSave', S.csIt);
    if (!r.ok) { $('ciM').textContent = r.error; $('ciSb').disabled = false; return; }
    S.cs.items = r.items; closeDialog(); render(); toast('기본 항목 ' + r.items.length + '개 저장');
  } catch (e) { $('ciSb').disabled = false; }
}
/* 현장 점검: 고칠 때마다 1.5초 뒤 자동 저장, 사진은 고르면 바로 저장. 저장은 한 번에 하나씩 (같은 사진 두 번 안 올림) */
async function csOpen(date, id, round, same) {
  S.ck = null; go('csck', !same);
  const r = await call('csGet', date, id, round);
  if (!r.ok) { toast(r.error); go('cs'); return; }
  S.ck = Object.assign(r, { ver: 0, dirty: false, saving: null, err: false, pdfBusy: false });
  if (S.view === 'csck') render();
}
// 회차 칸: 저장한 회차와 그다음 회차만 누를 수 있음 (오후점검 → 퇴실점검)
function csTabsHtml(k) {
  const by = {}; (k.rounds || []).forEach(c => { by[c.round] = c; });
  return '<div class="csrtabs" role="tablist" aria-label="점검 회차">' + csRds(by[3]).map(n => {
    const c = by[n], on = n === k.round, can = !!(c || n === 1 || by[n - 1]);
    const sub = c ? '✓ ' + String(c.at).slice(11, 16) + ' ' + c.by : on ? '지금 점검' : '점검 전';
    return '<button type="button" role="tab" aria-selected="' + on + '"' + (on ? ' class="on"' : can ? ' onclick="csRound(' + n + ')"' : ' disabled') + '>' + CS_RD[n - 1] + '<small>' + h(sub) + '</small></button>';
  }).join('') + '</div>';
}
async function csRound(n) {
  const k = S.ck; if (!k || k.pdfBusy) return;
  if ((k.dirty || k.saving) && !(await csFlush()) && !confirm('저장하지 못했습니다. 그래도 넘어갈까요? (고친 내용이 사라질 수 있습니다)')) return;
  csOpen(k.date, k.site.id, n, true);
}
function csStateHtml() {
  const k = S.ck;
  if (k.saving) return '<span class="csst">저장 중…</span>';
  if (k.err) return '<span class="csst err">● 저장 못 함</span> <button class="btn sm" onclick="csDirty(true)">다시 저장</button>';
  if (k.dirty) return '<span class="csst dirty">● 곧 자동 저장</span>';
  return k.check ? '<span class="csst ok">● 저장됨 ' + h(String(k.check.saved).slice(11, 16)) + '</span>' : '<span class="csst">아직 저장 전</span>';
}
function renderCsCk() {
  const k = S.ck;
  if (!k) return topbar('공사장 점검 ›', '불러오는 중') + '<div class="wrap list"><div class="banner b-gray">불러오는 중…</div></div>';
  const c = csCnt(k), left = k.items.length - c['양호'] - c['미흡'] - c['해당없음'];
  const R = CS_RD[k.round - 1], dp = csDayPdf(k.rounds);
  return topbar(csDay(k.date) + ' 공사장 점검', k.site.name) + '<div class="wrap list" style="padding-bottom:120px">' + csTabsHtml(k) +
    '<div class="card csmeta"><div><small>현장</small><b>' + h(k.site.name) + '</b></div><div><small>공사 내용 · 업체</small><b>' + h([k.site.work, k.site.co].filter(Boolean).join(' · ') || '-') + '</b></div>' +
    '<div><small>점검자 <em>자동</em></small><b>' + h(k.check ? k.check.by : S.user.name) + '</b></div><div><small>' + R + ' 시각 <em>자동</em></small><b>' + h(k.check ? k.check.at : '처음 저장할 때') + '</b></div></div>' +
    k.items.map(csItemHtml).join('') +
    '<button class="btn big csadd" onclick="csExtraOpen()">＋ 이 현장에 점검 항목 추가</button></div>' +
    '<div class="csbar"><div class="csbar-in"><div><b>미흡 ' + c['미흡'] + ' · 양호 ' + c['양호'] + (c['해당없음'] ? ' · 해당없음 ' + c['해당없음'] : '') + '</b>' + (left ? ' · 안 고름 ' + left : '') + '<br><span id="csSt">' + csStateHtml() + '</span></div>' +
    (dp && !dp.stale && !k.pdfBusy ? pdfBtn('big', 'PDF 열기', dp.url, { name: k.date + '_공사장점검-' + k.site.name + '.pdf', sub: '공사장 점검 ›' }) : '') +
    '<button class="btn big pri" onclick="csPdf()"' + (k.pdfBusy ? ' disabled' : '') + '>' + (k.pdfBusy ? '<span class="spin"></span> PDF 만드는 중' : dp && !dp.stale ? 'PDF 다시' : '점검 끝 · PDF') + '</button></div></div>';
}
function csItemHtml(x, i) {
  return '<div class="card csit' + (x.st === '미흡' ? ' bad' : '') + '"><h3><span>' + (i + 1) + '. ' + h(x.t) + '</span>' + (x.extra ? '<button class="btn sm warn" onclick="csExtraDel(' + i + ')">지우기</button>' : '') + '</h3>' +
    '<p>' + h(x.d) + '</p>' +
    '<div class="seg csseg" role="group" aria-label="' + h(x.t) + ' 결과">' + CS_ST.map(s => '<button type="button" class="' + s[1] + (x.st === s[0] ? ' on' : '') + '" aria-pressed="' + (x.st === s[0]) + '" onclick="csSt(' + i + ',\'' + s[0] + '\')">' + s[0] + '</button>').join('') + '</div>' +
    '<div class="csph">' + x.photos.map((p, j) => '<div class="ph43"><img src="' + h(p.src) + '" alt="' + h(x.t) + ' 사진 ' + (j + 1) + '"><span class="tm">' + h(p.at) + ' 촬영</span><button class="x" onclick="csPhDel(' + i + ',' + j + ')" aria-label="사진 지우기">✕</button></div>').join('') +
    csAddSlots(x, i) + '</div>' +
    '<textarea class="inp csmemo" maxlength="300" placeholder="특이사항 (미흡이면 꼭 적기)" oninput="csMemo(' + i + ',this)">' + h(x.memo) + '</textarea></div>';
}
function csSt(i, s) { const x = S.ck.items[i]; x.st = x.st === s ? '' : s; csDirty(); render(); }
function csMemo(i, el) { S.ck.items[i].memo = el.value; csDirty(); }
async function csPhAdd(i, el) {
  const f = el.files && el.files[0]; if (!f) return;
  try { const src = await shrinkJpeg(f, 1600, 0.7); S.ck.items[i].photos.push({ id: '', src: src, at: csNow() }); csDirty(true); render(); } catch (e) { toast(e.message); }
}
function csPhDel(i, j) { if (!confirm('이 사진을 지울까요?')) return; S.ck.items[i].photos.splice(j, 1); csDirty(); render(); }
function csExtraOpen() {
  dialog('<h3 class="ehdh">이 현장에 항목 추가</h3><p class="ehdp">이번 점검의 이 현장에만 들어갑니다. 모든 현장에 넣으려면 관리자에게 「기본 항목」을 고쳐 달라고 해 주세요.</p>' +
    '<label class="ehf">항목 이름<input class="inp" id="cxT" maxlength="30"></label><label class="ehf">설명 (점검 기준, 없어도 됨)<input class="inp" id="cxD" maxlength="100"></label>' +
    '<div id="cxM" role="alert" class="ehmsg"></div>' +
    '<div class="ehda"><button class="btn big" style="flex:1" onclick="closeDialog()">취소</button><button class="btn big pri" style="flex:2" onclick="csExtraAdd()">추가</button></div>');
  $('cxT').focus();
}
function csExtraAdd() {
  const t = $('cxT').value.trim(); if (!t) { $('cxM').textContent = '항목 이름을 넣어 주세요'; return; }
  S.ck.items.push({ t: t, d: $('cxD').value.trim(), st: '', memo: '', photos: [], extra: true });
  closeDialog(); csDirty(); render(); window.scrollTo(0, document.body.scrollHeight);
}
function csExtraDel(i) { if (!confirm('「' + S.ck.items[i].t + '」 항목을 지울까요?')) return; S.ck.items.splice(i, 1); csDirty(); render(); }
let CS_T = null;
function csDirty(now) { const k = S.ck; k.ver++; k.dirty = true; k.err = false; csStRefresh(); clearTimeout(CS_T); CS_T = setTimeout(csFlush, now ? 0 : 1500); }
function csStRefresh() { const e = $('csSt'); if (e && S.ck) e.innerHTML = csStateHtml(); }
function csFlush() {
  const k = S.ck;
  if (!k) return Promise.resolve(true);
  if (k.saving) return k.saving.then(() => csFlush());
  if (!k.dirty) return Promise.resolve(!k.err);
  clearTimeout(CS_T);
  const ver = k.ver, sent = k.items.map(x => x.photos.slice());
  const body = k.items.map(x => ({ t: x.t, d: x.d, st: x.st, memo: x.memo, extra: !!x.extra, photos: x.photos.map(p => ({ id: p.id, at: p.at, data: p.id ? '' : p.src })) }));
  k.saving = call('csSave', k.date, k.site.id, body, k.round).then(r => {
    if (!r.ok) { k.err = true; toast(r.error); return false; }
    r.items.forEach((ids, i) => ids.forEach((id, j) => { if (sent[i] && sent[i][j]) sent[i][j].id = id; }));
    k.check = r.check; k.rounds = r.rounds; if (k.ver === ver) k.dirty = false;
    toast('자동 저장했습니다');
    return true;
  }, () => { k.err = true; return false; }).then(ok => {
    k.saving = null;
    if (S.ck === k && S.view === 'csck') { const a = document.activeElement; if (a && a.tagName === 'TEXTAREA') csStRefresh(); else render(); }   // 쓰는 중이면 글자 칸을 다시 그리지 않음
    return ok;
  });
  csStRefresh();
  return k.saving;
}
async function csLeave() {
  const k = S.ck;
  if (k && (k.dirty || k.saving)) {
    toast('저장하는 중…');
    if (!(await csFlush()) && !confirm('저장하지 못했습니다. 그래도 나갈까요? (고친 내용이 사라질 수 있습니다)')) return;
  }
  S.ck = null; go('cs'); loadCs();
}
async function csPdf() {
  const k = S.ck; if (k.pdfBusy) return;
  const left = k.items.filter(x => !x.st).length;
  if (left && !confirm('결과(양호·미흡·해당없음)를 고르지 않은 항목이 ' + left + '개 있습니다. 그래도 PDF를 만들까요?')) return;
  if (k.items.some(x => x.st === '미흡' && !x.memo.trim()) && !confirm('미흡인데 특이사항이 빈 항목이 있습니다. 그래도 PDF를 만들까요?')) return;
  if (!k.check) k.dirty = true;   // 한 번도 저장 안 했으면 먼저 저장 (점검자·시각이 찍힘)
  k.pdfBusy = true; render();
  try {
    if (!(await csFlush()) || !k.check) throw new Error('저장하지 못했습니다');
    await loadH2p();
    // 현장·하루 1개: 저장한 회차를 오전 → 오후 → 작업종료 순으로 (지금 회차는 화면 것, 나머지는 불러옴)
    const secs = [];
    for (const c of k.rounds) {
      if (c.round === k.round) { secs.push(k); continue; }
      const g = await call('csGet', k.date, k.site.id, c.round);
      if (!g.ok || !g.check) throw new Error(g.error || CS_RD[c.round - 1] + ' 점검을 불러오지 못했습니다');
      secs.push(g);
    }
    const r = await call('csSavePdf', k.check.id, await csMakePdf(k, secs));
    if (!r.ok) throw new Error(r.error);
    k.check = r.check; k.rounds = r.rounds; toast(r.warn || 'PDF를 저장했습니다' + (secs.length > 1 ? ' (' + secs.map(x => CS_RD[x.round - 1]).join('·') + ')' : ''));
  } catch (e) { toast('PDF를 만들지 못했습니다: ' + (e && e.message ? e.message : e)); }
  k.pdfBusy = false; if (S.ck === k) render();
}
/* PDF = A4 세로, 현장·하루 1파일, 회차마다 새 쪽 (항목이 많으면 다음 쪽으로). 시안 docs/양식/WS_공사장점검_시안_pdf.png */
function csPdfHtml(k, i) {
  const c = csCnt(k), L = { '양호': 'ok', '미흡': 'bad', '해당없음': 'na' };
  return '<div class="cspdf"' + (i ? ' style="page-break-before:always"' : '') + '><div class="pt">공사장 안전점검 보고서</div><div class="ps">에비뉴엘 잠실점 시설팀 · ' + k.date.slice(0, 4) + '년 ' + csDay(k.date) + ' · <b>' + CS_RD[k.round - 1] + '</b></div>' +
    '<table><tr><th>현장</th><td>' + h(k.site.name) + '</td><th>공사 내용</th><td>' + h(k.site.work || '-') + '</td><th>업체</th><td>' + h(k.site.co || '-') + '</td></tr>' +
    '<tr><th>점검자</th><td>' + h(k.check.by) + '</td><th>점검 시각</th><td>' + h(k.check.at) + '</td><th>결과</th><td>' + (c['미흡'] ? '<b style="color:#C0261A">미흡 ' + c['미흡'] + '</b> · ' : '') + '양호 ' + c['양호'] + ' · 해당없음 ' + c['해당없음'] + '</td></tr></table>' +
    '<div class="g">' + k.items.map((x, i) => '<div class="pc"><h4><span>' + (i + 1) + '. ' + h(x.t) + '</span><em class="' + (L[x.st] || '') + '">' + (x.st || '안 고름') + '</em></h4><p>' + h(x.d) + '</p>' +
      '<div class="pp n' + x.photos.length + '">' + (x.photos.length ? x.photos.map(p => '<div class="cell"><img src="' + h(p.src) + '" alt=""></div>').join('') : '사진 없음') + '</div>' +
      '<div class="cm">' + h(x.memo) + '</div></div>').join('') + '</div>' +
    '<div class="ft"><span>출력 ' + csNow(true) + ' · 업무지원 앱</span><span>' + h(k.site.name) + ' · ' + CS_RD[k.round - 1] + '</span></div></div>';
}
async function csMakePdf(k, secs) {
  const wrap = document.createElement('div'); wrap.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1';
  wrap.innerHTML = '<div style="width:734px">' + secs.map(csPdfHtml).join('') + '</div>'; document.body.appendChild(wrap);
  const pg = wrap.firstChild;
  try {
    try { if (document.fonts) await document.fonts.ready; } catch (e) {}
    await Promise.all([...pg.querySelectorAll('img')].map(im => im.decode ? im.decode().catch(() => {}) : null));
    // 사진은 자르지 않고 칸에 맞춰 줄임 (03 9장) — PDF 도구가 object-fit을 못 읽어 크기를 직접 정함
    pg.querySelectorAll('.cell img').forEach(im => {
      const c = im.parentNode, sc = Math.min(c.clientWidth / im.naturalWidth, c.clientHeight / im.naturalHeight) || 1;
      im.style.width = Math.floor(im.naturalWidth * sc) + 'px'; im.style.height = Math.floor(im.naturalHeight * sc) + 'px';
    });
    const keepY = window.scrollY; window.scrollTo(0, 0);
    try {
      return await html2pdf().set({
        margin: [30, 30, 30, 30], filename: k.date + '_공사장점검.pdf', image: { type: 'jpeg', quality: 0.9 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: 734 },
        jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] },
        pagebreak: { mode: ['css'], avoid: ['.pc', 'tr'] }
      }).from(pg).outputPdf('datauristring');
    } finally { window.scrollTo(0, keepY); }
  } finally { wrap.remove(); }
}

/* ── 그리기 ── */
function render() {
  let html;
  if (S.view === 'loading') html = renderLoading();
  else if (S.view === 'retry') html = renderRetry();
  else if (S.view === 'device') html = renderDevice();
  else if (S.view === 'sign' && S.sign) html = renderSign();
  else if (!S.token || S.view === 'login') html = renderLogin();
  else if (S.view === 'pdf' && S.pdf) html = renderPdf();
  else if (S.view === 'docs') html = renderDocs();
  else if (S.view === 'tbm') html = renderTbm();
  else if (S.view === 'nw') html = renderNw();
  else if (S.view === 'log') html = renderLog();
  else if (S.view === 'att') html = renderAtt();
  else if (S.view === 'attup') html = renderAttUp();
  else if (S.view === 'inspect') html = renderInspect();
  else if (S.view === 'fire') html = renderFire();
  else if (S.view === 'qr') html = renderQr();
  else if (S.view === 'eh') html = renderEh();
  else if (S.view === 'cs') html = renderCs();
  else if (S.view === 'csck') html = renderCsCk();
  else if (S.view === 'status') html = renderStatus();
  else if (S.view === 'floor') html = S.st ? renderFloor() : renderStatus();
  else if (S.view === 'set' && isBoss()) html = renderSet();
  else if (S.view === 'risk' && isBoss()) html = renderRisk();
  else html = renderMain();
  if (PARENT[S.view] && S.token && S.user) {   // 아래 뒤로 버튼 (위 < 는 뺌, 결정 102). 저장 줄이 있으면 그 줄 맨 왼쪽에 (WS-25)
    const h2 = withBack(html);
    html = h2 !== html ? h2 : html + '<div class="wrap backbar"><button class="btn big" onclick="back()">' + ICON.back + '뒤로</button></div>';
  }
  $('app').innerHTML = html;
  if (S.view === 'qr') drawQrs();
  if (S.view === 'sign') mountSign();
  if (S.view === 'pdf') pvDraw();
}

(async function start() {
  render();   // 「불러오는 중」 — 저장된 표를 확인하는 동안 PIN 화면을 보이지 않음 (결정 48)
  if (window.WS_API) {   // 바로가기 앱: 기기 등록(시설팀 공용 계정 Supabase 로그인)이 먼저 (Supabase 이관 3-1)
    try { S.device = await WS_API.device(); } catch (e) { S.device = null; }
    if (!S.device) { S.view = 'device'; render(); return; }
  }
  if (!tokenAlive(S.token)) {
    store('ws_token', null); S.token = '';
    const t = await SHELL.get();
    if (tokenAlive(t)) { S.token = t; store('ws_token', t); }
  } else SHELL.set(S.token);
  if (!S.token) { S.view = 'login'; render(); return; }
  // 이 기기에 기억한 지난번 메인 화면을 먼저 보여 주고, 서버 확인은 뒤에서 (로딩 개선, 결정 76). 표의 주인이 같을 때만
  let m = null; try { m = JSON.parse(store('ws_main') || 'null'); } catch (e) {}
  if (m && m.user && m.sid === String(S.token).split('.')[0]) { S.user = m.user; S.fire = m.fire; S.docs = m.docs; S.cached = true; S.view = 'main'; render(); }
  await boot(true);
})();
</script>
