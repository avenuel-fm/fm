  }

  /* ── 끊김 대비: 저장이 네트워크 문제로 실패하면 이 기기에 보관했다가 다시 보냄 ── */
  var PKEY = 'dr_pending';
  function pendingAll() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
  function pendingPut(all) { try { localStorage.setItem(PKEY, JSON.stringify(all)); } catch (e) { /* 저장 공간 부족 */ } }
  function pendingKey(p) { return (p.storeId || p.clientId) + '#' + (p.round || 1); }
  function pendingCount() { return Object.keys(pendingAll()).length; }
  function isNetErr(e) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
    return /network|네트워크|connection|failed to fetch|timed? ?out|시간 초과|http 0|연결|lock|server error|서버 오류|try again|다시 시도/i.test(errMsg(e));
  }
  function queueSave(payload, finalize) {
    var all = pendingAll(), k = pendingKey(payload);
    all[k] = { key: k, review: payload, finalize: !!(finalize || (all[k] && all[k].finalize)), at: nowFull(), by: S.auth.role, tenant: payload.tenant || '' };
    pendingPut(all);
  }
  var flushing = null;
  /** 보관한 저장을 순서대로 다시 보냄. 네트워크 문제면 다음에 다시, 그 밖의 오류는 대시보드에 표시 */
  function flushPending(manual) {
    if (flushing || !S.auth) return flushing || Promise.resolve();
    var keys = Object.keys(pendingAll());
    if (!keys.length) return Promise.resolve();
    var sent = 0;
    flushing = keys.reduce(function (chain, k) {
      return chain.then(function (stop) {
        if (stop) return true;
        var it = pendingAll()[k]; if (!it || (it.err && !manual)) return false;
        return api('apiSaveReview', S.auth, it.review, it.finalize).then(function (b) {
          var all = pendingAll(); delete all[k]; pendingPut(all); sent++;
          var mine = S.view === 'edit' && ((S.store && S.store.id === b.store.id) || (!S.store && it.review.clientId && it.review.clientId === S.clientId));
          if (mine && !S.dirty) {
            var wasNew = !S.store;
            S.store = b.store; S.reviews = b.reviews;
            if (wasNew) renderEditor(true);
            setSaveState('ok', '구글시트 저장됨 · ' + nowHM());
          }
          return false;
        }, function (e) {
          if (isNetErr(e)) return true;
          var all = pendingAll(); if (all[k]) { all[k].err = errMsg(e); pendingPut(all); }
          return false;
        });
      });
    }, Promise.resolve(false)).then(function () {
      flushing = null;
      if (sent) toast('이 기기에 보관했던 검토서 ' + sent + '건을 구글시트에 저장했습니다');
      if (S.view === 'dash') { renderPendingBar(); if (sent) openDashboard(); }
    });
    return flushing;
  }
  function renderPendingBar() {
    var el = $('#pendingBar'); if (!el) return;
    var all = pendingAll(), list = Object.keys(all).map(function (k) { return all[k]; });
    if (!list.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="pendbar"><div><b>이 기기에 임시 보관된 검토서 ' + list.length + '건</b> · 연결되면 자동으로 구글시트에 저장합니다.' +
      list.map(function (it) {
        return '<div class="small" style="margin-top:6px">' + esc(it.tenant || '(테넌트명 없음)') + ' · ' + (it.review.round || 1) + '차 · ' + esc(it.at) +
          (it.err ? ' · <span style="color:var(--red)">저장 안 됨: ' + esc(it.err) + '</span> <button type="button" class="btn sm del" data-act="pendDrop" data-key="' + esc(it.key) + '">버리기</button>' : '') + '</div>';
      }).join('') + '</div><button type="button" class="btn sm pri" data-act="pendFlush">지금 보내기</button></div>';
  }
  window.addEventListener('online', function () { flushPending(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) flushPending(); });
  setInterval(function () { if (pendingCount()) flushPending(); }, 30000);

  function setSaveState(kind, text) {
    $$('.savestate').forEach(function (el) {
      el.className = 'savestate' + (el.classList.contains('fs') ? ' fs' : '') + (kind ? ' ' + kind : '');
      el.innerHTML = (kind === 'ok' ? ICON.check : '') + esc(text);
    });
  }

  function markDirty() {
    S.dirty = true;
    setSaveState('dirty', '저장 안 됨');
    clearTimeout(S.autosaveTimer);
    if (S.store && !isLocked()) {
      S.autosaveTimer = setTimeout(function () { if (S.dirty && S.view === 'edit') save(false, true); }, 30000);
    }
  }

  function save(finalize, quiet, skipMissing) {
    if (isLocked()) return Promise.resolve(true);
    if (S.saving) {
      // 저장 중에 다시 누름: 소리 없이 무시하지 않고 안내. 자동 저장 중이거나 더 큰 저장(검토 완료)이면 끝난 뒤 이어서 처리
      if (!quiet) {
        if (!S.savingLoud || (finalize && !S.savingFin)) {
          S.saveNext = { finalize: !!(finalize || (S.saveNext && S.saveNext.finalize)), quiet: false };
          setSaveBusy(finalize ? 'finalize' : 'save');
          toast('저장 중입니다. 끝나면 이어서 ' + (finalize ? '검토 완료로 저장합니다' : '저장합니다'));
        } else toast('저장 중입니다. 잠시만 기다려 주세요');
      }
      return Promise.resolve(false);
    }
    if (finalize && breakerCheck(S.review).state === 'bad') { openBreakerPopup(); return Promise.resolve(false); }
    if (finalize && !skipMissing) {
      var miss = listMissing();
      if (miss.length) { showMissing(miss); return Promise.resolve(false); }
    }
    if (!S.review.tenant) {
      toast('테넌트명을 먼저 입력해 주세요.', true);
      var t = $('#f-tenant'); if (t) t.focus();
      return Promise.resolve(false);
    }
    S.saving = true; S.savingLoud = !quiet; S.savingFin = !!finalize;
    if (!quiet) setSaveBusy(finalize ? 'finalize' : 'save');
    clearTimeout(S.autosaveTimer);
    setSaveState('', '저장 중…');
    // 적용 지침을 정확히 적으려면 검색 색인이 필요 (특이사항에 쪽 번호가 있을 때만 불러옴)
    var needIdx = !S.guide && /p\.\d+\)/.test(String(S.review.notes || '')) && guides().length;
    var snapshot, wasNew = !S.store, payload;
    return (needIdx ? ensureGuide().catch(function () {}) : Promise.resolve()).then(function () {
      S.review.guideVer = guideVerText();
      snapshot = JSON.stringify(S.review);
      payload = Object.assign({}, S.review, { storeId: S.store ? S.store.id : '', round: S.round, clientId: S.store ? '' : S.clientId, _sigCleared: (S.sigCleared || []).slice() });
      return api('apiSaveReview', S.auth, payload, !!finalize);
    }).then(function (b) {
      S.store = b.store; S.reviews = b.reviews;
      var pall = pendingAll(), pk = pendingKey(payload);
      if (pall[pk]) { delete pall[pk]; pendingPut(pall); }
      mergeCompanies(S.review);
      var saved = b.reviews.filter(function (x) { return Number(x.round) === S.round; })[0];
      if (saved) {
        S.review.status = saved.status; S.review.id = saved.id;
        // 화면을 열어 둔 사이 원격 서명이 들어왔으면 화면에도 반영
        var got = mergeRemoteSigs(saved);
        if (got) snapshot = JSON.stringify(Object.assign(JSON.parse(snapshot), got));
      }
      S.sigCleared = [];
      S.dirty = JSON.stringify(Object.assign({}, S.review, { status: '', id: '' })) !== JSON.stringify(Object.assign(JSON.parse(snapshot), { status: '', id: '' }));
      if (wasNew || finalize) renderEditor(true);
      else {
        var hd = $('#hdrDoc'); if (hd) hd.textContent = S.store.docNo;
        updateSpecRec(); refreshSigReq();
      }
      setSaveState(S.dirty ? 'dirty' : 'ok', S.dirty ? '저장 안 됨' : '구글시트 저장됨 · ' + nowHM());
      if (!quiet) toast(finalize ? '검토 완료로 구글시트에 저장했습니다' : (wasNew ? '저장했습니다. 문서번호 ' + S.store.docNo : '구글시트에 저장했습니다'));
      if (finalize) autoKeepPdf();
      return true;
    }).catch(function (e) {
      if (isNetErr(e)) {
        queueSave(payload, finalize);
        S.dirty = false;
        setSaveState('pending', '저장 대기 중 · 연결되면 자동 저장');
        if (!quiet) toast('인터넷 연결이 불안정해 이 기기에 임시 보관했습니다. 연결되면 자동으로 구글시트에 저장합니다');
        return true;
      }
      setSaveState('dirty', '저장 실패');
      toast(errMsg(e), true);
      return false;
    }).then(function (ok) {
      S.saving = false; S.savingLoud = false; S.savingFin = false;
      setSaveBusy(null);
      var n = S.saveNext; S.saveNext = null;
      if (n && S.view === 'edit') setTimeout(function () { save(n.finalize, n.quiet); }, 0);
      return ok;
    });
  }

  /** 저장 버튼 상태: 누르는 즉시 "저장 중…"(회전 표시), 끝나면 원래대로 */
  function setSaveBusy(kind) {
    $$('[data-act="save"],[data-act="finalize"]').forEach(function (b) {
      if (kind) {
        if (b.dataset.label == null) { b.dataset.label = b.innerHTML; b.style.minWidth = b.offsetWidth ? b.offsetWidth + 'px' : ''; }
        b.classList.add('busy'); b.setAttribute('aria-busy', 'true');
        b.innerHTML = b.dataset.act === kind ? '<span class="spin" aria-hidden="true"></span>저장 중…' : b.dataset.label;
      } else if (b.dataset.label != null) {
        b.innerHTML = b.dataset.label; delete b.dataset.label;
        b.style.minWidth = ''; b.classList.remove('busy'); b.removeAttribute('aria-busy');
      }
    });
  }
  /** 적용 지침: 특이사항에 쪽 번호를 넣은 지침 (없으면 현재 검색에 쓰는 지침 전체) */
  function guideVerText() {
    var notes = String(S.review.notes || '');
    var used = allGuides().filter(function (g) {
      if (notes.indexOf('(' + g.short) >= 0) return true;
      // 쪽 아래 번호를 쓰는 지침은 구분 이름으로 들어감: (설비공사 지침 6/10, p.30)
      return (S.guide || []).some(function (e) { return e.d === g.id && e.lp && e.s && notes.indexOf('(' + e.s + ' ' + e.lp + ',') >= 0; });
    });
    var list = used.length ? used : guides();
    var seen = {};
    return list.map(function (g) { return g.title; }).filter(function (t) { if (seen[t]) return false; seen[t] = 1; return true; }).join(' / ');
  }

  var MISS_LABEL = {
    reviewDate: '검토일', openDate: '오픈 예정일', tenant: '테넌트명', storeType: '매장형태', location: '공사위치', periodStart: '공사 시작일', periodEnd: '공사 종료일',
    contractorCompany: '시공업체 업체명', contractorName: '시공업체 담당자', contractorTel: '시공업체 연락처',

  /* ───────── 서명 안내 영상 (1.8.5, DW-4) ─────────
   * PC(마우스 있고 가로 1024px 이상)에서만 서명칸 위에 반복 영상을 덮어 보여주고,
   * 서명칸을 누르는 순간 영상이 사라지며 누른 자리부터 획이 시작됩니다. 「지우기/다시 쓰기」 때 다시 나옵니다.
   * 영상 파일이 없거나 못 읽으면 영상 없이 서명칸만 (mp4 → 안 되면 gif → 안 되면 없음). */
  function guideIsPc() {
    try { return !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine) and (min-width:1024px)').matches); } catch (x) { return false; }
  }
  function guideAttach(host, guide) {
    var api = { show: function () {}, hide: function () {} };
    if (!host || !guide || !guide.mp4 || !guideIsPc()) return api;
    var gv = document.createElement('div'); gv.className = 'gv'; gv.setAttribute('aria-hidden', 'true');
    var v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('loop', ''); v.setAttribute('autoplay', ''); v.setAttribute('playsinline', '');
    var swapped = false;
    function gone() { if (gv.parentNode) gv.parentNode.removeChild(gv); api.show = api.hide = function () {}; }
    function toGif() {
      if (swapped) { gone(); return; }
      swapped = true;
      if (!guide.gif) { gone(); return; }
      var im = new Image(); im.alt = ''; im.onerror = gone;
      im.src = guide.gif;
      if (v.parentNode) v.parentNode.replaceChild(im, v);
    }
    v.addEventListener('error', toGif);
    v.src = guide.mp4;
    gv.appendChild(v);
    host.appendChild(gv);
    api.hide = function () { gv.style.display = 'none'; try { v.pause(); } catch (x) { /* noop */ } };
    api.show = function () { gv.style.display = ''; try { v.currentTime = 0; var p = v.play(); if (p && p.catch) p.catch(function () { /* noop */ }); } catch (x) { /* noop */ } };
    var p0 = v.play && v.play(); if (p0 && p0.catch) p0.catch(function () { /* 자동 재생이 막히면 첫 장면만 보임 */ });
    return api;
  }

      '<button type="button" class="btn" style="flex:1;min-height:54px" id="sigCancel">취소</button>' +

    var c = $('#sigc'), ctx = c.getContext('2d');
    var gd = guideAttach($('.sigpad', layer), S.boot && S.boot.guide);
    var pen = sigPen(c, ctx, gd);
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    function size() {
      var r = c.getBoundingClientRect();
      c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#18202B'; ctx.lineWidth = 3;

      closeModal(); refreshSig(key, who); markDirty(); updateProgress();

    };
    $('#sigOk').onclick = function () {
      if (!pen.drawn) { toast('서명을 그려 주세요.', true); return; }
      var url = exportSig(c, 480, 160);
      if (url.length > 44000) url = exportSig(c, 360, 120);

      saveSigNow(who + ' 서명을 저장했습니다');

  function exportSig(src, w, h) {
    var out = document.createElement('canvas');
    out.width = w; out.height = h;
    var k = Math.min(w / src.width, h / src.height), dw = src.width * k, dh = src.height * k;
    out.getContext('2d').drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);

  /* 서명 입력 (DW-5): 누른 채 끌기(손가락·펜·마우스)는 그대로.
   * PC 마우스·터치패드는 한 번 클릭(안내 영상 위 클릭 포함)하면 커서를 따라 그리고, 다시 클릭하면 펜을 듦.
   * 서명칸 밖으로 나가도 펜을 듦. */
  function sigPen(c, ctx, gd) {
    var st = { drawn: false }, down = false, hover = false, last = null, start = null;
    function pt(e) { var r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function line(p, ev) {
      if (!last) { last = p; return; }
      ctx.lineWidth = ev.pointerType === 'pen' && ev.pressure ? 1.5 + ev.pressure * 3 : 3;
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; st.drawn = true;
    }
    c.addEventListener('pointerdown', function (e) {
      e.preventDefault(); gd.hide();
      if (hover) { hover = false; c.classList.remove('pen-on'); return; } // 따라 그리는 중 클릭 = 펜 들기
      down = true; last = start = pt(e);
      try { c.setPointerCapture(e.pointerId); } catch (x) { /* noop */ }
      ctx.beginPath(); ctx.arc(last.x, last.y, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#18202B'; ctx.fill(); st.drawn = true;
    });
    c.addEventListener('pointermove', function (e) {
      if (!down && !hover) return;
      e.preventDefault();
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      if (!evs.length) evs = [e];
      evs.forEach(function (ev) { line(pt(ev), ev); });
    });
    c.addEventListener('pointerup', function (e) {
      if (!down) return;
      down = false;
      var p = pt(e);
      // 마우스로 제자리 클릭(5px 안) = 커서 따라 그리기 시작
      if (e.pointerType === 'mouse' && Math.abs(p.x - start.x) < 5 && Math.abs(p.y - start.y) < 5) { hover = true; last = p; c.classList.add('pen-on'); }
    });
    ['pointercancel', 'pointerleave'].forEach(function (t) { c.addEventListener(t, function () { down = hover = false; c.classList.remove('pen-on'); }); });
    st.reset = function () { st.drawn = down = hover = false; last = null; c.classList.remove('pen-on'); };
    return st;
  }

  function startGuideBuild(fileId, replaces) {

    var d = {

      focus: d.short ? null : '#gfShort',

    }).then(function (v) { if (v === 'go' && vals) runGuideBuild(f, vals); });

  function buildUi(step, done, total, note) {

    var box = $('#gbProg');
    if (!box) return;
    $('#gbStep').textContent = step;
    $('#gbBar').style.width = pct + '%';
    $('#gbNum').textContent = total ? done + ' / ' + total + (note || '') : (note || '');

  function runGuideBuild(f, info) {
    var G = { stop: false }, wake = null;
    S.gbuild = G;
    layer.innerHTML = '<div class="overlay no-print"><div class="dialog" id="gbProg" role="dialog" aria-modal="true" aria-label="색인 만들기" style="max-width:480px">' +
      '<h3>' + esc(info.short) + ' 색인 만들기</h3><div class="small muted" style="margin-top:4px">' + esc(f.name) + '</div>' +
      '<div class="gbstep" id="gbStep">준비 중…</div><div class="gbtrack"><div class="gbbar" id="gbBar"></div></div>' +
      '<div class="small muted" id="gbNum" style="margin-top:6px;min-height:18px"></div>' +
      '<div class="small" style="margin-top:14px;line-height:1.6;color:var(--sub)">이 화면을 닫거나 다른 앱으로 넘어가지 마세요. 끊겨도 저장된 쪽은 남아 있어 <b>이어서 만들기</b>로 계속할 수 있습니다.</div>' +
      '<div class="acts"><button type="button" class="btn" id="gbStop">중단</button></div></div></div>';
    $('#gbStop').onclick = function () { G.stop = true; this.disabled = true; this.textContent = '멈추는 중…'; };
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {}); } catch (e) { /* 화면 켜짐 유지 미지원 */ }
    var check = function () { if (G.stop) throw new Error('중단했습니다. 지침 관리에서 이어서 만들 수 있습니다.'); };
    var begin, bytes, doc, n, landscape = false, entries = [], st = { sec: '' }, have = {};
    var pending = Promise.resolve(), batch = [], batchLen = 0, saved = 0, toSave = 0;
    function sendBatch() {
      if (!batch.length) return pending;
      var items = batch; batch = []; batchLen = 0;
      pending = pending.then(function () {
        check();
        return api('apiGuideSavePages', S.auth, begin.id, items).catch(function () {
          return api('apiGuideSavePages', S.auth, begin.id, items); // 한 번 더
        });
      }).then(function () { saved += items.length; });
      return pending;
    }
    function download() {
      var parts = [], got = 0;
      function next(offset) {
        check();
        return api('apiGuidePdfChunk', S.auth, f.fileId, offset).then(function (c) {
          var bin = atob(c.data), arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          parts.push(arr); got += arr.length;
          buildUi('1/3 · PDF 내려받는 중', got, c.size, ' 바이트');
          $('#gbNum').textContent = mb(got) + ' / ' + mb(c.size);
          if (got < c.size && arr.length) return next(got);
          var all = new Uint8Array(got), o = 0;
          parts.forEach(function (p) { all.set(p, o); o += p.length; });
          return all;
        });
      }
      return next(0);
    }
    function doPage(p) {
      check();
      return doc.getPage(p).then(function (page) {
        var vp1 = page.getViewport({ scale: 1 });
        if (p === 1) landscape = vp1.width > vp1.height;
        return page.getTextContent().then(function (tc) {
          var lines = GuideIndexer.pageLines(tc.items, vp1, window.pdfjsLib.Util.transform);
          entries = entries.concat(GuideIndexer.pageEntries(p, lines, st, info.localPages));
          if (have[p]) return;
          var target = vp1.width > vp1.height ? 1400 : 1000, vp = page.getViewport({ scale: target / vp1.width });
          var cv = document.createElement('canvas');
          cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
          var cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
          return page.render({ canvasContext: cx, viewport: vp }).promise.then(function () {
            var data = cv.toDataURL('image/jpeg', 0.78);
            cv.width = cv.height = 0;
            batch.push({ p: p, data: data }); batchLen += data.length;
            if (batch.length >= 4 || batchLen > 1500000) {
              var wait = pending; // 저장은 한 번에 하나씩, 그동안 다음 쪽을 읽음
              return wait.then(sendBatch);
            }
          });
        }).then(function () { page.cleanup(); });
      }).then(function () {
        buildUi('2/3 · 쪽 읽기 · 쪽 이미지 저장', p, n, '쪽' + (toSave ? ' · 저장 ' + saved + ' / ' + toSave : ''));
      });
    }
    buildUi('준비 중…', 0, 0, '');
    api('apiGuideBegin', S.auth, info).then(function (r) {
      begin = r;
      (r.have || []).forEach(function (p) { have[p] = true; });
      return download();
    }).then(function (all) {
      bytes = all;
      buildUi('PDF 읽기 도구 준비 중…', 0, 0, '');
      return loadPdfJs();
    }).then(function (pdfjs) {
      return pdfjs.getDocument({ data: bytes, cMapUrl: PDFJS_BASE + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS_BASE + 'standard_fonts/', isEvalSupported: false }).promise;
    }).then(function (d) {
      doc = d; n = d.numPages;
      for (var i = 1; i <= n; i++) if (!have[i]) toSave++;
      var chain = Promise.resolve();
      for (var p = 1; p <= n; p++) chain = chain.then(doPage.bind(null, p));
      return chain;
    }).then(function () {
      return sendBatch();
    }).then(function () {
      check();
      var list = GuideIndexer.finish(entries, { id: begin.id, short: info.short });
      buildUi('3/3 · 검색 색인 저장 중', 0, 0, list.length + '개 항목');
      if (!list.length) throw new Error('PDF에서 글자를 찾지 못했습니다. 스캔(사진) PDF는 검색할 수 없습니다.');
      return api('apiGuideFinish', S.auth, begin.id, { pages: n, landscape: landscape }, list).then(function (stt) { return { st: stt, count: list.length }; });
    }).then(function (res) {
      setGuideState(res.st);
      closeModal(); S.gbuild = null;
      if (S.view === 'gadmin') renderGuideAdmin();
      toast(info.short + ' · ' + n + '쪽 · 검색 항목 ' + res.count + '개 색인을 만들었습니다');
    }).catch(function (e) {
      S.gbuild = null;
      var msg = errMsg(e);
      layer.innerHTML = '<div class="overlay no-print"><div class="dialog" role="alertdialog" aria-modal="true" aria-label="색인 만들기 멈춤">' +
        '<h3>색인 만들기가 멈췄습니다</h3><div class="small" style="margin-top:10px;line-height:1.6">' + esc(msg) + '</div>' +
        (begin ? '<div class="small muted" style="margin-top:8px">저장된 쪽 이미지는 남아 있습니다. 지침 관리에서 <b>이어서 만들기</b>를 누르면 나머지만 만듭니다.</div>' : '') +
        '<div class="acts"><button type="button" class="btn pri main-act" id="gbClose">확인</button></div></div></div>';
      $('#gbClose').onclick = function () { closeModal(); openGuideAdmin(); };
    }).then(function () {
      if (wake) try { wake.release(); } catch (e) { /* 무시 */ }
      bytes = null; if (doc) try { doc.destroy(); } catch (e) { /* 무시 */ }
    });
  }

  /* ───────── 특이사항: 출력과 같은 모양의 편집칸 + 사진 ─────────
     편집칸은 출력물 특이사항 칸과 같은 폭·줄 간격(글자 16px 기준)으로 그리고, 출력은 11/16 로 줄여 찍습니다.
     → 줄바꿈이 화면·출력물에서 똑같아 사진 위치도 어느 기기에서나 같습니다.
     사진 위치 = 붙어 있는 글자 위치(a) 의 줄 기준점 + (x, y). 글이 별지로 넘어가면 사진도 함께 넘어갑니다. */
  var NOTE = { W: 692, LH: 19, F: 16 / 11 };      // 출력 2쪽 특이사항 칸 글 폭·줄 간격(px), 편집칸 배율
  var NW = NOTE.W * NOTE.F, NLH = NOTE.LH * NOTE.F; // 편집칸 폭 1006.5px, 줄 간격 27.6px
  var PHOTO_MAX = 10;

  function photos() { try { var v = JSON.parse(S.review.notesPhotos || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function setPhotos(list, quiet) {
    S.review.notesPhotos = list.length ? JSON.stringify(list) : '';
    if (!quiet) { markDirty(); updateProgress(); }
  }
  function newPid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /** 글을 문단으로 나눔. o = 글 전체에서 문단이 시작하는 위치 */
  function notesParas(notes) {
    var out = [], o = 0;
    String(notes || '').replace(/\r/g, '').split('\n').forEach(function (t) { out.push({ t: t, o: o }); o += t.length + 1; });
    return out;
  }
  function paraEl(it) {
    var p = document.createElement('p');
    p.setAttribute('data-o', it.o); p.setAttribute('data-n', it.t.length);
    p.textContent = it.t === '' ? ' ' : it.t;
    return p;
  }
  /** 문단 p 안의 글자 위치 a 의 기준점 (그 글자가 있는 줄의 위쪽, 글자 바로 뒤). 칸(box) 기준 좌표 */
  function paraPoint(box, p, a) {

  /** 새 사진 위치: 마지막으로 쓴 문장 끝. 오른쪽에 자리가 없으면 다음 줄 처음 */

    var x = 8, y = 0;
    if (base.x + 8 + w > NW) { x = -base.x; y = a ? NLH : 0; }
    if (base.x + x + step + w > NW) step = 0;
    return { a: a, x: x + step, y: y + step };
  }
  function attachFiles(files) {
    files = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp|gif)$/i.test(f.name || ''); });
    if (!files.length || isLocked()) return;
    var room = PHOTO_MAX - photos().length - (S.phTemp || []).length;
    if (room <= 0) { toast('사진은 한 차수에 ' + PHOTO_MAX + '장까지 붙일 수 있습니다.', true); return; }
    if (files.length > room) { toast(PHOTO_MAX + '장까지라서 ' + room + '장만 붙입니다.', true); files = files.slice(0, room); }
    var added = 0;
    ensureSavedForPhoto().then(function (ok) {

        return chain.then(function () {

            var w = Math.min(NW * 0.35, img.w), h = w * img.h / img.w;
            if (h > NLH * 12) { h = NLH * 12; w = h * img.w / img.h; }
            var pos = placeNew(w, h);
            var tmp = { id: newPid(), f: '', tmp: img.url, a: pos.a, x: pos.x, y: pos.y, w: Math.round(w), h: Math.round(h), r: 0 };
            S.phTemp = (S.phTemp || []).concat([tmp]);
            notesLayout(true);
            return api('apiUploadPhoto', S.auth, S.store.id, S.round, img.url).then(function (res) {
              S.phTemp = S.phTemp.filter(function (x) { return x !== tmp; });
              S.phImg = S.phImg || {}; S.phImg[res.fileId] = img.url;
              var ph = { id: tmp.id, f: res.fileId, a: tmp.a, x: tmp.x, y: tmp.y, w: tmp.w, h: tmp.h, r: 0 };
              setPhotos(photos().concat([ph]));
              S.phSel = ph.id; added++;
              notesLayout();
            }, function (e) {

              notesLayout(true);
              toast((isNetErr(e) ? '인터넷 연결이 불안정해 사진을 올리지 못했습니다. 연결된 뒤 다시 붙여 주세요.' : '사진 올리기 실패: ' + errMsg(e)), true);

    });
  }

  /* ── 사진 옮기기 · 크기 · 돌리기 · 삭제 (마우스·손가락·펜) ── */
  function photoById(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function onPhotoPointer(e) {
    var el = e.target.closest('.nph'); var paper = $('#npaper');
    if (!paper) return;
    if (!el) { if (S.phSel) { S.phSel = null; renderPhotos(); } return; }
    if (isLocked() || el.classList.contains('up')) return;
    var id = el.dataset.pid, hnd = e.target.closest('[data-ph-h]'), act = hnd ? hnd.dataset.phH : 'move';
    var list = photos(), ph = photoById(list, id); if (!ph) return;
    if (S.phSel !== id) { S.phSel = id; renderPhotos(); el = $('.nph[data-pid="' + id + '"]'); if (act !== 'move') return; }
    if (act === 'del' || act === 'rl' || act === 'rr') return; // click 으로 처리
    e.preventDefault();
    var s = noteScale(), sx = e.clientX, sy = e.clientY, start = { x: ph.x, y: ph.y, w: ph.w, h: ph.h };
    var rc0 = photoRect($('#nmirror'), ph), baseX = rc0.left - ph.x, baseY = rc0.top - ph.y, ratio = ph.h / ph.w;
    var moved = false;
    try { el.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
    function move(ev) {
      var dx = (ev.clientX - sx) / s, dy = (ev.clientY - sy) / s;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      if (act === 'rs') {
        var turned = ph.r % 180 !== 0, b0 = turned ? start.h : start.w, nb = Math.max(40, Math.min(NW, b0 + dx));
        var k = nb / b0; ph.w = Math.round(start.w * k); ph.h = Math.round(start.w * k * ratio);
        var bb = photoBox(ph);
        if (baseX + ph.x + bb.bw > NW) { var kk = (NW - baseX - ph.x) / bb.bw; ph.w = Math.round(ph.w * kk); ph.h = Math.round(ph.w * ratio); }
      } else {
        var b = photoBox(ph);
        ph.x = Math.round(Math.max(-baseX, Math.min(NW - b.bw - baseX, start.x + dx)));
        ph.y = Math.round(Math.max(-baseY, start.y + dy));
      }
      var rc = { left: baseX + ph.x, top: baseY + ph.y }, bx = photoBox(ph);
      el.style.left = rc.left + 'px'; el.style.top = rc.top + 'px'; el.style.width = bx.bw + 'px'; el.style.height = bx.bh + 'px';
      var im = $('img', el); if (im) { im.style.width = ph.w + 'px'; im.style.height = ph.h + 'px'; }
    }
    function up() {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);

    }
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  function onPhotoClick(e) {
    var hnd = e.target.closest('[data-ph-h]'); if (!hnd) return;
    var el = hnd.closest('.nph'), id = el && el.dataset.pid, list = photos(), ph = photoById(list, id);
    if (!ph) return;
    var act = hnd.dataset.phH;
    if (act === 'del') {
      setPhotos(list.filter(function (x) { return x.id !== id; }));
      S.phSel = null; notesLayout(); toast('사진을 뺐습니다');
    } else if (act === 'rl' || act === 'rr') {
      ph.r = (ph.r + (act === 'rr' ? 90 : 270)) % 360;
      var b = photoBox(ph), rc = photoRect($('#nmirror'), ph);
      if (rc.left + b.bw > NW) ph.x -= rc.left + b.bw - NW;
      setPhotos(list); notesLayout();
    }
  }
  function onPhotoKey(e) {
    var el = e.target.closest && e.target.closest('.nph'); if (!el || isLocked()) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); S.phSel = el.dataset.pid; var d = document.createElement('span'); d.dataset.phH = 'del'; el.appendChild(d); onPhotoClick({ target: d }); }
  }
  function bindNotesEditor() {
    var paper = $('#npaper'); if (!paper) return;
    paper.addEventListener('pointerdown', onPhotoPointer);
    paper.addEventListener('click', onPhotoClick);
    paper.addEventListener('keydown', onPhotoKey);
    var ta = $('#notes');
    if (ta && !isLocked()) {
      ta.addEventListener('paste', function (e) {
        var items = (e.clipboardData && e.clipboardData.files) || [];
        var imgs = Array.prototype.filter.call(items, function (f) { return /^image\//.test(f.type); });
        if (imgs.length) { e.preventDefault(); attachFiles(imgs); }
      });
      paper.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); paper.classList.add('drop'); } });
      paper.addEventListener('dragleave', function () { paper.classList.remove('drop'); });
      paper.addEventListener('drop', function (e) { paper.classList.remove('drop'); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); attachFiles(e.dataTransfer.files); } });
    }
    ['#phFile', '#phCam'].forEach(function (sel) { var i = $(sel); if (i) i.addEventListener('change', function () { attachFiles(i.files); }); });
    var zoom = $('.nzoom');
    if (zoom) zoom.addEventListener('click', function (e) {
      var b = e.target.closest('[data-nz]'); if (!b) return;
      var cur = noteScale(), v = b.dataset.nz;
      S.nzoom = v === 'fit' ? null : Math.max(0.4, Math.min(2, Math.round((cur + (v === '+' ? 0.15 : -0.15)) * 100) / 100));
      try { localStorage.setItem('dr_nzoom', S.nzoom ? String(S.nzoom) : ''); } catch (x) { /* 무시 */ }
      notesLayout(true);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (S.view === 'edit') notesLayout(); });
    notesLayout();
  }

  /* ───────── 지침 검색 (여러 지침 · 쪽 미리보기) ───────── */
  function ensureGuide() {
    if (S.guide) return Promise.resolve(S.guide);
    return api('apiGuideIndex', S.auth).then(function (g) { S.guide = g; return g; });
  }
  function allGuides() { return S.boot.guides || []; }
  /** 검색에 쓰는 현행 지침 (이전 판 제외) */
  function guides() { return allGuides().filter(function (g) { return !g.archived; }); }
  function guideById(id) { return allGuides().filter(function (g) { return g.id === id; })[0] || { id: id, short: '지침', title: '지침', pages: 0 }; }
  function guideNo(id) { var i = allGuides().map(function (g) { return g.id; }).indexOf(id); return i < 0 ? 0 : i % 4; }
  function srcTag(id) {
    var g = guideById(id);
    return '<span class="srctag s' + guideNo(id) + '">' + esc(g.short) + '</span>' + (g.archived ? '<span class="srctag old">이전 판' + (g.archivedAt ? ' · ' + esc(g.archivedAt.slice(0, 10)) + ' 까지' : '') + '</span>' : '');
  }

  /** 삽입 문구: (설비공사 지침 6/10, p.30) / (통합안전관리지침 방화및방염관련, p.12) */
  function refText(e) {
    var g = guideById(e.d);
    if (e.lp) return '(' + (e.s || g.short) + ' ' + e.lp + ', p.' + e.p + ')';
    return '(' + g.short + (e.s && e.s !== g.short ? ' ' + e.s : '') + ', p.' + e.p + ')';
  }
  function whereText(e) {
    var g = guideById(e.d);
    return (e.lp ? (e.s || g.short) + ' ' + e.lp : (e.s && e.s !== g.short ? e.s : '')) + (e.h ? ' · ' + e.h : '');
  }

  function compactFind(t, cq) {
    var map = [], s = '';
    for (var i = 0; i < t.length; i++) { if (!/\s/.test(t[i])) { s += t[i].toLowerCase(); map.push(i); } }
    var k = s.indexOf(cq);
    if (k < 0) return null;
    return [map[k], map[k + cq.length - 1] + 1];
  }

  function cmp(w) { return String(w).toLowerCase().replace(/\s+/g, ''); }
  /** 검색어 + 시트 "비슷한말"에서 같은 줄에 있는 말 */
  function synTerms(q) {
    var out = [q], seen = [cmp(q)];
    (S.boot.synonyms || []).forEach(function (g) {
      if (!g.some(function (w) { return cmp(w) === seen[0]; })) return;
      g.forEach(function (w) { if (seen.indexOf(cmp(w)) < 0) { seen.push(cmp(w)); out.push(w); } });
    });
    return out;
  }
  function findIn(t, term) {
    var lq = term.toLowerCase(), at = t.toLowerCase().indexOf(lq);
    if (at >= 0) return [at, term.length];
    var m = compactFind(t, cmp(term));
    return m ? [m[0], m[1] - m[0]] : null;
  }
  function searchGuide(q) {
    q = String(q || '').trim();
    var counts = { all: 0 };
    allGuides().forEach(function (g) { counts[g.id] = 0; });
    S.gp.terms = q ? synTerms(q) : [];
    if (!q || !S.guide) return { hits: [], counts: counts };
    var terms = S.gp.terms, out = [], skip = {};
    allGuides().forEach(function (g) { if (g.archived && !S.gp.old) skip[g.id] = true; });
    for (var i = 0; i < S.guide.length; i++) {
      var e = S.guide[i], t = e.t, at = -1, len = 0;
      if (skip[e.d]) continue;
      for (var k = 0; k < terms.length && at < 0; k++) { var f = findIn(t, terms[k]); if (f) { at = f[0]; len = f[1]; } }
      if (at < 0) {
        var meta = cmp((e.h || '') + ' ' + (e.l || ''));
        if (!terms.some(function (w) { return meta.indexOf(cmp(w)) >= 0; })) continue;
      }
      counts.all++; counts[e.d] = (counts[e.d] || 0) + 1;
      if ((S.gp.filter === 'all' || S.gp.filter === e.d) && out.length < 80) out.push({ e: e, at: at, len: len });
    }

  }

  function snippet(hit) {

    var s = Math.max(0, hit.at - 60), en = Math.min(t.length, hit.at + hit.len + 90);
    return (s > 0 ? '…' : '') + esc(t.slice(s, hit.at)) + '<span class="mk">' + esc(t.slice(hit.at, hit.at + hit.len)) + '</span>' + esc(t.slice(hit.at + hit.len, en)) + (en < t.length ? '…' : '');
  }

  function openGuide(opts) {

    var panel = $('#gpanel');
    if (!panel) {

        // 팝업 전체가 함께 스크롤되고, 검색창과 ✕만 위에 고정 (1.8.1)
        '<div class="gp-title"><div style="font-size:16px;font-weight:600">지침 검색</div><div class="small muted">' + guides().map(function (g) { return esc(g.title); }).join(' · ') + '</div></div>' +

        '<div class="small muted" style="margin-top:10px">결과에 마우스를 올리면 해당 쪽이 보입니다. 태블릿은 <b>쪽 번호</b>를 누르세요.</div></div></div>' +
        '<div class="gp-body" id="gres"><div class="muted small">' + (guides().length ? '색인을 불러오는 중…' : '검색할 지침이 아직 없습니다. 대시보드의 <b>지침 관리</b>에서 드라이브 지침 폴더의 PDF로 <b>색인 만들기</b>를 해주세요.') + '</div></div>';

      });

        var c = e.target.closest('[data-gchip]');

  }

  /** 결과가 있으면 자주 찾는 키워드·안내를 한 줄로 접음 (누르면 펼침) */

    t.hidden = !S.gp.kwHas;
    k.hidden = fold;
    t.setAttribute('aria-expanded', String(!fold));
    t.textContent = fold ? '자주 찾는 키워드 ▾' : '키워드 접기 ▴';
  }

  function renderGuideResults() {
    var box = $('#gres'); if (!box || !S.guide) return;
    var r = searchGuide(S.gp.q), hits = S.gp.results = r.hits;
    var fl = $('#gfilter');
    if (fl) {
      var hasOld = allGuides().some(function (g) { return g.archived; });
      fl.innerHTML = [{ id: 'all', short: '전체' }].concat(S.gp.old ? allGuides() : guides()).map(function (g) {
        var on = S.gp.filter === g.id;
        return '<button type="button" role="tab" aria-selected="' + on + '" class="' + (on ? 'on' : '') + '" data-gfilter="' + g.id + '">' + esc(g.short) + (g.archived ? ' (이전 판)' : '') + ' <span>' + (r.counts[g.id] || 0) + '</span></button>';
      }).join('') +
        (hasOld ? '<button type="button" class="goldt' + (S.gp.old ? ' on' : '') + '" data-gold aria-pressed="' + !!S.gp.old + '">' + (S.gp.old ? '✓ ' : '') + '이전 판 포함</button>' : '');
    }

    var gpn = $('#gpanel'), gst = $('.gp-sticky'), gbx = box;
    if (gpn && gst && gpn.scrollTop > 0) { var top = gbx.offsetTop - gst.offsetHeight; if (gpn.scrollTop > top) gpn.scrollTop = Math.max(0, top); }
    if (!S.gp.q.trim()) { box.innerHTML = '<div class="muted small" style="padding:8px 0">검색어를 입력하거나 위의 자주 찾는 키워드를 누르세요.</div>'; return; }

      ((S.gp.terms || []).length > 1 ? '<div class="synline">비슷한 말도 찾음: ' + S.gp.terms.slice(1).map(esc).join(', ') + '</div>' : '') + '</div>' +
      hits.map(function (h, i) {
        var where = whereText(h.e);
        return '<div class="hit" data-hit="' + i + '"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="pg pgbtn" data-gprev="' + i + '" aria-label="' + h.e.p + '쪽 미리보기">' + ICON.search.replace('width="16" height="16"', 'width="13" height="13"') + 'p.' + h.e.p + '</button>' +
          srcTag(h.e.d) + '</div>' +
          (where ? '<div class="small" style="margin-top:6px;color:var(--sub)">' + esc(where) + '</div>' : '') +
          '<div style="font-size:14px;line-height:1.7;margin-top:4px">' + snippet(h) + '</div>' +
          '<button type="button" class="btn pri sm" style="margin-top:10px;width:100%" data-gins="' + i + '">' + esc(refText(h.e)) + ' 삽입</button></div>';
      }).join('');
  }

  /* ── 쪽 미리보기 ── */
  function canHover() { return window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches; }
  function wideEnough() { return window.innerWidth >= 1080; }
  function pageImage(d, p) {
    var key = d + ':' + p;

  function fits(box) { return box.scrollHeight <= box.clientHeight + 1; }

  /** 이 문단(조각)에 붙은 사진을 칸에 놓음 */
  function placeParaPhotos(box, it, p, ctx) {
    var out = [], end = it.end != null ? it.end : it.o + it.t.length;
    ctx.list.forEach(function (ph) {
      if (ctx.done[ph.id] || ph.a < it.o || ph.a > end) return;
      var rc = photoRect(box, ph, p), src = photoSrc(ph.f);
      var d = document.createElement('div');
      d.className = 'pph';
      d.style.cssText = 'left:' + rc.left + 'px;top:' + rc.top + 'px;width:' + rc.bw + 'px;height:' + rc.bh + 'px';
      if (src) d.innerHTML = '<img alt="" src="' + esc(src) + '" style="width:' + ph.w + 'px;height:' + ph.h + 'px;transform:translate(-50%,-50%) rotate(' + ph.r + 'deg)">';
      box.appendChild(d); ctx.done[ph.id] = true; out.push({ el: d, id: ph.id });
    });
    return out;
  }
  function unplace(arr, ctx) { arr.forEach(function (x) { x.el.remove(); delete ctx.done[x.id]; }); }

  /** 문단 단위로 채우고 남은 문단을 돌려줌. 사진은 붙은 문단과 함께 움직임.
      빈 칸에 한 문단이 다 안 들어가면 그 문단만 잘라서 넣음 */
  function fill(box, queue, ctx) {
    while (queue.length) {
      var it = queue[0], p = paraEl(it);
      box.appendChild(p);
      var phs = placeParaPhotos(box, it, p, ctx);
      if (fits(box)) { queue.shift(); continue; }
      var alone = box.querySelectorAll('p').length === 1;
      unplace(phs, ctx);
      if (!alone) { box.removeChild(p); break; } // 다음 쪽으로 문단째(사진 포함) 넘김
      if (fits(box)) { placeParaPhotos(box, it, p, ctx); queue.shift(); continue; } // 글은 들어가고 사진만 큼 → 같이 넣음
      box.removeChild(p);
      var text = it.t, lo = 0, hi = text.length, tp = paraEl({ t: '', o: it.o });
      box.appendChild(tp);
      while (lo < hi) {
        var mid = Math.ceil((lo + hi) / 2);
        tp.textContent = text.slice(0, mid);
        if (fits(box)) lo = mid; else hi = mid - 1;
      }
      box.removeChild(tp);
      if (lo === 0) break;
      var cut = lo, sp = text.lastIndexOf(' ', lo);
      if (sp > lo * 0.6) cut = sp;
      var rest = text.slice(cut), k = rest.length - rest.replace(/^\s+/, '').length;
      var first = { t: text.slice(0, cut), o: it.o, end: it.o + cut + k }, fp = paraEl(first);
      box.appendChild(fp);
      placeParaPhotos(box, first, fp, ctx);
      queue[0] = { t: rest.slice(k), o: it.o + cut + k };
      break;
    }
    return queue;
  }

  /** 출력 쪽 만들기 (화면 출력용 #pages, 또는 편집칸 별지 경계 계산용 숨은 칸) */
  function buildPages(host, notesOnly) {
    host.innerHTML = '<div class="page-holder">' + page1Html() + '</div>';
    var page1 = $('.page', host);
    fitPage(page1);
    var notes = String(S.review.notes || '').replace(/\r/g, '');
    var len = notes.length;
    var ctx = { list: photos().map(function (ph) { return Object.assign({}, ph, { a: Math.max(0, Math.min(len, ph.a)) }); }), done: {} };
    var queue = notes ? notesParas(notes) : [{ t: '', o: 0 }];
    var boxes = [null]; // 1쪽에는 특이사항 칸 없음, 2쪽부터
    var n = 1;
    while ((queue.length || n === 1) && n < 30) {
      n++;
      var holder = document.createElement('div');
      holder.className = 'page-holder';
      holder.innerHTML = contPageHtml(n);
      host.appendChild(holder);
      var ob = $('.nbox', holder), inb = $('.nin', ob), ocs = getComputedStyle(ob);
      inb.style.height = ((ob.clientHeight - parseFloat(ocs.paddingTop) - parseFloat(ocs.paddingBottom)) * NOTE.F) + 'px';
      boxes.push(inb);
      var before = queue.length + '|' + (queue[0] ? queue[0].o + ':' + queue[0].t.length : '');
      fill(inb, queue, ctx);
      if (queue.length + '|' + (queue[0] ? queue[0].o + ':' + queue[0].t.length : '') === before) break; // 안전장치
    }
    if (!notesOnly) { // 안전관리규정 준수 동의서는 늘 맨 끝 쪽 (DW-6)
      var ah = document.createElement('div');
      ah.className = 'page-holder';
      ah.innerHTML = agreePageHtml();
      host.appendChild(ah);
      fitAgreePage($('.page', ah));
    }
    return { pages: $$('.page', host), boxes: boxes };
  }

  /** 1쪽이 A4 높이를 넘으면(기기 글꼴·글자 크기 설정 등) 내용을 줄여 서명란까지 한 쪽에 맞춤 */
  function fitPage(page) {
    var body = $('.pbody', page), foot = $('.pfoot', page);
    if (!body) return 1;
    body.style.transform = ''; body.style.width = ''; body.style.marginBottom = '';
    var cs = getComputedStyle(page);
    var avail = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (foot ? foot.offsetHeight + 6 : 0);
    var need = body.scrollHeight;
    if (need <= avail + 0.5) { page.removeAttribute('data-fit'); return 1; }
    var k = Math.max(0.6, avail / need);
    body.style.transformOrigin = '0 0';
    body.style.transform = 'scale(' + k + ')';
    body.style.width = (100 / k) + '%';
    body.style.marginBottom = (need * k - need) + 'px';
    page.setAttribute('data-fit', String(Math.round(k * 1000) / 1000));
    return k;
  }

  function layoutPages() {
    var host = $('#pages'); if (!host) return;
    var pages = buildPages(host).pages;
    pages.forEach(function (p, i) { $('.pnum', p).textContent = '출력 ' + nowFull() + ' · ' + (i + 1) + ' / ' + pages.length; });

  function scalePages() {
    var avail = Math.min(window.innerWidth, document.documentElement.clientWidth) - 32;

      h.style.width = Math.floor(794 * k) + 'px';
      h.style.height = Math.floor(1123 * k) + 'px';
      var p = $('.page', h);
      p.style.transform = k < 1 ? 'scale(' + k + ')' : '';
      p.style.transformOrigin = 'top left';

  /** 아이패드(사파리·크롬): iPadOS 13부터는 사파리가 Mac처럼 보이므로 터치 지점 수로 구분 */

    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  function savePdf(toDrive) {
    if (!window.html2pdf) {
      toast('PDF 도구를 불러오는 중…');
      loadPrintLibs().then(function () {
        if (window.html2pdf) savePdf(toDrive);
        else toast('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 A4 인쇄에서 "PDF로 저장"을 이용해 주세요.', true);
      });
      return;
    }
    if (toDrive && !S.store) { toast('먼저 검토서를 저장해 주세요.', true); return; }
    // 화면 밖 위치는 바깥 틀에만 주고, 캡처 대상(box)은 일반 흐름으로 둠
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1';
    var box = document.createElement('div');
    box.style.cssText = 'width:794px;background:#fff';
    $$('#pages .page').forEach(function (p) {
      var c = p.cloneNode(true);
      c.style.transform = 'none'; c.style.boxShadow = 'none';
      box.appendChild(c);
    });
    wrap.appendChild(box);
    document.body.appendChild(wrap);
    toast(toDrive ? 'PDF를 만들어 드라이브에 올리는 중…' : 'PDF를 만드는 중…');
    var keepY = window.scrollY;
    window.scrollTo(0, 0);
    var worker = html2pdf().set({
      margin: 0,
      filename: pdfName(),
      image: { type: 'jpeg', quality: 0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: 794 },
      jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] },
      pagebreak: { mode: ['legacy'] }
    }).from(box);
    var job = toDrive
      ? worker.outputPdf('datauristring').then(function (uri) {
        wrap.remove(); window.scrollTo(0, keepY);
        return api('apiSavePdf', S.auth, S.store.id, S.round, pdfName(), uri);
      }).then(function (r) {
        if (r && r.store) { S.stores = S.stores.map(function (x) { return x.id === r.store.id ? r.store : x; }); if (S.store && S.store.id === r.store.id) S.store = r.store; }
        dialog({
          title: S.boot.sb ? 'PDF를 저장했습니다' : '드라이브에 저장했습니다',
          body: '<div class="small" style="margin-top:10px;line-height:1.7"><b>' + esc(r.name) + '</b><br>' +
            (S.boot.sb ? '저장했습니다. 일주일 뒤 드라이브 ' + esc(r.folder) + ' 폴더에도 보관합니다. 같은 차수를 다시 저장하면 새 내용으로 바뀝니다.'
              : esc(r.folder) + ' 폴더에 저장했습니다. 같은 차수를 다시 저장하면 새 내용으로 바뀝니다.' + (isIOS() ? '<br>드라이브에서 열고 <b>공유(↑) → 프린트</b>로 A4 인쇄할 수 있습니다.' : '')) + '</div>' +
            '<a class="btn pri" style="width:100%;margin-top:16px;min-height:52px" href="' + esc(r.url) + '" target="_blank" rel="noopener"' + pvAttr({ name: r.name, meta: S.round + '차 검토서', f: r.fileId || '' }) + '>' + ICON.pdf + 'PDF 열기</a>',
          actions: [{ label: '닫기', value: null }]
        });
      })
      : worker.save().then(function () { toast('PDF를 저장했습니다'); });
    job.catch(function (e) {
      toast((toDrive ? '드라이브 저장 실패: ' : 'PDF 저장 실패: ') + errMsg(e) + (toDrive ? '' : ' — 드라이브에 저장 또는 A4 인쇄 → "PDF로 저장"을 이용해 주세요.'), true);
    }).then(function () { if (wrap.parentNode) wrap.remove(); window.scrollTo(0, keepY); });
  }

  function openFromDash(id, mode) {
    loading('불러오는 중…');
    return api('apiGetStore', S.auth, id).then(function (b) {
      applyBundle(b); S.dirty = false;
      if (mode === 'print') { S.view = 'printFromDash'; return openPrint(); }
      if (mode === 'next') { S.view = 'edit'; renderEditor(); return nextRound(); }
    }).catch(function (e) { toast(errMsg(e), true); openDashboard(); });
  }

  /* ───────── 이벤트 ───────── */
  app.addEventListener('submit', function (e) {
    if (e.target.id === 'deviceForm') {
      e.preventDefault();
      var em = $('#devE').value, pw = $('#devP').value;
      renderDevice(em, '', true);
      DW_API.register(em, pw).then(function () { renderLogin(); }, function (err) { renderDevice(em, errMsg(err)); });
      return;
    }
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    var pin = $('#pin').value;
    var btn = $('button[type="submit"]', e.target); btn.disabled = true; btn.textContent = '확인 중…';
    doLogin(null, pin).then(afterLogin).catch(function (err) { renderLogin(null, errMsg(err)); });
  });

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-choice]');
    if (!el || el.disabled) return;

    if (el.dataset.choice) {
      var key = el.dataset.choice, val = el.dataset.value, prevNa = naKeys().slice();
      S.review[key] = S.review[key] === val ? '' : val;
      $$('[data-choice="' + key + '"]').forEach(function (b) {
        var on = S.review[key] === b.dataset.value;
        b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
      });
      if (key === 'kitchen' || key === 'storeType') { applyKitchenRule(prevNa); markDirty(); renderEditor(true); return; }
      markDirty(); updateProgress();
      if (key === 'powerPhase') updateBreaker();
      if (/^doc/.test(key)) updateDocWarn();
      updateChanges();
      return;
    }

    var act = el.dataset.act;
    switch (act) {
      case 'loginrole':
        app.dataset.role = el.dataset.role;
        $$('[data-act="loginrole"]').forEach(function (b) {
          var on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
          $('.box', b).innerHTML = on ? ICON.checkW : '';
        });
        $('#pin').focus();
        break;
      case 'switchrole': switchRole(el.dataset.role); break;
      case 'logout': authKeep(null); S.auth = null; S.stores = []; renderLogin(); break;
      case 'devoff':
        dialog({ title: '이 기기의 등록을 풀까요?', body: '<div class="muted small" style="margin-top:6px;line-height:1.6">다시 쓰려면 시설팀 계정으로 기기 등록을 해야 합니다.</div>',
          actions: [{ label: '취소', value: false }, { label: '등록 풀기', cls: 'del main-act', value: true }] }).then(function (v) {
          if (!v) { renderLogin(); return; }
          authKeep(null); S.auth = null; S.stores = [];
          DW_API.unregister().then(function () { renderDevice(); }, function () { renderDevice(); });
        });
        break;
      case 'gpdfUp': $('#gpdfFile').click(); break;
      case 'gpdfDel':
        dialog({ title: '이 PDF를 지울까요?', body: '<div class="muted small" style="margin-top:6px;line-height:1.6">' + esc(el.dataset.name || '') + '<br>이미 만든 검색 색인은 그대로 남습니다.</div>',
          actions: [{ label: '취소', value: false }, { label: '지우기', cls: 'del main-act', value: true }] }).then(function (v) {
          if (!v) return;
          api('apiGuidePdfRemove', S.auth, el.dataset.file).then(function (st) { setGuideState(st); renderGuideAdmin(); toast('PDF를 지웠습니다'); }, function (er) { toast(errMsg(er), true); });
        });
        break;
      case 'refresh': openDashboard().then(function () { toast('최신 내용으로 불러왔습니다'); }); break;
      case 'tab': S.dash.tab = el.dataset.tab; renderDashBody(); break;
      case 'calnav': S.dash.cal = el.dataset.m; renderDashBody(); break;
      case 'year': toggleYear(el.dataset.y); break;
      case 'todo': S.dash.todo = S.dash.todo === el.dataset.k ? null : el.dataset.k; renderDashBody(); break;
      case 'vendor': openVendor(el.dataset.name); break;
      case 'docReq': openDocReq(); break;
      case 'sigReq': openSigReq(el.dataset.w); break;
      case 'fireSug':
        if (isLocked()) break;
        S.review.fireCheckDate = el.dataset.d;
        var fi = $('#f-fireCheckDate'); if (fi) fi.value = el.dataset.d;
        markDirty(); updateProgress(); updateInspect(); updateChanges();
        break;
      case 'specOpen': openSpecSend(); break;
      case 'fdAdd': openFdPick(); break;
      case 'fdView': openFdView(); break;
      case 'fdDel': deleteFireDoc(); break;
      case 'new': openEditor(null); break;
      case 'open': openEditor(el.dataset.id); break;
      case 'confirm': confirmStore(el.dataset.id); break;
      case 'printFromDash': openFromDash(el.dataset.id, 'print'); break;
      case 'nextFromDash': openFromDash(el.dataset.id, 'next'); break;
      case 'dash':
        if (S.view === 'edit') leaveEditor(openDashboard); else openDashboard();
        break;
      case 'jump':
        e.preventDefault();
        var t = document.getElementById(el.dataset.target);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      case 'round':
        var n = Number(el.dataset.round);
        if (n === S.round) break;
        leaveEditor(function () {
          var r = S.reviews.filter(function (x) { return Number(x.round) === n; })[0];
          S.review = Object.assign(blankReview(), r); S.round = n; S.dirty = false; renderEditor();
        });
        break;
      case 'next': nextRound(); break;
      case 'delround': deleteLastRound(); break;
      case 'delStore': deleteStore(el.dataset.id); break;
      case 'save': if (Date.now() - (S.tapAt || 0) > 800) save(false); break;
      case 'finalize': if (Date.now() - (S.tapAt || 0) > 800) save(true); break;
      case 'print': openPrint(false); break;
      case 'pdf': openPrint(true); break;
      case 'backEdit':
        if (S.view === 'printFromDash' || S.view === 'print') { S.view = 'edit'; renderEditor(); }
        break;
      case 'doPrint': window.print(); break;
      case 'savePdf': savePdf(); break;
      case 'drivePdf': savePdf(true); break;
      case 'brkpopup': openBreakerPopup(); break;
      case 'sig': openSig(el.dataset.key, el.dataset.who); break;
      case 'agree': openAgree(); break;
      case 'guide': openGuide({}); break;
      case 'gadmin': openGuideAdmin(); break;
      case 'gadminRefresh': openGuideAdmin(true); break;
      case 'gbuild': startGuideBuild(el.dataset.file, el.dataset.replaces || ''); break;
      case 'gremove': removeGuide(el.dataset.id); break;
      case 'grename': renameGuide(el.dataset.id); break;
      case 'gcancel': cancelGuideBuild(); break;
      case 'garchdel': removeArchivedGuide(el.dataset.id); break;
      case 'pendFlush': flushPending(true).then(function () { if (pendingCount()) toast('아직 연결이 안 됩니다. 연결되면 자동으로 다시 보냅니다', true); }); break;
      case 'pendDrop':
        dialog({ title: '임시 보관한 검토서를 버릴까요?', body: '<div class="small" style="margin-top:10px">구글시트에 저장되지 않은 이 기기의 내용이 지워집니다.</div>',
          actions: [{ label: '취소', value: null }, { label: '버리기', cls: 'warn main-act', value: 'go' }] }).then(function (v) {
          if (v !== 'go') return;
          var all = pendingAll(); delete all[el.dataset.key]; pendingPut(all); renderPendingBar();
        });
        break;
      case 'phrases': showPhrases(el); break;
      case 'photo': showPhotoMenu(el); break;
      case 'prevnotes':
        var pr = S.reviews.filter(function (x) { return Number(x.round) === Number(el.dataset.round); })[0];
        if (pr) {
          var head = '[' + pr.round + '차 특이사항]\n', at0 = insertIntoNotes(head + (pr.notes || ''), {});
          var prevPh = []; try { prevPh = JSON.parse(pr.notesPhotos || '[]') || []; } catch (x) { prevPh = []; }
          if (prevPh.length) {
            var cur = photos(), room = PHOTO_MAX - cur.length;
            var add = prevPh.slice(0, Math.max(0, room)).map(function (ph) { return Object.assign({}, ph, { id: newPid(), a: ph.a + at0 + head.length }); });
            setPhotos(cur.concat(add)); notesLayout();
            toast(pr.round + '차 특이사항과 사진 ' + add.length + '장을 불러왔습니다' + (add.length < prevPh.length ? ' (10장까지라 ' + (prevPh.length - add.length) + '장은 빠짐)' : ''), add.length < prevPh.length);
          }
        }
        break;
    }
  });

  function onField(e) {
    var el = e.target.closest('[data-field]');
    if (!el || !S.review) return;
    var k = el.dataset.field;
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'tel') {
      var d = String(v).replace(/\D/g, '').slice(0, 11);
      v = d.length < 4 ? d : d.length < 8 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
      if (el.value !== v) el.value = v;
    }
    if (el.type === 'email' && el.classList.contains('bad') && emailOk(v)) setEmailErr(el, false);
    if (S.review[k] === v) return;
    var oldV = S.review[k];
    S.review[k] = v;
    followContractor(k, oldV);
    if (k === 'notes') { shiftAnchors(oldV, v); notesLayout(); }
    markDirty(); updateProgress();
    if (k === 'openDate' || k === 'periodStart' || k === 'periodEnd' || k === 'fireCheckDate') updateInspect();
    updateChanges();
    if (k === 'elecKw' || k === 'mainBreakerA') updateBreaker();
    if (k === 'tenant') { var ht = $('#hdrTitle'); if (ht) ht.textContent = (v || '새 도면협의') + ' · ' + S.round + '차 검토'; }
    if (k === 'notes') onNotesInput(el);
  }
  function emailOk(v) { return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }
  function setEmailErr(el, on) {
    el.classList.toggle('bad', on); el.setAttribute('aria-invalid', on);
    var m = $('[data-err="' + el.dataset.field + '"]'); if (m) m.hidden = !on;
  }
  function fillCompany(key, name) {
    var c = (S.boot.companies || []).filter(function (x) { return x.name === String(name).trim(); })[0];
    if (!c) return;
    var p = key.replace(/Company$/, ''), filled = 0;
    [['Name', 'person'], ['Tel', 'tel'], ['Email', 'email']].forEach(function (m) {
      var k = p + m[0];
      if (!S.review[k] && c[m[1]]) { S.review[k] = c[m[1]]; var i = $('#f-' + k); if (i) i.value = c[m[1]]; followContractor(k, ''); filled++; }
    });
    if (filled) { markDirty(); updateProgress(); updateChanges(); toast(c.name + '의 이전 담당자·연락처를 불러왔습니다'); }
  }
  /* 저장 버튼은 누를 때 입력칸 포커스를 유지 → 키보드가 닫히며 화면·버튼이 움직여 첫 누름을 놓치는 일 방지
     (마우스: 눌러도 포커스 이동 안 함 / 터치: 손을 떼는 순간 바로 실행, 뒤따르는 click은 건너뜀) */
  var SAVE_ACTS = { save: 1, finalize: 1 }, tapSave = null;
  function saveBtn(e) { var b = e.target.closest && e.target.closest('[data-act]'); return b && SAVE_ACTS[b.dataset.act] && !b.disabled ? b : null; }
  app.addEventListener('mousedown', function (e) { if (saveBtn(e)) e.preventDefault(); });
  app.addEventListener('pointerdown', function (e) {
    tapSave = null;
    if (e.pointerType === 'mouse') return;
    var b = saveBtn(e); if (b) tapSave = { b: b, x: e.clientX, y: e.clientY };
  }, true);
  app.addEventListener('pointercancel', function () { tapSave = null; }, true);
  app.addEventListener('pointerup', function (e) {
    var t = tapSave; tapSave = null;
    if (!t || e.pointerType === 'mouse') return;
    if (Math.abs(e.clientX - t.x) > 12 || Math.abs(e.clientY - t.y) > 12) return; // 스크롤한 것
    if (saveBtn(e) !== t.b) return;
    S.tapAt = Date.now();
    save(t.b.dataset.act === 'finalize');
  }, true);
  // 터치로 이미 실행했으면 손을 뗀 자리로 뒤따라오는 click 한 번은 버림 (그 사이 뜬 확인창 버튼이 대신 눌리지 않게)
  document.addEventListener('click', function (e) {
    if (S.tapAt && Date.now() - S.tapAt < 700) { S.tapAt = 0; e.preventDefault(); e.stopPropagation(); }
  }, true);

  app.addEventListener('focusout', function (e) {
    if (e.target.type === 'email' && e.target.dataset.field) setEmailErr(e.target, !emailOk(e.target.value));
    if (e.target.id === 'f-mainBreakerA' && S.view === 'edit' && breakerCheck(S.review).state === 'bad') openBreakerPopup();
  });
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'f-mainBreakerA' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'dq') { S.dash.q = e.target.value; renderDashBody(); return; }
    onField(e);
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'chiefOk') { setChiefOk(e.target); return; }
    if (e.target.id === 'gpdfFile') {   // 지침 PDF 올리기 (Supabase 판)
      var gf = e.target.files && e.target.files[0]; if (!gf) return;
      toast('PDF 올리는 중… ' + mb(gf.size));
      api('apiGuidePdfAdd', S.auth, gf).then(function (st) { setGuideState(st); renderGuideAdmin(); toast('올렸습니다: ' + gf.name); }, function (er) { toast(errMsg(er), true); });
      return;
    }
    if (e.target.id === 'dm') { S.dash.month = e.target.value; renderDashBody(); return; }
    if (e.target.id === 'ds') { S.dash.sort = e.target.value; renderDashBody(); return; }
    onField(e);
    if (e.target.dataset && /Company$/.test(e.target.dataset.field || '')) fillCompany(e.target.dataset.field, e.target.value);
  });

  document.addEventListener('keydown', function (e) {
    if (S.view !== 'edit') return;
    var ta = $('#notes');
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openGuide({}); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(false); return; }
    if (e.key === 'Escape' && $('#gprev')) { hidePreview(); return; }
    if (e.target === ta && S.gp.hash) {
      if (e.key === 'Enter' && S.gp.results.length) { e.preventDefault(); insertRef(S.gp.results[0].e); }
      else if (e.key === 'Escape') { closeGuide(); }
    }
  });

  var resizeT = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (S.view === 'print' || S.view === 'printFromDash') scalePages();
      if (S.view === 'edit') notesLayout();
      var pv = $('#gprev'); if (pv && !pv.classList.contains('modal') && !wideEnough()) hidePreview();
    }, 120);
  });
  window.addEventListener('beforeprint', function () { $$('.page').forEach(function (p) { p.dataset.tf = p.style.transform; p.style.transform = ''; }); });
  window.addEventListener('afterprint', function () { scalePages(); });
  window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ───────── 시작 ───────── */
  /** 로그인 후: 보관한 저장 다시 보내기, QR로 열었으면 그 매장 검토서 */
  function afterLogin() {
    var sid = window.__START_STORE || '';
    window.__START_STORE = '';
    flushPending();
    preloadPrintLibs();
    if (sid) return openEditor(sid);
    S.view = 'dash';
    renderDashboard(); renderPendingBar();
    return Promise.resolve();
  }

  function start() {
    if (window.__SIGN) { renderSignPage(window.__SIGN); return; } // 원격 서명 링크: PIN 없이 서명 페이지만
    if (window.DW_API && !window.__DEV_OK) {   // 바로가기 앱(Supabase): 기기 등록이 먼저
      DW_API.device().then(function (d) { if (d) { window.__DEV_OK = true; start(); } else renderDevice(); }, function () { renderDevice(); });
      return;
    }
    var saved = authSaved();
    if (saved && saved.role && (saved.token || saved.pin)) {
      var c = loadStartCache(saved.role);
      if (c && !window.__START_STORE) {
        // 지난 화면을 먼저 보여주고 뒤에서 최신으로 바꿈
        S.auth = saved; setBoot(c.boot); S.stores = c.stores || []; S.syncedAt = '불러오는 중…';
        S.view = 'dash'; renderDashboard();
        doLogin(saved.role, saved.pin, saved.token).then(function () {
          flushPending(); preloadPrintLibs();
          if (S.view === 'dash') { renderDashboard(); renderPendingBar(); }
        }, function (e) {
          if (/PIN|로그인/.test(errMsg(e))) { authKeep(null); S.auth = null; renderLogin(saved.role, errMsg(e)); }
          else { S.syncedAt = '연결 안 됨'; if (S.view === 'dash') renderDashboard(); toast('최신 내용을 불러오지 못했습니다. 지난 내용을 보여주고 있습니다.', true); }
        });
        return;
      }
      loading();
      doLogin(saved.role, saved.pin, saved.token).then(afterLogin, function (e) {
        if (/PIN|로그인/.test(errMsg(e))) { authKeep(null); renderLogin(saved.role, errMsg(e)); return; }
        // 연결 문제: 기억은 지우지 않고 다시 시도 안내
        app.innerHTML = '<div class="loading">서버에 연결하지 못했습니다.<br><button type="button" class="btn" style="margin-top:14px" onclick="location.reload()">다시 시도</button></div>';
      });
    } else {
      renderLogin();
    }
  }
  start();

  window.__DR = S; // 점검용
})();
</script>

</body>
</html>
