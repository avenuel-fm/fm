<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="../apps.js"></script>
  <script src="config.js"></script>
  <script>window.DW_VERSION = '1.9.0';</script>
  <script src="dw-api.js"></script>
  <title>잠실점 에비뉴엘 도면협의</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
:root{
  --ink:#18202B; --ink2:#2A3340; --sub:#3F4855; --muted:#5B6573; --faint:#7A8494;
  --line:#CBD2DB; --line2:#DCE1E7; --line3:#EDF0F3; --ground:#F4F6F8; --card:#FFFFFF;
  --blue:#1F5FA8; --blue-d:#174A84; --blue-bg:#E8F0FA;
  --green:#1F7A4D; --green-d:#155C39; --green-bg:#EAF5EF;
  --orange:#B4410F; --orange-bg:#FDF0E8; --red:#C0261A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* 공통 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.btn:hover{background:#F8F9FB}}
.btn:focus-visible,.seg button:focus-visible,.chk:focus-visible,.cf:focus-visible,.tab:focus-visible{outline:3px solid #9CC0EC;outline-offset:2px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
@media (hover:hover){.btn.pri:hover{background:var(--blue-d)}}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy{cursor:progress;opacity:.85}
.btn .spin{width:16px;height:16px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn .spin{animation-duration:2s}}
@media (prefers-reduced-motion:no-preference){.btn{transition:scale .15s ease-out}.btn:not([disabled]):active{scale:.96}}
.icon-btn{width:44px;min-width:44px;flex:none;padding:0}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-bottom:6px}
.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
.inp::placeholder,textarea::placeholder{color:var(--faint)}
.inp:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.inp[disabled],textarea[disabled]{background:#F6F7F9;color:var(--sub)}
.uw{position:relative}
.uw .inp{padding-right:56px}
.sfx{position:absolute;right:12px;top:12px;font-size:14px;color:var(--muted);pointer-events:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:44px;background:#fff}
.seg button{flex:1;border:0;background:#fff;font-size:14px;color:var(--sub);min-width:52px;padding:0 8px;cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff;font-weight:500}
.seg button[disabled]{cursor:not-allowed}
.seg button[disabled]:not(.on){color:var(--faint)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.tb-title{display:flex;align-items:center;gap:10px;flex:1 1 300px;min-width:0}
.tb-title .t1{font-size:12px;color:var(--muted)}
.tb-title .t2{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{flex:none;font-size:12px;font-weight:500;border-radius:999px;padding:4px 10px}
.chip.orange{color:var(--orange);background:var(--orange-bg)}
.chip.green{color:var(--green-d);background:var(--green-bg)}
.chip.blue{color:var(--blue-d);background:var(--blue-bg)}
.savestate{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-right:4px}
.savestate.ok{color:var(--green)}
.savestate.dirty{color:var(--orange)}

/* 역할 선택 (소장/부소장) */
.roles{display:flex;gap:6px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;color:var(--sub);cursor:pointer}
.chk .box{width:18px;height:18px;border-radius:4px;border:1.5px solid #9AA4B2;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d);font-weight:500}
.chk.on .box{background:var(--blue);border-color:var(--blue)}

/* 레이아웃 */
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 40px}
.card{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:18px 20px}
/* 1.8 전기용량 · 전원 방식(넓게) · 메인차단기 한 줄 */
.grid.elecrow{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) minmax(0,1fr)}
.elecrow .seg button{padding:0 4px;white-space:nowrap}
@media (max-width:1100px){.elecrow .seg button{font-size:13px}}
@media (max-width:760px){.grid.elecrow{grid-template-columns:1fr}.elecrow .seg button{font-size:14px;white-space:normal;line-height:1.25;padding:2px 4px}}
.sub{margin:24px 0 12px;font-size:14px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line3)}
.sub.first{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* 로그인 */
/* 1.8 할 일 · 표시 · 업체 이력 · 서류 요청 · 발송 기록 */
.todos{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 14px}
.todos:empty{display:none}
.todos .lb{font-size:13px;color:var(--muted);margin-right:2px}
.todo{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.todo b{font-size:16px}.todo.pu{color:#7A4BB7}.todo.or{color:#B4410F}.todo.rd{color:#C0261A}
@media (hover:hover){.todo:hover{background:var(--ground)}}
.todo.pick{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.todo-none{font-size:14px;color:var(--green-d,#1E7B45);font-weight:600}
.filterchip{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;padding:4px 6px 4px 12px;border-radius:999px;background:#F7F2FD;color:#7A4BB7;font-size:13px;font-weight:500}
.filterchip.or{background:#FFF4EC;color:#B4410F}.filterchip.rd{background:#FDECEC;color:#C0261A}
.filterchip button{border:0;background:none;color:inherit;font-size:15px;cursor:pointer;min-width:32px;min-height:32px}
.schip.doc{background:#FDECEC;color:#C0261A}.schip.hj{background:#EEF4FB;color:#1F5FAE}.schip.fd{background:#E8F5EE;color:#1E6B42}
.vlink{border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;text-align:left}
@media (hover:hover){.vlink:hover{color:var(--blue)}}
@media (pointer:coarse){.vlink{display:inline-block;min-height:32px;padding:6px 0}}
.vstat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.vstat div{background:#F6F7F9;border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}.vstat b{display:block;font-size:20px;color:var(--ink)}
.vwrap{overflow-x:auto;margin-top:12px}
.vtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}.vtbl th{background:#F6F7F9;color:var(--muted);font-weight:500;text-align:left;padding:8px}.vtbl td{border-top:1px solid var(--line3);padding:8px}
.vstore{border:0;background:none;padding:0;color:var(--blue);font:inherit;font-weight:500;cursor:pointer;text-align:left;min-height:32px}
@media (max-width:520px){.vstat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn.docreq{margin-top:10px;border-color:#C0261A;color:#C0261A}
.sendlog{margin-top:16px;border:1px solid var(--line2);border-radius:12px;background:#fff;overflow:hidden}
.sendlog .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F6F7F9;font-weight:500;font-size:14px}
.sendlog .hd .c{font-weight:400;color:var(--muted);font-size:12px}
.sendlog ul{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;overscroll-behavior:contain}
.sendlog li{display:grid;grid-template-columns:118px 84px minmax(0,1fr);gap:10px;align-items:start;padding:9px 14px;border-top:1px solid var(--line3);font-size:13.5px}
.sendlog li>span:last-child{overflow-wrap:anywhere}
.sendlog .dt{color:var(--sub);white-space:nowrap}.sendlog .tg{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;text-align:center}
.tg.sp{background:#E8F5EE;color:#1E6B42}.tg.dc{background:#FDECEC;color:#C0261A}.tg.sg{background:#EAF2FC;color:#1F5FAE}.tg.hj{background:#F2ECFB;color:#7A4BB7}.tg.pdf{background:#F1F3F5;color:var(--sub)}
.sendlog .who{color:var(--muted);font-size:12.5px}.sendlog a{color:var(--blue)}
@media (max-width:640px){.sendlog li{grid-template-columns:1fr auto}.sendlog li>span:last-child{grid-column:1/-1}}
/* 출력물 2쪽: 직전 차수 대비 변경 */
.pchg{border:1px solid var(--ink);margin-top:14px}.pchg .hd{background:#EEF1F4;border-bottom:1px solid var(--ink);padding:5px 10px;font-size:11px;font-weight:500}
.pchg ul{margin:0;padding:6px 14px 8px 28px;font-size:11px;line-height:1.65;columns:2;column-gap:24px}.pchg b{color:#C0261A}.pchg .more{color:var(--muted)}.pchg .none{padding:6px 12px;font-size:11px;color:var(--muted)}
/* 1.8 원격 서명 */
.sreqw{margin-top:6px}.sreqw:empty{display:none}
.sreq{display:inline-flex;align-items:center;gap:4px;border:1px solid #2E8B57;color:#1E6B42;background:#fff;border-radius:8px;min-height:32px;padding:4px 10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.sreq.wait{border-color:#E7A35F;color:#B4410F;background:#FFF8F2}
.sfile input.sremail{display:block;width:100%;height:auto;box-sizing:border-box;margin:6px 0 0;min-height:40px;accent-color:auto}
.signpg{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;min-height:100dvh}
.signpg h1{font-size:20px;margin:4px 0 2px}
.sp-card{padding:16px;margin-top:12px;font-size:14px;line-height:1.8}
.sp-h{font-weight:600}
.sp-pdf{display:flex;justify-content:center;margin-top:12px;min-height:46px;text-decoration:none}
.sp-padwrap{position:relative;margin-top:10px}
canvas.pen-on{cursor:crosshair}
.sp-padwrap .sp-pad{margin-top:0}
/* 서명 안내 영상(PC 전용, DW-4): 서명칸 위에 덮음 · 클릭은 아래 서명칸으로 통과 · 좌우 여백은 영상 바탕색 */
.gv{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#444545;border-radius:inherit;overflow:hidden;pointer-events:none}
.sp-padwrap .gv{border-radius:12px}
.gv video,.gv img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain}
.sp-pad{display:block;width:100%;height:200px;margin-top:10px;border:1.5px dashed #9AA4B2;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.sp-btns{display:flex;gap:8px;margin-top:12px}.sp-btns .btn{flex:1;min-height:48px}.sp-btns .btn.pri{flex:2}
.sp-err{color:#B4410F;margin-top:8px;min-height:18px}
.sp-foot{margin-top:12px;text-align:center}
.sp-done{padding:28px 18px}
/* 1.7 PIN 팝업 */
.pinpop{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(24,32,43,.45)}
.pinpop .pinbox{position:static;width:100%;max-width:380px;text-align:center}
.pinbox .lock{width:56px;height:56px;border-radius:50%;background:#EAF2FC;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.pinbox h1{font-size:20px;margin:4px 0 0}
.pinbox .pin{font-size:24px;letter-spacing:10px;text-align:center;margin-top:10px}
.pinbox .err{min-height:20px;margin-top:6px}
.pinbox .btn{width:100%;min-height:50px;font-size:16px;margin-top:6px}
.pinbox .btn.devoff{min-height:40px;font-size:13px;margin-top:10px;border-color:transparent;background:transparent;color:var(--muted)}
.whoami{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:#EAF2FC;color:var(--blue);font-size:14px;font-weight:500;white-space:nowrap}
/* 대시보드 차수 · 컨펌완료 · 소장 확인 한 줄 */
.stepsrow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.cfpair{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
@media (max-width:1279px){.stepsrow{flex-wrap:wrap}}
@media (min-width:1280px){.tbl td.c-act{white-space:normal!important}.tbl td.c-act .btn{margin-top:2px;margin-bottom:2px}}
@media (min-width:1101px) and (max-width:1279px){.tbl td.c-act{white-space:normal!important;min-width:0!important;width:150px}.tbl td.c-act .btn{margin:2px 0 2px 4px}}
.stepsrow .cf{min-height:32px;min-width:100px;padding:0 6px;font-size:12px;gap:4px;justify-content:center}
.stepsrow .st{width:36px}
.stepsrow .cf svg{width:12px;height:12px;flex:none}
.cf.chief{border-color:#C3CAD3;color:#9AA4B2;background:#F6F7F9;cursor:default}
.cf.chief.on{border-color:var(--green);background:var(--green);color:#fff}
/* 9번 소장 확인 */
.chiefbox{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:12px 18px;border:1.5px solid #CFE6D8;border-radius:12px;background:#F2FAF5;font-size:16px;font-weight:500;color:#1E6B42;cursor:pointer}
.chiefbox input{width:24px;height:24px;margin:0;accent-color:#2E8B57}
.chiefbox.off{opacity:.6;cursor:not-allowed}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:420px;padding:32px}
.login h1{font-size:22px;margin:4px 0 24px}
.err{margin-top:12px;color:var(--red);font-size:14px;min-height:20px}

/* 대시보드 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .n{font-size:30px;font-weight:600;margin-top:4px}
.kpi.done{border-color:#B7DCC8;background:#F5FBF8}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.panel{background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line2);overflow-x:auto}
.tab{min-height:48px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{border-bottom-color:var(--blue);color:var(--ink);font-weight:500}
.tab .c{font-size:12px;margin-left:4px;color:var(--muted)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;min-width:1040px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:12px 9px;font-weight:500;color:var(--sub);background:var(--ground);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:10px 9px;height:56px;border-bottom:1px solid var(--line3);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c-doc{white-space:nowrap}
.tbl td.c-act .btn.sm{padding:0 8px}
/* DW-2: 표 화면(PC·태블릿)에서 「최근 검토일」·「오픈 예정일」 제목·날짜·D-배지를 칸 가운데로 (카드 화면은 그대로) */
@media (min-width:1101px){.tbl th.c-last,.tbl th.c-open,.tbl td.c-last,.tbl td.c-open{text-align:center;font-variant-numeric:tabular-nums}.tbl td.c-open .dday{margin:4px 0 0 4px}}
@media (min-width:1101px){.tbl td.c-doc{white-space:normal!important;overflow-wrap:anywhere;max-width:128px}.tbl td.c-act{font-size:0;min-width:306px}.tbl td.c-act .btn{margin-left:4px;white-space:nowrap}.tbl .stepsrow .cf,.tbl .st{white-space:nowrap}}
.store-link{font-weight:500;text-decoration:none;color:var(--blue);background:none;border:0;padding:0;cursor:pointer;font-size:14px;text-align:left}
.steps{display:inline-flex;align-items:center}
.st{display:inline-flex;align-items:center;justify-content:center;width:46px;height:30px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--faint);margin-left:-1px}
.st:first-child{border-radius:6px 0 0 6px;margin-left:0}
.st:last-child{border-radius:0 6px 6px 0}
.st.done{background:var(--line3);color:var(--sub)}
.st.cur{background:var(--blue);border-color:var(--blue);color:#fff;position:relative;z-index:1}
.st.ok{background:var(--green);border-color:var(--green);color:#fff;position:relative;z-index:1}
.cf{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid var(--green);background:#fff;color:var(--green)}
.cf.on{background:var(--green);color:#fff}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}

/* 검토서 편집 */
.edit-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.nav{flex:1 1 220px;max-width:100%;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px;position:sticky;top:84px}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--sub);font-size:14px}
@media (hover:hover){.nav a:hover{background:var(--ground)}}
.prog{height:6px;margin:0 12px 14px;background:var(--line3);border-radius:3px;overflow:hidden}
.prog i{display:block;height:6px;background:var(--green)}
.dot{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--muted);flex:none}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.sec{scroll-margin-top:90px}
.sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sh h2{margin:0;font-size:19px}
.sh p{margin:0;font-size:13px;color:var(--muted);flex-basis:100%}
.box2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:20px}
.party{border:1px solid var(--line3);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair>div{flex:1 1 150px}
.ea-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ea{display:flex;gap:8px;align-items:center}
.ea .inp{width:72px;text-align:center;padding:0 6px}
.ea span{font-size:13px;color:var(--muted)}
.rule{margin:0;padding-left:22px;font-size:14px;color:var(--ink2)}
.rule li{margin:0 0 10px;line-height:1.65}
.rule .em{color:var(--orange);font-weight:500}
.rule .subl{color:var(--muted)}
.ack{margin-top:16px;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;background:var(--green-bg);border-radius:10px;font-size:14px;font-weight:500;color:var(--green-d);cursor:pointer}
.ack input{width:22px;height:22px;accent-color:var(--green);flex:none}
.notes{width:100%;min-height:240px;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.7;resize:vertical}
.notes-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.info{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--blue-d);background:var(--blue-bg);border-radius:8px;padding:10px 12px}
.lockbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;background:var(--green-bg);color:var(--green-d);font-weight:500;font-size:14px}
.sigtbl{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
.sigtbl th{text-align:left;padding:10px 12px;font-weight:500;background:var(--ground);color:var(--sub)}
.sigtbl td{padding:6px 8px;border-bottom:1px solid var(--line3)}
.sigtbl td.k{padding:10px 12px;font-weight:500}
.sigbtn{width:100%;height:56px;border:1px dashed #9AA4B2;background:#fff;border-radius:8px;font-size:13px;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sigbtn.has{border:1px solid var(--green);background:#F5FBF8}
.sigbtn img{max-height:44px;max-width:100%}
/* 검토서 아래 버튼 줄: 모든 화면에서 아래에 고정, 맨 왼쪽 「뒤로」 (DW-7) */
.foot-actions{position:sticky;bottom:0;z-index:15;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:8px;border-radius:12px 12px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border:1px solid var(--line2);border-bottom:0;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.foot-actions .back-in{margin-right:auto;padding:0 14px 0 8px;gap:2px}
.fa-br{display:none}
.menu{position:absolute;z-index:51;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;max-width:min(520px,calc(100vw - 32px))}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.5;cursor:pointer}
@media (hover:hover){.menu button:hover{background:var(--ground)}}

/* 1.0 추가 표시 */
.chgb{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--orange-bg);color:var(--orange);font-size:11px;font-weight:500;line-height:18px;vertical-align:1px;cursor:help}
.inp.chg{border:2px dashed var(--orange)}
.ferr{margin-top:6px;font-size:12px;color:var(--red)}
.dwarn{margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--orange-bg);color:var(--orange);font-weight:500}
.seg.na button{color:var(--muted);background:#F6F7F9;cursor:not-allowed;justify-content:center;text-align:center}
.inp.na-c{text-align:center;color:var(--muted)}
/* 소방 점검일 제안 */
.firesug{margin-top:8px;display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-height:40px;padding:6px 14px;border:1px dashed #2F6FB5;border-radius:999px;background:#F0F6FD;color:#1F5FAE;font:inherit;font-size:13px;cursor:pointer;text-align:left}
@media (hover:hover){.firesug:hover{background:#E3EEFB}}
/* 종합방재실 협의서 (1.8.2) */
.firerow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.firerow>.inp{flex:0 1 280px;min-width:170px}
.fdslot{display:flex;flex:0 1 auto;min-width:0}
.fdbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:normal;text-align:left;touch-action:manipulation}
.fdbtn.add{border:1px dashed var(--blue);background:var(--blue-bg);color:var(--blue-d)}
@media (hover:hover){.fdbtn.add:hover{background:#DCE8F7}}
.fdbtn.view{border:1px solid var(--green);background:var(--green-bg);color:var(--green-d)}
@media (hover:hover){.fdbtn.view:hover{background:#DDEFE5}}
.fdbtn[disabled]{opacity:.8;cursor:progress}
.fdbtn .spin{width:16px;height:16px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.fdbtn:focus-visible,.fdbig:focus-within{outline:3px solid #9CC0EC;outline-offset:2px}
.fdmeta{font-size:12px;color:var(--muted);margin-top:6px}
.fdmeta:empty{display:none}
.fdmeta .lnk{border:0;background:none;padding:4px 2px;margin-left:8px;font:inherit;font-size:12px;color:var(--blue);text-decoration:underline;cursor:pointer;min-height:28px}
@media (pointer:coarse){.fdmeta .lnk{min-height:40px;padding:8px 6px;margin-left:4px}}
.fdpick{max-width:420px}
.fdbig{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin-top:10px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer}
@media (hover:hover){.fdbig:hover{background:#F8F9FB}}
.fdbig .ui-ico{width:24px;height:24px}
.fdov{padding:12px}
.fdview{background:#fff;border-radius:14px;display:flex;flex-direction:column;height:min(94vh,1180px);height:min(94dvh,1180px);width:min(calc(min(94vh,1180px) * 0.68),calc(100vw - 24px));overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.fdv-hd{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line3)}
.fdv-hd b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdv-bd{position:relative;flex:1;min-height:0;background:#E9ECF0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fdv-bd img{position:absolute;left:50%;top:50%;max-width:none;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .2s ease;background:#fff}
.fdv-ft{display:flex;gap:10px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line3);flex-wrap:wrap}
.fdv-ft .btn{flex:1 1 140px;max-width:220px}
@media (prefers-reduced-motion:reduce){.fdv-bd img{transition:none}}
/* 시방서 발송 */
.btn.spec{border-color:#2E8B57;color:#1E6B42}
.sendrec{margin-top:16px;border:1px solid #CFE6D8;background:#F2FAF5;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.sendrec .ic{width:32px;height:32px;border-radius:50%;background:#DDF1E5;display:flex;align-items:center;justify-content:center;flex:none}
.sendrec>div:last-child{min-width:0}
.sendrec ul{margin:4px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.8;overflow-wrap:anywhere}.sendrec li b{color:#1E6B42}
.sendrec.none{border-color:#F1D9C7;background:#FFF8F2}.sendrec.none .ic{background:#FCE7D6}
.schip{display:table;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.schip.no{background:#FFF1E6;color:#B4410F}.schip.ok{background:#E8F5EE;color:#1E6B42}
.dlg-ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.sfile{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#F6F7F9;color:#1F3B5C;font-size:14px;cursor:pointer}
.sfile.on{background:#F0F6FD}.sfile.off{opacity:.6;cursor:not-allowed}
.sfile input{width:22px;height:22px;accent-color:#1F5FAE;margin:2px 0 0;flex:none}
.sfile>span{min-width:0;overflow-wrap:anywhere}
.sfile .sent{display:inline-block;margin-top:4px;font-size:12px;color:#1E6B42;font-weight:500}
.sfile .miss{display:inline-block;margin-top:4px;font-size:12px;color:#B4410F;font-weight:500}
.mailpv{margin-top:14px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;font-size:13px}
.mailpv .r{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line3)}
.mailpv .r span{color:var(--ink);font-weight:400;min-width:0;overflow-wrap:anywhere}.mailpv .r span:first-child{width:62px;color:var(--muted);flex:none}
.mailpv .body{padding:12px;line-height:1.7;background:#FBFCFD;overflow-wrap:anywhere}.mailpv .body a{color:#1F5FAE}
.mailpv textarea{display:block;width:100%;box-sizing:border-box;border:1px dashed #B9C3CF;border-radius:8px;padding:8px;font:inherit;font-size:16px;min-height:56px;margin-top:10px;background:#fff;resize:vertical}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:#FFF4F2;color:#A3261A;font-size:13px;line-height:1.6}
.linkbtn{border:0;background:none;padding:0;color:#1F5FAE;text-decoration:underline;font:inherit;cursor:pointer}
.spec-dlg{max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain}
.msig{margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);font-size:13px;line-height:1.7;color:var(--ink);overflow-wrap:anywhere}.msig b{color:#1F3B5C}.msig a{color:#1F5FAE}
/* 기준 연도 */
.yearbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.yearbar .lb{font-size:13px;color:var(--muted);margin-right:4px}
.ychip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:15px;color:var(--sub);cursor:pointer}
.ychip.on{background:#EAF2FC;border-color:var(--blue);color:var(--blue);font-weight:500}
.ychip .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid #9AA4B2;display:inline-flex;align-items:center;justify-content:center}
.ychip.on .bx{background:var(--blue);border-color:var(--blue)}
.yearbar .note{font-size:12px;color:var(--muted);margin-left:4px}
@media (pointer:coarse){.ychip{min-height:44px}}
/* 달력 */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 16px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}.calnav .btn{min-width:44px}.calnav h3{margin:0 4px;font-size:18px;white-space:nowrap}
.callegend{display:flex;gap:6px 14px;font-size:12px;color:var(--sub);flex-wrap:wrap;align-items:center}
.callegend .lg{display:inline-block;width:16px;height:8px;border-radius:2px;background:#2F6FB51f;border-left:3px solid #2F6FB5;margin-right:5px;vertical-align:middle}
.cal{border-top:1px solid var(--line2)}
.cdow,.cweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cdow div{padding:6px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2)}
.cdow .sun,.cday.sun .cnum{color:#C0261A}.cdow .sat,.cday.sat .cnum{color:#2F6FB5}
.cday{min-height:104px;border-right:1px solid var(--line3);border-bottom:1px solid var(--line3);padding:4px 0 6px;min-width:0}
.cday:nth-child(7n){border-right:0}
.cday.out{background:#FAFBFC}.cday.out .cnum{opacity:.4}
.cnum{font-size:12px;font-weight:500;padding:2px 8px}
.cday.today .cnum span{background:var(--blue);color:#fff;border-radius:999px;display:inline-block;min-width:22px;text-align:center}
.cbar{display:block;box-sizing:border-box;width:100%;height:20px;line-height:20px;margin:2px 0;padding:0 6px;border:0;border-left:3px solid transparent;font:inherit;font-size:11px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cbar.gap{background:none;cursor:default}
.cev{display:block;box-sizing:border-box;width:100%;border:0;background:none;padding:1px 6px;font:inherit;font-size:11px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cev.fire,.agi .fire{color:#C0261A}
.calagenda{display:none;padding:12px 16px 16px}
@media (pointer:coarse){.calagenda{display:block}}
.agi{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;border-bottom:1px solid var(--line3);background:none;font:inherit;font-size:14px;text-align:left;cursor:pointer;padding:6px 0}
.agi .ad{width:82px;flex:none;color:var(--sub);font-size:13px}.agi i{width:10px;height:10px;border-radius:50%;flex:none}
.agi b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agi span:last-child{margin-left:auto;white-space:nowrap;font-size:13px}
@media (max-width:760px){
  .cday{min-height:64px}
  .cbar{height:8px;padding:0;font-size:0;margin:1px 0}
  .cev{display:inline-block;width:auto;padding:0 2px;font-size:12px;line-height:1.2}.cev .tx{display:none}
  .cnum{padding:2px 4px}
  .calagenda{display:block}
  .calhead{padding:12px 10px}.calnav{gap:6px}.calnav h3{font-size:16px;margin:0}
}

.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.delack{background:#FDECEA;color:#A3231A;margin-top:14px}
.delack input{accent-color:var(--red)}
.btn.del{color:var(--red);border-color:#E9B5AF}
.btn.del[disabled]{color:var(--faint);border-color:var(--line)}
.sigbtn{flex-direction:column;gap:2px}
.sigdate{font-size:11px;color:var(--muted)}
.misslist{margin-top:14px;max-height:46vh;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.misslist button{min-height:40px;padding:0 12px;border:1px solid #E9B5AF;background:#FFF6F5;color:#A3231A;border-radius:8px;font-size:13px;cursor:pointer}
@media (hover:hover){.misslist button:hover{background:#FDECEA}}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #FFD08A}100%{box-shadow:0 0 0 0 transparent}}
.kpi.soon{border-color:#F3CDB7;background:#FFFAF6}
.dday{display:inline-block;margin:4px 4px 0 0;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--line3);color:var(--sub)}
.dday.soon{background:var(--orange-bg);color:var(--orange)}
.dday.past{background:#F6F7F9;color:var(--faint);font-weight:500}
.dday.insp{background:#FDECEA;color:#A3231A}
.blank{color:#9AA4B2}
.sel.sel-r{color:var(--red);border-color:var(--red)}
.psigd{display:block;font-size:8.5px;color:var(--muted);line-height:1.1;margin-top:1px}
.stamp{position:absolute;top:39px;right:46px;z-index:2;transform:rotate(-7deg);text-align:center;font-weight:500;letter-spacing:1px;border-radius:8px;padding:4px 12px;line-height:1.2;pointer-events:none}
.stamp small{display:block;font-size:9px;font-weight:500;letter-spacing:0;margin-top:2px}
.stamp.ok{color:#C0261A;border:2.5px double #C0261A;font-size:16px;background:rgba(255,255,255,.85)}
.stamp.draft{color:#7A8494;border:1.5px dashed #9AA4B2;font-size:13px;background:rgba(255,255,255,.85)}

/* 메인차단기 판정 */
.inp.bad{border:2px solid var(--red);background:#FFF6F5}
.inp.good{border:2px solid var(--green)}
.brk{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--ground);color:var(--sub);font-size:14px}
.brk.bad{background:#FFF6F5;color:#A3231A;font-weight:500}
.brk.ok{background:var(--green-bg);color:var(--green-d);font-weight:500}
.brkdlg{max-width:540px}
.brkicon{width:52px;height:52px;border-radius:26px;background:#FDECEA;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.brkcalc{margin-top:18px;border:1px solid var(--line3);border-radius:12px;padding:4px 16px}
.brow{display:grid;grid-template-columns:150px 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line3);font-size:14px}
.brow:last-child{border-bottom:0}
.brow .k{color:var(--muted)} .brow .f{font-size:12px;color:var(--faint)} .brow .v{font-weight:500;font-size:16px;text-align:right}
.brkchips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chipA{min-width:84px;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chipA.on{border:2px solid var(--green);background:var(--green-bg);color:var(--green-d)}
.chipA .tag{font-size:11px;font-weight:500}
.brknote{margin-top:16px;padding:10px 12px;background:var(--ground);border-radius:8px;font-size:12px;line-height:1.6;color:var(--sub)}
@media (max-width:520px){.brow{grid-template-columns:1fr auto}.brow .f{grid-column:1/-1;order:3}}

/* 지침 검색 패널 */
.gpanel{position:fixed;z-index:40;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:block;right:0;top:0;bottom:0;width:420px;max-width:100vw;border-left:1px solid var(--line2);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gpanel .gp-title{padding:16px 18px 0}
.gpanel .gp-sticky{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 18px;background:#fff}
.gpanel .gp-sticky .gsearch{flex:1;min-width:0;margin:0}
.gpanel .gp-head{padding:0 18px 12px;border-bottom:1px solid var(--line3)}
.gpanel .gp-head .gfilter{margin-top:0}
.gpanel .gp-body{padding:12px 18px 24px}
.gpanel.scrolled .gp-sticky{box-shadow:0 4px 10px rgba(0,0,0,.07);border-bottom:1px solid var(--line3)}
.gkwt{display:block;margin-top:10px;min-height:34px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);background:#fff;font-size:13px;color:var(--sub);cursor:pointer}
.gsearch{position:relative;margin-top:10px}
.gsearch svg{position:absolute;left:14px;top:15px}
.gsearch .inp{height:48px;padding-left:42px;border:2px solid var(--blue);font-size:16px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gchips button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.hit{border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin-top:10px}
.pg{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;font-weight:500}
.mk{background:#FFE58A;color:var(--ink);font-weight:500;padding:0 2px;border-radius:2px}
.gfilter{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gfilter button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub);cursor:pointer}
.gfilter button span{color:var(--faint);margin-left:2px}
.gfilter button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.gfilter button.on span{color:#C9D1DB}
.srctag{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:2px 6px;white-space:nowrap}
.srctag.s0{background:var(--blue-bg);color:var(--blue-d)}
.srctag.s1{background:var(--orange-bg);color:var(--orange)}
.srctag.s2{background:var(--green-bg);color:var(--green-d)}
.srctag.s3{background:#F1EAFB;color:#5B3A99}

  /* ───────── 유틸 ───────── */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function nowFull() { var d = new Date(); return todayISO() + ' ' + nowHM(); }
  function yymmdd(iso) { if (!iso) return ''; var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1].slice(2) + '.' + m[2] + '.' + m[3] : esc(iso); }
  function addDays(iso, n) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return '';
    var d = new Date(+m[1], +m[2] - 1, +m[3] + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function emph(text) {
    // 준수사항: **강조** → 빨간 굵게, "- " 로 시작하는 줄은 보조 설명
    return String(text || '').split('\n').map(function (line, i) {
      var html = esc(line).replace(/\*\*(.+?)\*\*/g, '<span class="em r">$1</span>');
      if (i > 0 && /^\s*-/.test(line)) return '<br><span class="subl">' + html + '</span>';
      return (i > 0 ? '<br>' : '') + html;
    }).join('');
  }
  function errMsg(e) { return String((e && e.message) || e || '오류가 발생했습니다.').replace(/^(Exception|Error):\s*/, ''); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function ss(key, val) {

    return new Promise(function (resolve, reject) {

  }

        else if (e.target === ov) { closeModal(); resolve(null); }

  /* 기기 등록 (Supabase 판, 업무지원과 같은 방식): 기기마다 처음 한 번 시설팀 공용 계정. 그다음은 지금처럼 PIN */

  /* 로그인 기억: 기기마다 처음 한 번만 PIN. PIN 대신 서버가 준 표(token)를 이 기기에 둠 */
  var AKEY = 'dr_auth';
  function authSaved() {
    try { var v = JSON.parse(localStorage.getItem(AKEY) || 'null'); if (v) return v; } catch (e) { /* 막힘 */ }
    return ss(AKEY); // 1.6 이전: 창을 닫으면 사라지던 기억
  }
  function authKeep(a) {
    ss(AKEY, null);
    try { if (a) localStorage.setItem(AKEY, JSON.stringify(a)); else localStorage.removeItem(AKEY); } catch (e) { if (a) ss(AKEY, a); }
  }
  /** 로그인: 서버 한 번 호출로 확인 + 설정 + 매장 목록을 받음 */
  function doLogin(role, pin, token) {
    var a = token ? { role: role, token: token } : (role ? { role: role, pin: pin } : { pin: pin });
    return api('apiStart', a).then(function (r) {
      role = r.role || role;
      S.auth = { role: role, token: r.token || token }; if (!S.auth.token) S.auth.pin = pin;
      authKeep(S.auth);
      setBoot(r.boot);
      S.stores = r.stores || []; S.syncedAt = nowHM(); S.storesFresh = true;
      saveStartCache(r);
    });
  }
  /* 첫 화면 기억: 같은 기기에서 다시 열면 지난 매장 목록을 먼저 보여주고, 최신 내용은 뒤에서 받음 */
  var CKEY = 'dr_start_cache';
  function saveStartCache(r) {
    try { localStorage.setItem(CKEY, JSON.stringify({ role: r.role, boot: r.boot, stores: r.stores, at: nowFull() })); } catch (e) { /* 저장 공간 부족 */ }
  }
  function loadStartCache(role) {

  }

  /* PDF·QR 도구는 출력할 때만 불러옴 (첫 로딩 약 1MB 줄임). 첫 화면이 뜬 뒤 미리 받아 둠 */
  var LIBS = {

  /* 기준 연도: 최초 등록일(문서번호 날짜) 기준, 여러 해를 고르면 합쳐서 */
  var YKEY = 'dr_years';
  function storeYear(s) {
    var m = String(s.firstDate || '').match(/^(\d{4})/); if (m) return m[1];
    m = String(s.docNo || '').match(/_(\d{2})\d{4}$/); return m ? '20' + m[1] : '';
  }
  function yearList() {
    var cur = new Date().getFullYear(), set = {};
    set[cur] = 1; set[cur + 1] = 1;
    S.stores.forEach(function (s) { var y = storeYear(s); if (y) set[y] = 1; });
    return Object.keys(set).sort();
  }
  function selYears() {
    if (!S.dash.years) {
      var v = null; try { v = JSON.parse(localStorage.getItem(YKEY) || 'null'); } catch (e) { v = null; }
      var cy = String(new Date().getFullYear());
      S.dash.years = Array.isArray(v) && v.length ? v.map(String) : [cy];
      // 해가 바뀌면 올해를 자동으로 더함 (예전 해만 골라 둔 채로 새해 매장이 안 보이는 일 방지)
      if (!S.dash.years.some(function (y) { return y >= cy; })) S.dash.years.push(cy);
    }
    return S.dash.years;
  }
  function inYears(s) { var y = storeYear(s); return !y || selYears().indexOf(y) >= 0; }
  function yearStores() { return S.stores.filter(inYears); }
  function toggleYear(y) {
    var cur = selYears().slice(), i = cur.indexOf(y);
    if (i >= 0) { if (cur.length === 1) { toast('연도를 하나 이상 골라야 합니다'); return; } cur.splice(i, 1); } else cur.push(y);
    S.dash.years = cur.sort();
    try { localStorage.setItem(YKEY, JSON.stringify(S.dash.years)); } catch (e) { /* 막힘 */ }
    renderDashBody();
  }
  function renderYearBar() {
    var el = $('#yearbar'); if (!el) return;

    el.innerHTML = '<span class="lb">기준 연도</span>' + yearList().map(function (y) {
      var on = sel.indexOf(y) >= 0;
      return '<button type="button" class="ychip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="year" data-y="' + y + '"><span class="bx">' + (on ? ICON.checkW : '') + '</span>' + y + '년</button>';
    }).join('') + '<span class="note">최초 등록일(문서번호 날짜) 기준 · 여러 해를 고르면 합쳐서 보여줍니다</span>';
  }

  function dashFiltered() {
    var q = S.dash.q.trim().toLowerCase();
    var list = yearStores().filter(function (s) {
      if (q && [s.tenant, s.contractor, s.docNo, s.location].join(' ').toLowerCase().indexOf(q) < 0) return false;
      if (S.dash.month && String(s.lastReviewDate || '').indexOf(S.dash.month) !== 0) return false;
      if (S.dash.todo && !TODO[S.dash.todo].f(s)) return false;
      return true;
    });
    var counts = { all: list.length, ongoing: 0, done: 0 };
    list.forEach(function (s) { if (s.status === '컨펌완료') counts.done++; else counts.ongoing++; });
    if (S.dash.tab === 'ongoing') list = list.filter(function (s) { return s.status !== '컨펌완료'; });
    if (S.dash.tab === 'done') list = list.filter(function (s) { return s.status === '컨펌완료'; });
    var by = {
      recent: function (a, b) { return String(b.lastReviewDate).localeCompare(String(a.lastReviewDate)) || b.seq - a.seq; },
      open: function (a, b) { return (a.openDate ? 0 : 1) - (b.openDate ? 0 : 1) || String(a.openDate).localeCompare(String(b.openDate)); },
      name: function (a, b) { return String(a.tenant).localeCompare(String(b.tenant), 'ko'); },

  function stepsHtml(cur, confirmed) {

  /* 할 일: 누르면 그 매장만 걸러 보기. 시설 소장 확인 대기는 소장에게만 */

  /* ───────── 달력 탭 ───────── */
  var CAL_COLORS = ['#2F6FB5', '#2E8B57', '#B4410F', '#7A4BB7', '#0E7C86', '#A1306B'];
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function okIso(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')); }
  function calendarHtml() {
    var now = new Date(), ym = S.dash.cal || (now.getFullYear() + '-' + pad(now.getMonth() + 1));
    var Y = +ym.slice(0, 4), M = +ym.slice(5, 7) - 1;
    var first = new Date(Y, M, 1), days = new Date(Y, M + 1, 0).getDate(), lead = first.getDay();
    var weeks = Math.ceil((lead + days) / 7), start = new Date(Y, M, 1 - lead), end = new Date(Y, M, 1 - lead + weeks * 7 - 1);
    var s0 = isoOf(start), s1 = isoOf(end), today = isoOf(now);
    var prev = new Date(Y, M - 1, 1), next = new Date(Y, M + 1, 1);
    var q = S.dash.q.trim().toLowerCase();
    var stores = yearStores().filter(function (s) { return !q || [s.tenant, s.contractor, s.docNo, s.location].join(' ').toLowerCase().indexOf(q) >= 0; });
    var color = {};
    stores.slice().sort(function (a, b) { return a.seq - b.seq; }).forEach(function (s, i) { color[s.id] = CAL_COLORS[(Number(s.seq) || i) % CAL_COLORS.length]; });
    // 공사 기간 막대: 겹치지 않으면 같은 줄을 씀
    var bars = stores.filter(function (s) { return okIso(s.periodStart) && okIso(s.periodEnd) && s.periodStart <= s.periodEnd && s.periodEnd >= s0 && s.periodStart <= s1; })
      .sort(function (a, b) { return a.periodStart.localeCompare(b.periodStart) || a.seq - b.seq; });
    var laneEnd = [];
    bars.forEach(function (s) {
      for (var l = 0; l < laneEnd.length; l++) if (laneEnd[l] < s.periodStart) break;
      s._lane = l; laneEnd[l] = s.periodEnd;
    });
    var nm = function (s) { return esc(s.tenant || '(테넌트명 없음)'); };
    var agenda = [];
    var html = '<div class="calhead"><div class="calnav">' +
      '<button type="button" class="btn sm" data-act="calnav" data-m="' + isoOf(prev).slice(0, 7) + '" aria-label="이전 달">‹</button>' +
      '<h3>' + Y + '년 ' + (M + 1) + '월</h3>' +
      '<button type="button" class="btn sm" data-act="calnav" data-m="' + isoOf(next).slice(0, 7) + '" aria-label="다음 달">›</button>' +
      '<button type="button" class="btn sm" data-act="calnav" data-m="">오늘</button></div>' +
      '<div class="callegend"><span><i class="lg"></i>공사 기간</span><span>' + ICON.fire + ' 소방 점검</span><span>' + ICON.star + ' 오픈</span><span class="muted">누르면 그 매장 검토서가 열립니다</span></div></div>' +
      '<div class="cal"><div class="cdow">' + DOW.map(function (d, i) { return '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + d + '</div>'; }).join('') + '</div>';
    for (var w = 0; w < weeks; w++) {
      var wd = [];
      for (var i = 0; i < 7; i++) { var d = new Date(Y, M, 1 - lead + w * 7 + i); wd.push(isoOf(d)); }
      var inWeek = bars.filter(function (s) { return s.periodStart <= wd[6] && s.periodEnd >= wd[0]; });
      var lanes = inWeek.reduce(function (m, s) { return Math.max(m, s._lane + 1); }, 0);
      html += '<div class="cweek">';
      wd.forEach(function (k, i) {
        var out = k.slice(0, 7) !== ym;
        var cell = '<div class="cday' + (out ? ' out' : '') + (k === today ? ' today' : '') + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '"><div class="cnum"><span>' + (+k.slice(8)) + '</span></div>';
        for (var l = 0; l < lanes; l++) {
          var b = inWeek.filter(function (s) { return s._lane === l && s.periodStart <= k && s.periodEnd >= k; })[0];
          if (!b) { cell += '<div class="cbar gap"></div>'; continue; }
          var c = color[b.id], head = k === b.periodStart || i === 0;
          cell += '<span class="cbar' + (k === b.periodStart ? ' st' : '') + (k === b.periodEnd ? ' en' : '') + '" style="background:' + c + '1f;color:' + c + (k === b.periodStart ? ';border-left-color:' + c : '') + '" data-act="open" data-id="' + esc(b.id) + '" title="' + nm(b) + ' 공사 ' + esc(b.periodStart) + ' ~ ' + esc(b.periodEnd) + '">' + (head ? nm(b) : '&nbsp;') + '</span>';
        }
        stores.forEach(function (s) {
          if (s.fireCheckDate === k) cell += '<span class="cev fire" data-act="open" data-id="' + esc(s.id) + '"><span class="ci">' + ICON.fire + '</span><span class="tx"> ' + nm(s) + ' 소방점검</span></span>';
          if (s.openDate === k) cell += '<span class="cev" style="color:' + color[s.id] + '" data-act="open" data-id="' + esc(s.id) + '"><span class="ci">' + ICON.star + '</span><span class="tx"> ' + nm(s) + ' 오픈</span></span>';
        });
        html += cell + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    // 좁은 화면용 이번 달 일정 목록
    stores.forEach(function (s) {
      var add = function (d, t, cls) { if (okIso(d) && d.slice(0, 7) === ym) agenda.push({ d: d, t: t, s: s, cls: cls || '' }); };
      add(s.periodStart, '공사 시작'); add(s.periodEnd, '공사 끝'); add(s.fireCheckDate, ICON.fire + ' 소방 점검', 'fire'); add(s.openDate, ICON.star + ' 오픈');

        '<i style="background:' + color[a.s.id] + '"></i><b>' + nm(a.s) + '</b><span class="' + a.cls + '">' + a.t + '</span></button>';
    }).join('') : '<div class="small muted" style="padding:8px 0">이번 달 일정이 없습니다.</div>') + '</div>';
    return html;
  }

  /* ───────── 시방서 발송 ───────── */
  function specSentList(store) {

  }

  }

  }
  /* 보낸 메일·발송 기록: 시방서(시방서발송 칸) + 서류 요청·서명 요청·서명 완료·PDF 보관·하자 발송(발송기록 칸), 최근 순 */
  var LOG_T = { spec: ['시방서', 'sp'], doc: ['서류 요청', 'dc'], sigreq: ['서명 요청', 'sg'], sig: ['서명 완료', 'sg'], pdf: ['PDF 보관', 'pdf'], defect: ['하자 발송', 'hj'] };
  function sendLogAll(store) {

  }

      var m = String(x.at || '').match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);

  }
  function specOffline() {

  /* ───────── 검토서 PDF 만들기 (화면에 띄우지 않고) ───────── */
  function makeReviewPdf() {
    var ready = Promise.all([document.fonts && document.fonts.ready ? document.fonts.ready : null, loadPrintLibs(), loadPhotos()]);
    return ready.then(function () {
      if (!window.html2pdf) throw new Error('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1';
      var host = document.createElement('div'); host.style.cssText = 'width:794px;background:#fff';
      wrap.appendChild(host); document.body.appendChild(wrap);
      var box;
      try {
        var pages = buildPages(host).pages;
        pages.forEach(function (p, i) { var n = $('.pnum', p); if (n) n.textContent = '출력 ' + nowFull() + ' · ' + (i + 1) + ' / ' + pages.length; });
        box = document.createElement('div'); box.style.cssText = 'width:794px;background:#fff';
        pages.forEach(function (p) { var c = p.cloneNode(true); c.style.transform = 'none'; c.style.boxShadow = 'none'; box.appendChild(c); });
        host.innerHTML = ''; host.appendChild(box);
      } catch (e) { wrap.remove(); throw e; }
      var keepY = window.scrollY; window.scrollTo(0, 0);
      return html2pdf().set({
        margin: 0, filename: pdfName(), image: { type: 'jpeg', quality: 0.92 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: 794 },
        jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] },
        pagebreak: { mode: ['legacy'] }
      }).from(box).outputPdf('datauristring').then(function (uri) { wrap.remove(); window.scrollTo(0, keepY); return uri; }, function (e) { wrap.remove(); window.scrollTo(0, keepY); throw e; });
    });
  }
  /** P. 검토 완료 저장 뒤 그 차수 PDF를 드라이브에 자동 보관 (뒤에서 조용히) */

  /* ───────── 원격 서명 ───────── */
  var SIGW = {
    safety: { l: '안전관리팀', name: 'safetyName', tel: 'safetyTel', sig: 'safetySig', org: function () { return '롯데쇼핑'; } },
    sales: { l: '영업팀', name: 'salesName', tel: 'salesTel', sig: 'salesSig', org: function () { return '롯데쇼핑'; } },
    resp: { l: '인테리어 공사 책임자', name: 'respName', tel: 'respTel', sig: 'respSig', org: function (r) { return r.respOrg || r.contractorCompany || ''; } }
  };
  var EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
  function sigPending(store) { try { return JSON.parse((store && store.sigPending) || '{}') || {}; } catch (e) { return {}; } }
  function sigPendOf(w) {
    var p = sigPending(S.store)[S.round + ':' + w];
    return p && p.exp > Date.now() ? p : null;
  }
  function sigReqHtml(w) {
    if (!S.review || S.review[SIGW[w].sig]) return '';
    var p = sigPendOf(w);
    if (p) return '<button type="button" class="sreq wait" data-act="sigReq" data-w="' + w + '" title="다시 보내기">⏳ 서명 요청 보냄 · ' + shortWhen(p.at) + '</button>';
    return '<button type="button" class="sreq" data-act="sigReq" data-w="' + w + '">' + ICON.mail + ' 원격 서명 요청</button>';
  }
  function mergeRemoteSigs(saved) {
    var got = null;
    Object.keys(SIGW).forEach(function (w) {
      var c = SIGW[w];
      if (!S.review[c.sig] && saved[c.sig]) {
        got = got || {};
        [c.sig, c.sig + 'Date', c.name, c.tel].forEach(function (k) { if (saved[k] && !S.review[k]) { S.review[k] = saved[k]; got[k] = saved[k]; } });
      }
    });
    if (got && S.view === 'edit') {
      Object.keys(got).forEach(function (k) { var i = $('#f-' + k); if (i) i.value = got[k]; });
      Object.keys(SIGW).forEach(function (w) { refreshSig(SIGW[w].sig, SIGW[w].l); });
      updateProgress();
    }
    return got;
  }
  function openSigReq(first, st) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { specOffline(); return; }
    var em = S.boot.sigEmails || {};
    if (!st) st = { sel: [first], email: { resp: String(S.review.contractorEmail || '').trim(), safety: em.safety || '', sales: em.sales || '' } };
    var rows = Object.keys(SIGW).map(function (w) {
      var c = SIGW[w], done = !!S.review[c.sig], p = sigPendOf(w), on = !done && st.sel.indexOf(w) >= 0;
      var who = [c.org(S.review), S.review[c.name]].filter(Boolean).join(' ');
      return '<label class="sfile' + (on ? ' on' : '') + (done ? ' off' : '') + '" style="flex-wrap:wrap"><input type="checkbox" data-sw="' + w + '"' + (on ? ' checked' : '') + (done ? ' disabled' : '') + '>' +
        '<span style="flex:1;min-width:0"><b>' + c.l + '</b>' + (who ? ' · ' + esc(who) : '') +
        (done ? '<br><span class="small muted">이미 서명함</span>'
          : (on ? '<input class="inp sremail" type="email" data-se="' + w + '" value="' + esc(st.email[w] || '') + '" placeholder="이메일" autocomplete="off" aria-label="' + c.l + ' 이메일">' + (w !== 'resp' && em[w] && st.email[w] === em[w] ? '<span class="small muted">지난번 쓴 주소입니다</span>' : '') : '') +
            (p ? '<br><span class="small" style="color:var(--orange)">⏳ ' + shortWhen(p.at) + ' 요청 보냄 · 아직 서명 전 (다시 보내면 예전 링크는 끝납니다)</span>' : '')) +
        '</span></label>';
    }).join('');
    var sel = st.sel.filter(function (w) { return !S.review[SIGW[w].sig]; });
    var bad = sel.filter(function (w) { return !EMAIL_RE.test(String(st.email[w] || '').trim()); });
    layer.innerHTML = '<div class="overlay no-print"><section class="dialog spec-dlg" role="dialog" aria-modal="true" aria-label="원격 서명 요청" style="max-width:560px">' +
      '<h3>' + ICON.mail + ' 원격 서명 요청</h3><div class="small muted" style="margin-top:6px">서명할 사람을 고르고 이메일을 확인하세요. 검토서 PDF 링크와 서명 링크를 함께 보냅니다.</div>' +
      '<div style="display:grid;gap:10px;margin-top:16px">' + rows + '</div>' +
      '<div class="small muted" style="margin-top:10px;line-height:1.6">· 서명 링크는 그 사람의 서명 칸만 열리고, 서명하면 끝납니다 (7일 후 만료)<br>· 검토서 PDF는 지금 내용으로 만들어 드라이브에 올리고 보기 전용 링크로 보냅니다</div>' +
      '<div class="warnbox" id="srBad"' + (sel.length && bad.length ? '' : ' hidden') + '>' + ICON.warn + ' 이메일을 확인해 주세요.</div>' +
      '<div class="acts"><button type="button" class="btn" id="srCancel">취소</button><button type="button" class="btn pri main-act" id="srGo"' + (sel.length && !bad.length ? '' : ' disabled') + '>' + (sel.length ? sel.length + '명에게 ' : '') + '요청 보내기</button></div></section></div>';
    var ov = $('.overlay', layer);
    var keepEmails = function () { $$('[data-se]', ov).forEach(function (i) { st.email[i.dataset.se] = i.value.trim(); }); };
    ov.addEventListener('change', function (e) {
      var w = e.target.dataset && e.target.dataset.sw; if (!w) return;
      keepEmails();
      st.sel = Object.keys(SIGW).filter(function (k) { return k === w ? e.target.checked : st.sel.indexOf(k) >= 0; });
      openSigReq(first, st);
    });
    ov.addEventListener('input', function (e) {
      if (!e.target.dataset || !e.target.dataset.se) return;
      keepEmails();
      var s2 = st.sel.filter(function (w) { return !S.review[SIGW[w].sig]; });
      var ok = s2.length && s2.every(function (w) { return EMAIL_RE.test(String(st.email[w] || '')); });
      var go = $('#srGo'); if (go) go.disabled = !ok;
      var bx = $('#srBad'); if (bx) bx.hidden = !!ok;
    });
    ov.addEventListener('click', function (e) {
      if (e.target === ov || e.target.id === 'srCancel') { closeModal(); return; }
      if (e.target.id !== 'srGo' || e.target.disabled) return;
      keepEmails();
      var reqs = st.sel.filter(function (w) { return !S.review[SIGW[w].sig]; }).map(function (w) { return { who: w, email: st.email[w] }; });
      var needSave = !isLocked() && (S.dirty || !S.store);
      (needSave ? save(false, true) : Promise.resolve(true)).then(function (ok) {
        if (!ok) { closeModal(); return; }
        var pk = pendingKey({ storeId: S.store ? S.store.id : '', clientId: S.clientId, round: S.round });
        if (!S.store || pendingAll()[pk]) { specOffline(); return; }
        layer.innerHTML = '<div class="overlay no-print"><section class="dialog" style="max-width:440px"><h3>' + ICON.mail + ' 보내는 중…</h3><div class="small muted" style="margin-top:10px" id="srStep">검토서 PDF를 만드는 중…</div></section></div>';
        makeReviewPdf().then(function (uri) {
          var stp = $('#srStep'); if (stp) stp.textContent = 'PDF를 드라이브에 올리고 서명 요청 메일을 보내는 중…';
          return api('apiSigRequest', S.auth, S.store.id, S.round, reqs, uri, pdfName());
        }).then(function (b) {
          S.store = b.store; S.stores = S.stores.map(function (x) { return x.id === b.store.id ? b.store : x; });
          if (b.sigEmails) S.boot.sigEmails = b.sigEmails;
          closeModal(); refreshSigReq(); updateSpecRec();
          toast(reqs.length + '명에게 서명 요청을 보냈습니다' + (b.fromOk ? '' : ' (구글 계정 주소로 보냄)'));
        }).catch(function (err) {
          if (isNetErr(err)) { specOffline(); return; }
          dialog({ title: '보내지 못했습니다', body: '<div style="margin-top:10px;line-height:1.7">' + esc(errMsg(err)) + '</div>', actions: [{ label: '확인', cls: 'pri main-act', value: 'ok' }] });
        });
      });
    });
  }

  /* ───────── 서명 페이지 (메일의 링크로 열림 · PIN 없음) ───────── */
  function renderSignPage(token) {
    S.view = 'sign';
    document.title = '공사 도면 검토서 서명';
    app.innerHTML = '<div class="signpg"><div class="loading">서명 정보를 불러오는 중…</div></div>';
    api('apiSignInfo', token).then(function (info) {
      app.innerHTML = '<div class="signpg">' +
        '<div class="small muted">' + esc(info.label) + ' · 시설팀</div><h1>공사 도면 검토서 서명</h1>' +
        '<div class="card sp-card"><b>' + esc(info.tenant) + '</b> · ' + info.round + '차 검토<br><span class="muted">문서번호 ' + esc(info.docNo) + '<br>서명: <b style="color:var(--ink)">' + esc(info.who) + '</b>' + (info.org ? ' · ' + esc(info.org) : '') + '</span>' +
        '<a class="btn sp-pdf" href="' + esc(info.pdfUrl) + '" target="_blank" rel="noopener"' + pvAttr({ name: info.docNo + '_' + info.round + '차.pdf', meta: info.tenant + ' · ' + info.round + '차 검토서' }) + '>' + ICON.file + ' 검토서 PDF 보기</a></div>' +
        '<div class="card sp-card"><div class="sp-h">서명하는 분</div>' +
        '<label class="lbl" for="spName" style="margin-top:10px">성명</label><input id="spName" class="inp" maxlength="40" value="' + esc(info.name) + '" autocomplete="name">' +
        '<label class="lbl" for="spTel" style="margin-top:10px">연락처</label><input id="spTel" class="inp" type="tel" inputmode="numeric" maxlength="13" value="' + esc(info.tel) + '" autocomplete="tel"></div>' +
        '<div class="card sp-card"><div class="sp-h">아래 칸에 서명해 주세요</div><div class="small muted">손가락이나 펜, PC에서는 마우스로 쓰면 됩니다</div>' +
        '<div class="sp-padwrap" id="spWrap"><canvas id="spPad" class="sp-pad" aria-label="서명 칸"></canvas></div>' +
        '<div class="sp-btns"><button type="button" class="btn" id="spClear">다시 쓰기</button><button type="button" class="btn pri" id="spSend">서명 보내기</button></div>' +
        '<div class="small sp-err" id="spErr" role="alert"></div></div>' +
        '<div class="small muted sp-foot">서명은 휴대폰으로 진행 가능합니다 · 링크는 ' + esc(info.until) + '까지</div></div>';
      var c = $('#spPad'), ctx = c.getContext('2d');
      var gd = guideAttach($('#spWrap'), info.guide);
      var pen = sigPen(c, ctx, gd);
      function fit() {
        var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        var keep = pen.drawn ? c.toDataURL() : null;
        c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#18202B'; ctx.lineWidth = 3;
        if (keep) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
      }
      fit(); window.addEventListener('resize', fit);
      $('#spClear').onclick = function () { ctx.clearRect(0, 0, c.width, c.height); pen.reset(); gd.show(); };
      $('#spTel').addEventListener('input', function (e) {
        var d = e.target.value.replace(/\D/g, '').slice(0, 11);
        e.target.value = d.length < 4 ? d : d.length < 8 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
      });
      $('#spSend').onclick = function () {
        var name = $('#spName').value.trim(), tel = $('#spTel').value.trim(), err = $('#spErr');
        if (!name || tel.replace(/\D/g, '').length < 9 || !pen.drawn) { err.textContent = '성명·연락처를 넣고 서명해야 보낼 수 있습니다'; return; }
        var url = exportSig(c, 480, 160); if (url.length > 44000) url = exportSig(c, 360, 120);
        var btn = $('#spSend'); btn.disabled = true; btn.textContent = '보내는 중…'; err.textContent = '';
        api('apiSignSubmit', token, { name: name, tel: tel, sig: url }).then(function (r) {
          app.innerHTML = '<div class="signpg"><div class="card sp-card sp-done"><div class="dlg-ic" style="background:#E8F5EE;margin:0 auto 12px">✓</div>' +
            '<h1 style="text-align:center">서명이 전달되었습니다</h1><div class="muted" style="text-align:center;line-height:1.7">' + esc(r.tenant) + ' 공사 도면 검토서 · ' + esc(r.who) + '<br>감사합니다. 이 창은 닫아도 됩니다.</div></div></div>';
        }, function (e) { btn.disabled = false; btn.textContent = '서명 보내기'; err.textContent = errMsg(e); });
      };
    }, function (e) {
      app.innerHTML = '<div class="signpg"><div class="card sp-card"><h1>서명 링크를 열 수 없습니다</h1><div class="muted" style="margin-top:8px;line-height:1.7">' + esc(errMsg(e)) + '</div></div></div>';
    });
  }

  /** 9번 소장 확인: 저장과 따로 바로 시트에 (저장 전 새 검토서면 먼저 저장) */
  function setChiefOk(box) {
    var on = box.checked;
    if (S.auth.role !== '소장') { box.checked = !on; return; }
    box.disabled = true;
    (S.store ? Promise.resolve(true) : save(false, true)).then(function (ok) {
      if (!ok || !S.store) throw new Error('먼저 검토서를 저장해 주세요.');
      return api('apiSetChiefOk', S.auth, S.store.id, S.round, on);
    }).then(function (b) {
      S.store = b.store;
      S.reviews = b.reviews;
      S.review.chiefOk = on;
      S.stores = S.stores.map(function (x) { return x.id === b.store.id ? b.store : x; });
      updateProgress();
      toast(on ? '시설 소장 확인했습니다' : '시설 소장 확인을 취소했습니다');
    }).catch(function (e) {
      box.checked = !on;
      toast(isNetErr(e) ? '인터넷 연결이 끊겨 시설 소장 확인을 저장하지 못했습니다. 연결된 뒤 다시 눌러 주세요.' : errMsg(e), true);
    }).then(function () { box.disabled = false; });
  }

  function confirmStore(id) {
    var s = S.stores.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    var toConfirm = s.status !== '컨펌완료';
    dialog({
      title: toConfirm ? '컨펌완료 처리할까요?' : '컨펌완료를 취소할까요?',
      icon: toConfirm ? '<div style="width:48px;height:48px;border-radius:24px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:16px">' + ICON.check + '</div>' : '',
      body: '<div class="muted small" style="margin-top:6px;line-height:1.6">' +
        (toConfirm ? '완료 후에는 검토서 내용을 수정할 수 없습니다.' : '취소하면 협의중 상태로 돌아가고 수정이 다시 가능해집니다.') + '</div>' +
        '<div class="dl"><span class="muted">매장</span><b>' + esc(s.tenant) + '</b><span class="muted">협의 차수</span><span>' + s.currentRound + '차</span>' +
        '<span class="muted">문서번호</span><span>' + esc(s.docNo) + '</span><span class="muted">처리자</span><span>' + esc(S.auth.role) + '</span></div>',
      actions: [
        { label: '취소', value: false },
        { label: toConfirm ? '컨펌완료 확정' : '완료 취소', cls: (toConfirm ? 'green' : 'warn') + ' main-act', value: true }
      ]
    }).then(function (ok) {
      if (!ok) return;
      return api('apiSetConfirmed', S.auth, id, toConfirm).then(function (list) {
        S.stores = list; S.syncedAt = nowHM();
        renderDashBody();
        toast(toConfirm ? '컨펌완료로 처리했습니다' : '컨펌완료를 취소했습니다');
      });
    }).catch(function (e) { toast(errMsg(e), true); });
  }

  function switchRole(role) {
    if (role === S.auth.role) return;
    dialog({
      title: role + '(으)로 전환',
      body: '<label class="lbl" for="swpin" style="margin-top:14px">' + esc(role) + ' PIN</label><input id="swpin" class="inp" type="password" inputmode="numeric" maxlength="8"><div class="err" id="swerr"></div>',
      focus: '#swpin',
      actions: [
        { label: '취소', value: null },
        {
          label: '전환', cls: 'pri main-act', value: 'go', keep: function () {
            var pin = $('#swpin').value;
            api('apiLogin', { role: role, pin: pin }).then(function (r) {
              S.auth = r && r.token ? { role: role, token: r.token } : { role: role, pin: pin }; authKeep(S.auth); closeModal();
              toast(role + '(으)로 전환했습니다');
              if (S.view === 'dash') renderDashboard();
            }).catch(function (e) { var el = $('#swerr'); if (el) el.textContent = errMsg(e); });
            return false;
          }
        }
      ]
    });
  }

  /* ───────── 검토서 편집 ───────── */
  function blankReview() {
    var r = {};
    S.boot.fields.forEach(function (f) { r[f[0]] = f[2] === 'bool' ? false : ''; });
    r.reviewDate = todayISO();
    r.status = '작성중';
    return r;
  }

  function applyBundle(b, round) {
    S.store = b.store;
    S.reviews = b.reviews || [];
    var r = null;
    if (round) r = S.reviews.filter(function (x) { return Number(x.round) === Number(round); })[0];
    if (!r) r = S.reviews[S.reviews.length - 1];
    S.review = Object.assign(blankReview(), r || {});
    S.round = Number(S.review.round) || 1;
  }

  function isLocked() { return !!(S.store && S.store.status === '컨펌완료'); }
  function isLatest() { return !S.reviews.length || S.round === Number(S.reviews[S.reviews.length - 1].round); }

  function companyOptions() {
    return (S.boot.companies || []).map(function (c) { return '<option value="' + esc(c.name) + '">' + esc(c.kind) + '</option>'; }).join('');
  }
  function refreshCompanies() {
    api('apiCompanies', S.auth).then(function (list) {
      S.boot.companies = list;
      var dl = $('#dl-company'); if (dl) dl.innerHTML = companyOptions();
    }).catch(function () { /* 목록 갱신 실패는 무시 */ });
  }
  function mergeCompanies(r) {
    var list = S.boot.companies || (S.boot.companies = []);
    [['owner', '발주처'], ['contractor', '시공업체']].forEach(function (p) {
      var name = String(r[p[0] + 'Company'] || '').trim(); if (!name) return;
      var c = { name: name, kind: p[1], person: r[p[0] + 'Name'] || '', tel: r[p[0] + 'Tel'] || '', email: r[p[0] + 'Email'] || '' };
      var i = list.map(function (x) { return x.name; }).indexOf(name);
      if (i >= 0) list[i] = c; else list.push(c);
    });
    var dl = $('#dl-company'); if (dl) dl.innerHTML = companyOptions();
  }

  function openEditor(storeId, round) {
    S.view = 'edit';
    closeGuide();
    refreshCompanies();
    if (!storeId) {
      S.store = null; S.reviews = []; S.round = 1; S.review = blankReview(); S.dirty = false;
      S.clientId = 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      renderEditor();
      return Promise.resolve();
    }
    loading('검토서를 불러오는 중…');
    return api('apiGetStore', S.auth, storeId).then(function (b) {
      applyBundle(b, round); S.dirty = false;
      var pend = pendingAll()[storeId + '#' + S.round];
      if (pend) Object.assign(S.review, pend.review); // 이 기기에 보관한 더 새 내용
      renderEditor();
      if (pend) setSaveState('pending', '저장 대기 중 · 연결되면 자동 저장');
    }).catch(function (e) { toast(errMsg(e), true); openDashboard(); });
  }

  function dis() { return isLocked() ? ' disabled' : ''; }

  /* 주방공사 "없음"이면 자동으로 해당없음 + 비활성화되는 항목 */
  var KDEP = ['waterproof', 'waterTest', 'kitchenExt', 'exhaustCmh', 'gasGrade', 'gasAlarm'], NA = '해당없음';
  /* 매장형태 팝업·VP: 주방·급배수·가스 전부 + 설비 추가·이설 수량 */
  var POPUP = ['팝업', 'VP'];
  var PDEP = ['kitchen', 'waterproof', 'waterTest', 'supplyPipeA', 'drainPipeA', 'kitchenExt', 'exhaustCmh', 'gasGrade', 'gasAlarm',
    'sprReplace', 'detReplace', 'diffReplace'];
  function isPopup() { return POPUP.indexOf(S.review.storeType) >= 0; }
  function naKeys() { return isPopup() ? PDEP : S.review.kitchen === '없음' ? KDEP : []; }

  var CHG_SKIP = ['reviewDate', 'notes', 'rulesAck', 'safetySig', 'salesSig', 'respSig', 'safetySigDate', 'salesSigDate', 'respSigDate',
    'agreeChecks', 'agreeRespSig', 'agreeRespSigDate', 'agreeLotteSig', 'agreeLotteSigDate'];
  function updateChanges() {
    var prev = prevReview(), n = 0;
    S.boot.fields.forEach(function (f) {
      var k = f[0];
      if (CHG_SKIP.indexOf(k) >= 0) return;
      var changed = !!prev && String(prev[k] == null ? '' : prev[k]) !== String(S.review[k] == null ? '' : S.review[k]);
      if (changed) n++;

      $$('[data-chg="' + k + '"]').forEach(function (b) { b.hidden = !changed; b.title = tip; });
      $$('[data-field="' + k + '"][data-bare]').forEach(function (i) { i.classList.toggle('chg', changed); i.title = changed ? tip : ''; });
    });
